function renderHist() {
  const all = load('inspections', []);
  const q = S.histSearch.toLowerCase();
  const ql = normalizeKana(S.histSearch);  // ← 正規化済みクエリ
  const f = S.histFilter;

  const data = all.filter(r => {
    let mq;
    if (S.histMfrFilter) {
      // メーカーID で絞り込み
      mq = r.manufacturerId === S.histMfrFilter;
      // ID がない旧データはメーカー名で fallback
      if (!mq && r.manufacturerName) {
        const mfrObj = [...ALL_MANUFACTURERS, ...load('customMfrs',[])].find(m => m.id === S.histMfrFilter);
        if (mfrObj) {
          const names = [mfrObj.name, mfrObj.jaName].filter(Boolean).map(n=>normalizeKana(n));
          mq = names.includes(normalizeKana(r.manufacturerName));
        }
      }
    } else if (S.histProductFilter) {
      // 製品名で絞り込み
      mq = r.productName === S.histProductFilter;
    } else {
      // テキスト検索（ひらがな↔カタカナ正規化）
      mq = !ql || normalizeKana(r.productName).includes(ql)
              || normalizeKana(r.manufacturerName||'').includes(ql)
              || normalizeKana(r.manufacturerId||'').includes(ql);
    }
    let mf;
    if (f === 'all') {
      mf = true;
    } else if (f === 'caution') {
      mf = r.photos?.some(p => typeof p !== 'string' && p.usability === 'caution');
    } else {
      mf = r.result === f;
    }
    return mq && mf;
  });

  const el = document.getElementById('histList');
  if (!data.length) {
    el.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>検品記録はありません</p>
    </div>`;
    return;
  }

  const statusLbls = { pass:'使用可', fail:'使用否', review:'確認中' };

  el.innerHTML = data.map(r => {
    const clickAttr = histEditMode ? '' : `onclick="openDetail('${r.id}')"`;
    const cardStyle = histEditMode ? 'cursor:default;' : '';

    // 判断区分ドット色
    const dotCls = r.judgeType === '恒久判断' ? 'hc-dot-perm'
                 : r.judgeType === '暫定判断' ? 'hc-dot-prov'
                 : 'hc-dot-none';

    // 削除モード：削除ボタン
    const delBtn = histEditMode
      ? `<button onclick="event.stopPropagation();deleteInspection('${r.id}')"
           style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;
                  background:var(--fail-dim);border-radius:50%;border:none;cursor:pointer;color:var(--fail);flex-shrink:0;">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
         </button>`
      : '';

    return `<div class="hist-card" style="${cardStyle}" ${clickAttr}>
      <div class="hc-body">
        <span class="hc-name">${r.productName}</span>
        ${r.manufacturerName ? `<span class="hc-mfr">${r.manufacturerName}</span>` : ''}
      </div>
      ${histEditMode ? delBtn : `<span class="hc-date">${fmtDate(r.createdAt)}</span>`}
    </div>`;
  }).join('');
}

/** ひらがな↔カタカナ正規化（どちらで入力しても一致させる） */
function normalizeKana(str) {
  // ひらがな → カタカナ に統一して比較
  return (str || '').replace(/[\u3041-\u3096]/g,
    c => String.fromCharCode(c.charCodeAt(0) + 0x60)
  ).toLowerCase();
}

/** 検索テキストのハイライト */
function hlText(text, q) {
  if (!q || !text) return text || '';
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0,idx)
    + `<span class="hist-sug-hl">${text.slice(idx, idx+q.length)}</span>`
    + text.slice(idx + q.length);
}

/** 候補ドロップダウン描画 */
function renderHistSuggestions(rawQ) {
  const dd = document.getElementById('histSuggestDd');
  if (!dd) return;
  const q = rawQ ? rawQ.trim() : '';
  if (!q) { dd.classList.remove('open'); return; }
  const ql = normalizeKana(q);   // ← ひらがな→カタカナ正規化

  const allMfrs = [...ALL_MANUFACTURERS, ...load('customMfrs', [])];
  // メーカー（最大3件）: jaName / name / id で一致
  const matchMfrs = allMfrs.filter(m => {
    const n  = normalizeKana(m.name);
    const jn = normalizeKana(m.jaName);
    const id = normalizeKana(m.id);
    return jn.includes(ql) || n.includes(ql) || id.includes(ql);
  }).slice(0, 3);

  // 製品（最大7件）: products リストと過去履歴の productName
  const baseProds = new Set([...load('products', SAMPLE_PRODUCTS)]);
  load('inspections',[]).forEach(r => { if(r.productName) baseProds.add(r.productName); });
  const matchProds = [...baseProds].filter(p => normalizeKana(p).includes(ql)).slice(0, 7);

  if (!matchMfrs.length && !matchProds.length) {
    dd.classList.remove('open'); return;
  }

  const mfrIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="17" height="17"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 9l9-6 9 6"/></svg>`;
  const prdIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="17" height="17"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;

  let html = '';
  matchMfrs.forEach(m => {
    const jaName = m.jaName || m.name;
    html += `<div class="hist-sug-item" onmousedown="event.preventDefault();selectHistMfr('${m.id}','${jaName.replace(/'/g,'&#39;')}')">
      <div class="hist-sug-icon mfr">${mfrIcon}</div>
      <div class="hist-sug-info">
        <div class="hist-sug-name">${hlText(jaName, q)}</div>
        <div class="hist-sug-sub">メーカー</div>
      </div>
    </div>`;
  });
  matchProds.forEach(p => {
    html += `<div class="hist-sug-item" onmousedown="event.preventDefault();selectHistProduct('${p.replace(/'/g,'&#39;')}')">
      <div class="hist-sug-icon prd">${prdIcon}</div>
      <div class="hist-sug-info">
        <div class="hist-sug-name">${hlText(p, q)}</div>
      </div>
    </div>`;
  });
  dd.innerHTML = html;
  dd.classList.add('open');
}

function drawDonut(pass, fail, review, total) {
  const svg    = document.getElementById('donutSvg');
  const legend = document.getElementById('donutLegend');
  const R = 68, cx = 100, cy = 100;
  const C = 2 * Math.PI * R;

  if (!total) {
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--border)" stroke-width="22"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" fill="var(--text-3)" font-family="sans-serif">データなし</text>`;
    legend.innerHTML = '';
    return;
  }

  const segs = [
    { val:pass,   color:'var(--pass)',   lbl:'使用可' },
    { val:fail,   color:'var(--fail)',   lbl:'使用否' },
    { val:review, color:'var(--review)', lbl:'要確認' },
  ].filter(s => s.val > 0);

  let off = 0, paths = '';
  segs.forEach(s => {
    const dash = (s.val / total) * C;
    paths += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="22"
      stroke-dasharray="${dash} ${C - dash}"
      stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})" opacity=".88"/>`;
    off += dash;
  });

  svg.innerHTML = paths +
    `<text x="${cx}" y="${cy-7}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text)" font-family="sans-serif">${total}</text>
     <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="11" fill="var(--text-2)" font-family="sans-serif">総数</text>`;

  legend.innerHTML = segs.map(s => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <div style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0"></div>
      <span style="font-size:13px;color:var(--text-2);font-weight:500">${s.lbl}</span>
      <span style="font-size:15px;font-weight:800;color:var(--text);margin-left:8px">${s.val}</span>
    </div>
  `).join('');
}

function drawMfrBars(all) {
  const cnt = {};
  all.filter(r => r.result === 'fail').forEach(r => {
    cnt[r.manufacturerName] = (cnt[r.manufacturerName] || 0) + 1;
  });
  const sorted = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;
  const el = document.getElementById('mfrChart');
  if (!sorted.length) { el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">データなし</div>`; return; }
  el.innerHTML = sorted.map(([name,cnt]) => `
    <div class="bar-item">
      <div class="bar-lbl">${name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(cnt/max*100).toFixed(1)}%;background:linear-gradient(90deg,#f87171,#ef4444)"></div>
      </div>
      <div class="bar-cnt">${cnt}</div>
    </div>
  `).join('');
}

function drawMonthBars(all) {
  const months = {};
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months[k] = { lbl:`${d.getMonth()+1}月`, pass:0, fail:0, review:0 };
  }
  all.forEach(r => {
    const d = new Date(r.createdAt);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (months[k]) months[k][r.result]++;
  });

  const data   = Object.values(months);
  const maxV   = Math.max(...data.map(d => d.pass + d.fail + d.review), 1);
  const BAR_H  = 80;

  document.getElementById('monthChart').innerHTML = data.map(d => {
    const tot = d.pass + d.fail + d.review;
    const h   = tot > 0 ? Math.max(6, (tot / maxV) * BAR_H) : 4;
    const ph  = tot ? (d.pass   / tot) * h : 0;
    const fh  = tot ? (d.fail   / tot) * h : 0;
    const rh  = tot ? (d.review / tot) * h : h;
    return `<div class="month-bar">
      ${tot ? `<div class="month-cnt">${tot}</div>` : '<div class="month-cnt" style="opacity:0">0</div>'}
      <div class="month-bar-inner" style="height:${h}px">
        <div style="height:${rh}px;background:var(--review)"></div>
        <div style="height:${fh}px;background:var(--fail)"></div>
        <div style="height:${ph}px;background:var(--pass)"></div>
      </div>
      <div class="month-lbl">${d.lbl}</div>
    </div>`;
  }).join('');
}

/** カスタムメーカーを設定ページから削除 */
function deleteCustomMfrFromSettings(id) {
  const customs = load('customMfrs', []);
  const mfr     = customs.find(m => m.id === id);
  const updated = customs.filter(m => m.id !== id);
  save('customMfrs', updated);
  // もし現在選択中のメーカーが削除対象なら選択解除
  if (S.selectedMfr === id) {
    S.selectedMfr = null;
    renderMfr();
  }
  renderSettingsMasterData();
  updateMasterDataCount();
  showToast(mfr ? `「${mfr.name}」を削除しました` : 'メーカーを削除しました', 'default');
}

/** 製品名を設定ページから削除 */
function deleteProductFromSettings(name) {
  const ph = load('products', []);
  save('products', ph.filter(p => p !== name));
  renderSettingsMasterData();
  updateMasterDataCount();
  showToast(`「${name}」を削除しました`, 'default');
}

/** ビルトインメーカーを非表示にする */
function hideBuiltInMfr(id) {
  const hidden = load('hiddenMfrs', []);
  if (!hidden.includes(id)) {
    hidden.push(id);
    save('hiddenMfrs', hidden);
  }
  renderSettingsMasterData();
  updateMasterDataCount();
  const m = ALL_MANUFACTURERS.find(x => x.id === id);
  showToast(m ? `「${m.jaName || m.name}」を削除しました` : 'メーカーを削除しました', 'default');
}

/** ビルトインメーカーを表示に戻す */
function restoreBuiltInMfr(id) {
  const hidden = load('hiddenMfrs', []);
  save('hiddenMfrs', hidden.filter(h => h !== id));
  renderSettingsMasterData();
  updateMasterDataCount();
  const m = ALL_MANUFACTURERS.find(x => x.id === id);
  showToast(m ? `「${m.jaName || m.name}」を復元しました` : 'メーカーを復元しました', 'success');
}

async function saveUserEdit() {
  const uid   = document.getElementById('editUserId').value;
  const name  = document.getElementById('editUserName').value.trim();
  const empId = document.getElementById('editUserEmpId').value.trim();
  const isAdm = document.getElementById('editAdminToggle').classList.contains('on');

  if (!name) { showToast('氏名を入力してください', 'error'); return; }

  try {
    const updates = { name, employeeId: empId, initials: name.charAt(0), isAdmin: isAdm };
    await db.collection('users').doc(uid).update(updates);

    // ローカルキャッシュ更新
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) Object.assign(_allUsersCache[idx], updates);

    // 確認者リストも更新
    const inspList = getInspectors();
    const inspIdx  = inspList.findIndex(i => i.id === uid);
    if (inspIdx >= 0) {
      inspList[inspIdx].name = name;
      inspList[inspIdx].employeeId = empId;
      inspList[inspIdx].initials = name.charAt(0);
      save('inspectors', inspList);
      renderInspectors();
    }

    // 自分自身のプロフィールを更新
    if (uid === currentUser?.uid) {
      currentUserProfile = { ...currentUserProfile, ...updates };
      document.getElementById('settingsUserName').textContent = name;
      const settingsEmpEl2 = document.getElementById('settingsUserEmp');
      if (settingsEmpEl2) settingsEmpEl2.textContent = empId ? `社員ID: ${empId}` : currentUser.email;
    }

    closeUserEditModal();
    renderUserList(_allUsersCache);
    showToast('ユーザー情報を更新しました', 'success');
  } catch(e) {
    showToast('更新に失敗しました', 'error');
  }
}

      document.getElementById('darkToggle').classList.add('on');
    }
  } catch(e) {}

  // ── スマホキーボード対応 ──────────────────────────────────────
  // visualViewport がリサイズされたとき（＝キーボード開閉時）に
  // 製品名入力欄がアクティブなら候補リストが見えるよう再スクロール
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      if (document.activeElement && document.activeElement.id === 'productInput') {
        const vvh  = window.visualViewport.height;
        const rect = document.activeElement.getBoundingClientRect();
        const SUGGEST_ESTIMATE = 230;
        const PADDING = 16;
        const needed = rect.bottom + SUGGEST_ESTIMATE + PADDING;
        if (needed > vvh) {
          window.scrollBy({ top: needed - vvh, behavior: 'smooth' });
        }
      }
    });
  }

  // ── ロットピッカー：背面スクロール防止（iOS Safari 対策）──────────
  // lot-picker-bg 上の touchmove はデフォルト動作を止める。
  // ただしピッカー列（.lot-picker-col-inner）内は慣性スクロールが必要なので通過させる。
  const lotBg = document.getElementById('lotPickerBg');
  if (lotBg) {
    lotBg.addEventListener('touchmove', function(e) {
      const col = e.target.closest('.lot-picker-col-inner');
      if (!col) e.preventDefault();
    }, { passive: false });
  }
}

}

// ============================================================

const LP_ITEM_H = 44;
const LP_SPACER = 88; // 2アイテム分の余白

let _lpState = { y: 2026, m: 6, d: 1 };
let _lpScrollTimers = {};

function _lpDaysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function _lpYearsList() {
  const base = new Date().getFullYear();
  return Array.from({length: 9}, (_, i) => `${base - 3 + i}年`);
}
function _lpYearFromIdx(idx) { return new Date().getFullYear() - 3 + idx; }
function _lpIdxFromYear(y)   { return Math.max(0, Math.min(y - (new Date().getFullYear() - 3), 8)); }

function _lpBuildCol(innerId, items, selIdx) {
  const inner = document.getElementById(innerId);
  if (!inner) return;
  inner.innerHTML = '';
  const st = document.createElement('div'); st.className = 'lot-picker-spacer'; inner.appendChild(st);
  items.forEach(txt => {
    const el = document.createElement('div'); el.className = 'lot-picker-item'; el.textContent = txt; inner.appendChild(el);
  });
  const en = document.createElement('div'); en.className = 'lot-picker-spacer'; inner.appendChild(en);
  requestAnimationFrame(() => { inner.scrollTop = Math.max(0, selIdx) * LP_ITEM_H; });
}

function _lpGetIdx(innerId) {
  const inner = document.getElementById(innerId);
  return inner ? Math.round(inner.scrollTop / LP_ITEM_H) : 0;
}

function _lpSnap(inner) {
  const items = inner.querySelectorAll('.lot-picker-item').length;
  const idx = Math.max(0, Math.min(Math.round(inner.scrollTop / LP_ITEM_H), items - 1));
  inner.scrollTo({ top: idx * LP_ITEM_H, behavior: 'smooth' });
  return idx;
}

function _lpSetListener(innerId, onSettled) {
  const inner = document.getElementById(innerId);
  if (!inner) return;
  if (inner._lpHandler) inner.removeEventListener('scroll', inner._lpHandler);
  inner._lpHandler = () => {
    clearTimeout(_lpScrollTimers[innerId]);
    _lpScrollTimers[innerId] = setTimeout(() => {
      const idx = _lpSnap(inner);
      if (onSettled) onSettled(idx);
    }, 120);
  };
  inner.addEventListener('scroll', inner._lpHandler, { passive: true });
}

function _lpRebuildDay() {
  const dCount = _lpDaysInMonth(_lpState.y, _lpState.m);
  const curD   = Math.min(_lpState.d, dCount);
  _lpBuildCol('lpInnerDay', Array.from({length: dCount}, (_, i) => `${i + 1}日`), curD - 1);
  _lpSetListener('lpInnerDay', idx => { _lpState.d = idx + 1; });
}

function openLotPicker() {
  const cur = (S.lotNumber || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (cur) {
    _lpState = { y: +cur[1], m: +cur[2], d: +cur[3] };
  } else {
    const now = new Date();
    _lpState = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
  }

  _lpBuildCol('lpInnerYear',  _lpYearsList(), _lpIdxFromYear(_lpState.y));
  _lpBuildCol('lpInnerMonth', Array.from({length: 12}, (_, i) => `${i + 1}月`), _lpState.m - 1);
  _lpRebuildDay();

  _lpSetListener('lpInnerYear', idx => {
    const ny = _lpYearFromIdx(idx);
    if (ny !== _lpState.y) { _lpState.y = ny; _lpRebuildDay(); }
  });
  _lpSetListener('lpInnerMonth', idx => {
    const nm = idx + 1;
    if (nm !== _lpState.m) { _lpState.m = nm; _lpRebuildDay(); }
  });

  document.getElementById('lotPickerBg').classList.add('show');
  _lockScroll();
}

function closeLotPicker(confirm) {
  if (confirm) {
    const y = _lpYearFromIdx(_lpGetIdx('lpInnerYear'));
    const m = _lpGetIdx('lpInnerMonth') + 1;
    const d = Math.min(_lpGetIdx('lpInnerDay') + 1, _lpDaysInMonth(y, m));
    const fmt = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    const el = document.getElementById('lotInput');
    if (el) el.value = fmt;
    S.lotNumber = fmt;

    const trig = document.getElementById('lotTriggerText');
    if (trig) { trig.textContent = fmt; trig.style.color = 'var(--text)'; }
  }
  document.getElementById('lotPickerBg').classList.remove('show');
  _unlockScroll();
}

  errEl.textContent = '';

  if (!email) { errEl.textContent = 'ログインIDを入力してください'; return; }
  if (!pass)  { errEl.textContent = 'パスワードを入力してください'; return; }

  btn.textContent = '処理中...';
  btn.disabled    = true;
  try {
    // 'local'  = ブラウザ再起動後もログイン維持
    // 'session'= タブ/ブラウザを閉じると解除
    await auth.setPersistence(keep ? 'local' : 'session');
    await auth.signInWithEmailAndPassword(email, pass);
    // ログイン成功後はonAuthStateChangedがUI遷移を担うが、
    // 念のためボタンをリセット（画面遷移に失敗した場合の保険）
    btn.textContent = 'ログイン';
    btn.disabled    = false;
  } catch(e) {
    errEl.textContent = authErrMsg(e.code);
    btn.textContent   = 'ログイン';
    btn.disabled      = false;
  }
}



async function logoutUser() {
  try {
    await auth.signOut();
  } catch(e) {
    console.error('SignOut error:', e);
  }
  showToast('ログアウトしました','default');
}

function authErrMsg(code) {
  const m = {
    'auth/user-not-found':      'メールアドレスが見つかりません',
    'auth/wrong-password':      'パスワードが間違っています',
    'auth/invalid-credential':  'メールアドレスまたはパスワードが間違っています',
    'auth/email-already-in-use':'このメールアドレスはすでに使用されています',
    'auth/weak-password':       'パスワードは6文字以上にしてください',
    'auth/invalid-email':       'メールアドレスの形式が正しくありません',
    'auth/too-many-requests':   'ログイン試行が多すぎます。しばらく待ってください',
  };
  return m[code] || `エラーが発生しました（${code}）`;
}
