<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="製品の使用可否を判定する検品アプリ">
<title>検品アプリ</title>
<style>
/* =====================================================
   CSS変数（テーマカラー）
   ===================================================== */
:root {
  --bg:         #edf0f8;
  --surface:    #ffffff;
  --surface-2:  #f4f5fa;
  --primary:    #6366f1;
  --primary-dim:#eef2ff;
  --primary-b:  #c7d2fe;
  --text:       #1a1a2e;
  --text-2:     #6b7280;
  --text-3:     #9ca3af;
  --border:     rgba(0,0,0,0.07);
  --shadow:     0 2px 14px rgba(0,0,0,0.06);
  --shadow-md:  0 4px 24px rgba(0,0,0,0.10);
  --pass:       #22c55e;
  --pass-dim:   #f0fdf4;
  --fail:       #ef4444;
  --fail-dim:   #fef2f2;
  --review:     #f59e0b;
  --review-dim: #fffbeb;
  --radius:     18px;
  --nav-h:      76px;
  --hdr-h:      58px;
}
[data-theme="dark"] {
  --bg:        #0d0d1a;
  --surface:   #1a1a2e;
  --surface-2: #242438;
  --text:      #f0f0ff;
  --text-2:    #8890a4;
  --text-3:    #565e70;
  --border:    rgba(255,255,255,0.07);
  --shadow:    0 2px 14px rgba(0,0,0,0.5);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.6);
}

/* =====================================================
   リセット & ベース
   ===================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button{cursor:pointer;font-family:inherit;border:none;background:none;outline:none}
input,textarea{font-family:inherit;outline:none;border:none}
img{display:block}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

/* =====================================================
   アプリコンテナ
   ===================================================== */
#app{
  max-width:430px;margin:0 auto;min-height:100dvh;
  position:relative;background:var(--bg);
}
@media(min-width:430px){
  #app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .bottom-nav{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}

/* =====================================================
   ヘッダー
   ===================================================== */
.app-header{
  position:sticky;top:0;z-index:100;
  background:var(--surface);height:var(--hdr-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
}
.header-logo{display:flex;align-items:center;gap:11px}
.logo-icon{
  width:38px;height:38px;
  background:linear-gradient(140deg,#818cf8,#4f46e5);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(99,102,241,.35);flex-shrink:0;
}
.logo-icon svg{width:22px;height:22px}
.header-title{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.notif-btn{
  width:38px;height:38px;background:var(--surface-2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;border:1px solid var(--border);
  transition:background .15s;
}
.notif-btn:active{background:var(--primary-dim)}
.notif-dot{
  position:absolute;top:7px;right:7px;width:8px;height:8px;
  background:var(--primary);border-radius:50%;
  border:2px solid var(--surface);
}

/* =====================================================
   ページ
   ===================================================== */
.page{
  display:none;
  padding:14px 14px calc(var(--nav-h) + 14px);
  min-height:calc(100dvh - var(--hdr-h));
}
.page.active{display:block;animation:fadeUp .25s ease}

/* =====================================================
   カード
   ===================================================== */
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.card-head{
  display:flex;align-items:center;gap:9px;
  font-size:15px;font-weight:700;color:var(--text);
  margin-bottom:14px;
}
.card-head.between{justify-content:space-between}
.head-icon{
  width:30px;height:30px;background:var(--primary-dim);
  border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.head-icon svg{width:15px;height:15px;stroke:var(--primary)}
.see-all{
  font-size:13px;color:var(--primary);font-weight:600;
  display:flex;align-items:center;gap:2px;
  background:none;border:none;padding:0;
}

/* =====================================================
   メーカー
   ===================================================== */
/* =====================================================
   メーカー
   ===================================================== */
.mfr-section-lbl{
  font-size:11px;font-weight:700;color:var(--text-3);
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;
}
.mfr-recent-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:10px;overflow:hidden;
}
.mfr-recent-chip{
  flex-shrink:0;padding:7px 15px;border-radius:100px;
  border:1.5px solid var(--border);background:#ffffff;
  font-size:13px;font-weight:600;color:var(--text-2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;
}
.mfr-recent-chip:active{transform:scale(.95)}
.mfr-recent-chip.selected{
  border-color:var(--primary);background:var(--primary-dim);color:var(--primary);
}
.mfr-toggle-btn{
  width:100%;padding:9px;border-radius:11px;
  background:var(--surface-2);border:1.5px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all .15s;
}
.mfr-toggle-btn:active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.mfr-scroll{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:10px;overflow:hidden;
}
.mfr-card{
  padding:12px 6px;
  background:#ffffff;border:1.5px solid var(--border);
  border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:all .15s;
  position:relative;min-height:64px;
  min-width:0;overflow:hidden;
}
.mfr-card:active{transform:scale(.96)}
.mfr-card.selected{
  border-color:var(--primary);background:#eef2ff;
}
.mfr-logo{
  height:28px;display:flex;align-items:center;justify-content:center;
  font-weight:900;letter-spacing:-.3px;line-height:1;
}
.mfr-name{font-size:10px;color:var(--text-3);text-align:center;font-weight:500;margin-top:2px}
.mfr-card.selected .mfr-name{color:var(--primary)}

/* =====================================================
   製品名検索
   ===================================================== */
.search-wrap{position:relative}
.search-input{
  width:100%;padding:12px 44px 12px 14px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;color:var(--text);
  transition:border-color .15s,background .15s;
}
.search-input:focus{border-color:var(--primary);background:var(--surface)}
.search-input::placeholder{color:var(--text-3)}
.search-ico{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
.hist-label{font-size:12px;color:var(--text-2);margin:12px 0 4px;font-weight:600;letter-spacing:.2px}
.hist-chips{margin-top:2px}
.hist-item{
  display:flex;align-items:center;gap:11px;
  padding:12px 4px;
  cursor:pointer;transition:background .1s;
  border-bottom:1px solid var(--border);
}
.hist-item:last-child{border-bottom:none}
.hist-item:active,.hist-item:hover{background:var(--surface-2);border-radius:10px;padding-left:8px;padding-right:8px}
.hist-item-icon{flex-shrink:0;color:var(--text-3);display:flex;align-items:center}
.hist-item-name{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.hist-item-fill{
  flex-shrink:0;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border-radius:50%;transition:background .15s;
}
.hist-item-fill:hover{background:var(--primary-dim);color:var(--primary)}
.hist-item-del{
  flex-shrink:0;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border-radius:50%;transition:all .15s;
}
.hist-item-del:active,.hist-item-del:hover{background:var(--fail-dim);color:var(--fail)}
/* 旧スタイル（互換） */
.hist-chip{display:none}

/* =====================================================
   スワイプ削除
   ===================================================== */
.swipe-row{
  position:relative;overflow:hidden;
  border-radius:10px;margin:0 -4px;
  -webkit-mask-image:-webkit-radial-gradient(white,black);
  transform:translateZ(0);
}
.swipe-row:last-child .hist-item{border-bottom:none}
.swipe-del-bg{
  position:absolute;right:0;top:0;bottom:0;
  width:80px;background:var(--fail);
  display:flex;align-items:center;justify-content:center;
  border-radius:0 10px 10px 0;
  flex-direction:column;gap:3px;
  opacity:0;
}
.swipe-del-bg svg{stroke:white;width:16px;height:16px}
.swipe-del-lbl{font-size:11px;font-weight:700;color:white;letter-spacing:.3px}
.hist-item{
  position:relative;z-index:1;
  background:var(--surface);
  transform:translateX(0);
  transition:transform .3s cubic-bezier(.34,1.12,.64,1);
  will-change:transform;
  padding-left:8px;padding-right:8px;
}
.hist-item.swiping{transition:none}
.swipe-row.deleting{
  transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
  overflow:hidden;
}
.suggest-dd{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.14);
  z-index:50;overflow:hidden;max-height:260px;overflow-y:auto;
}
.suggest-item{
  padding:12px 16px;font-size:14px;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:11px;
  transition:background .1s;border-bottom:1px solid var(--border);
}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active,.suggest-item:hover{background:var(--surface-2)}
.suggest-icon{flex-shrink:0;color:var(--text-3)}
.suggest-text{flex:1;font-weight:500}
.suggest-fill{
  flex-shrink:0;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}

/* =====================================================
   確認者
   ===================================================== */
.inspector-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:3px}
.inspector-card{
  flex-shrink:0;width:88px;
  padding:12px 6px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:all .15s;position:relative;
}
.inspector-card:active{transform:scale(.96)}
.inspector-card.selected{border-color:var(--primary);background:var(--primary-dim)}
.avatar{
  width:54px;height:54px;border-radius:14px;
  background:var(--primary-dim);
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
}
.avatar-check{
  position:absolute;bottom:26px;right:7px;
  width:20px;height:20px;background:var(--primary);
  border-radius:50%;border:2.5px solid var(--surface);
  display:none;align-items:center;justify-content:center;
  z-index:2;
}
.inspector-card.selected .avatar-check{display:flex}
.inspector-name{font-size:12px;font-weight:700;color:var(--text);text-align:center;line-height:1.3}
.inspector-card.selected .inspector-name{color:var(--primary)}

/* =====================================================
   不良内容（カードグリッド）
   ===================================================== */
.defect-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.defect-chip{
  display:flex;align-items:center;justify-content:center;
  padding:13px 8px;border-radius:13px;
  border:1.5px solid var(--border);
  background:var(--surface-2);
  cursor:pointer;transition:all .15s;
  text-align:center;
}
.defect-chip:active{transform:scale(.97)}
.defect-chip.on{border-color:var(--primary);background:var(--primary-dim)}
.defect-label{
  font-size:13px;font-weight:600;
  color:var(--text-2);line-height:1.3;transition:color .15s;
}
.defect-chip.on .defect-label{color:var(--primary)}
.defect-clear-btn{
  font-size:12px;color:var(--text-3);font-weight:600;
  background:none;border:none;padding:0;cursor:pointer;
  transition:color .15s;
}
.defect-clear-btn:hover{color:var(--primary)}

/* =====================================================
   判定ボタン（2グループ）
   ===================================================== */
.judge-group-label{
  font-size:12px;font-weight:700;color:var(--text-2);
  margin-bottom:8px;padding-left:2px;
}
.judge-group-label+.judge-group-label{margin-top:14px}
.judge-toggle-row{display:flex;gap:8px;}
.judge-toggle{
  flex:1;padding:13px 8px;border-radius:13px;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .15s;border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text-2);
  letter-spacing:.2px;
}
.judge-toggle:active{transform:scale(.96)}
/* 使用可 */
.judge-toggle.usable.active{
  background:var(--pass-dim);border-color:var(--pass);color:var(--pass);
}
/* 使用否 */
.judge-toggle.unusable.active{
  background:var(--fail-dim);border-color:var(--fail);color:var(--fail);
}
/* 恒久判断 */
.judge-toggle.permanent.active{
  background:#eff6ff;border-color:#3b82f6;color:#3b82f6;
}
/* 暫定判断 */
.judge-toggle.provisional.active{
  background:var(--review-dim);border-color:var(--review);color:var(--review);
}
.judge-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
}
.judge-dot.blue{background:#3b82f6}
.judge-dot.yellow{background:var(--review)}

/* =====================================================
   カメラ
   ===================================================== */
.cam-area{
  background:#111827;border-radius:14px;overflow:hidden;
  position:relative;height:210px;
  display:flex;align-items:center;justify-content:center;
}
#camVideo{width:100%;height:100%;object-fit:cover;display:none}
.cam-frame{
  position:absolute;width:88px;height:88px;pointer-events:none;
  border:none;
}
.cam-frame::before,.cam-frame::after{
  content:'';position:absolute;width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,.8);
}
.cam-frame::before{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.cam-frame::after{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0}
.cam-frame-tl,.cam-frame-tr,.cam-frame-bl,.cam-frame-br{
  position:absolute;width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,.8);
}
.cam-frame-tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.cam-frame-tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.cam-frame-bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 4px}
.cam-frame-br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0}
.cam-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:13px;
  color:rgba(255,255,255,.55);
}
.cam-placeholder svg{width:42px;height:42px}
.cam-start{
  padding:9px 22px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.25);border-radius:100px;
  color:#fff;font-size:14px;font-weight:600;
  transition:all .15s;backdrop-filter:blur(8px);
}
.cam-start:active{background:rgba(255,255,255,.22)}
.cam-controls{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  display:none;flex-direction:column;gap:9px;
}
.cam-ctrl{
  width:40px;height:40px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);border-radius:50%;
  color:#fff;display:flex;align-items:center;justify-content:center;
  transition:background .15s;border:1px solid rgba(255,255,255,.15);
}
.cam-ctrl:active{background:rgba(255,255,255,.35)}
.cam-capture{
  background:var(--primary)!important;
  width:48px!important;height:48px!important;
  box-shadow:0 4px 14px rgba(99,102,241,.5);
}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-wrap{position:relative;width:62px;height:62px}
.photo-thumb{width:100%;height:100%;border-radius:10px;object-fit:cover}
.photo-del{
  position:absolute;top:-5px;right:-5px;
  width:20px;height:20px;background:var(--fail);
  border-radius:50%;border:2px solid var(--surface);
  color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
  font-weight:700;
}
.file-pick{
  margin-top:9px;width:100%;padding:10px;
  background:var(--surface-2);border:1.5px dashed var(--border);
  border-radius:11px;color:var(--text-2);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;
}
.file-pick:active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.cam-stop-btn{
  margin-top:9px;width:100%;padding:10px;
  background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.25);
  border-radius:11px;color:var(--fail);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;
}
.cam-stop-btn:active{background:var(--fail-dim);border-color:var(--fail)}
.req-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:var(--fail);
  background:var(--fail-dim);padding:3px 9px;border-radius:100px;font-weight:600;
}

/* =====================================================
   コメント
   ===================================================== */
.comment-ta{
  width:100%;padding:12px;background:var(--surface-2);
  border:1.5px solid var(--border);border-radius:12px;
  font-size:14px;color:var(--text);resize:none;min-height:78px;
  transition:border-color .15s,background .15s;line-height:1.5;
}
.comment-ta:focus{border-color:var(--primary);background:var(--surface)}
.comment-ta::placeholder{color:var(--text-3)}

/* =====================================================
   保存ボタン
   ===================================================== */
.save-btn{
  width:100%;padding:18px;margin-top:4px;
  background:linear-gradient(135deg,#818cf8,#4f46e5);
  border-radius:15px;color:#fff;font-size:16px;font-weight:800;
  box-shadow:0 5px 18px rgba(99,102,241,.38);
  transition:transform .1s,box-shadow .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.3px;
}
.save-btn:active{transform:scale(.98);box-shadow:0 2px 8px rgba(99,102,241,.3)}

/* =====================================================
   履歴ページ
   ===================================================== */
.search-bar{position:relative;margin-bottom:11px}
.search-bar input{
  width:100%;padding:12px 44px 12px 16px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:13px;font-size:14px;color:var(--text);
  transition:border-color .15s;
}
.search-bar input:focus{border-color:var(--primary)}
.search-bar input::placeholder{color:var(--text-3)}
.filter-row{
  display:flex;gap:7px;overflow-x:auto;
  margin-bottom:11px;padding-bottom:2px;
}
.f-chip{
  flex-shrink:0;padding:6px 14px;border-radius:100px;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-2);transition:all .15s;
}
.f-chip.on-all{border-color:var(--primary);background:var(--primary-dim);color:var(--primary)}
.f-chip.on-pass{border-color:var(--pass);background:var(--pass-dim);color:var(--pass)}
.f-chip.on-fail{border-color:var(--fail);background:var(--fail-dim);color:var(--fail)}
.f-chip.on-review{border-color:var(--review);background:var(--review-dim);color:var(--review)}

.hist-card{
  background:var(--surface);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);margin-bottom:10px;
  animation:fadeUp .2s ease;cursor:pointer;
  transition:transform .12s,box-shadow .12s;
  display:flex;align-items:center;gap:12px;
}
.hist-card:active{transform:scale(.985);box-shadow:none}
.h-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--primary-dim);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}

function load(key, def) {

// Firestore に保存（fire-and-forget）
function save(key, val) {
  DB[key] = val;
  if (!currentUser) return;
  db.collection('users').doc(currentUser.uid)
    .collection('data').doc(key)
    .set({ value: val })
    .catch(e => console.warn('Firestore save:', e));
}

// Firestore から全データをロード
async function loadFromFirestore() {
  if (!currentUser) return;
  // ユーザー切り替え時にDBをリセット（前ユーザーのデータが残らないように）
  DB.inspections = [];
  DB.inspectors  = [...DEFAULT_INSPECTORS];
  DB.products    = [...SAMPLE_PRODUCTS];
  try {
    const snap = await db.collection('users').doc(currentUser.uid)
      .collection('data').get();
    snap.forEach(doc => {
      if (DB.hasOwnProperty(doc.id)) {
        DB[doc.id] = doc.data().value;
      }
    });
    // 初回（データなし）のみサンプルを投入
    if (!DB.inspections.length) {
      const now = new Date();
      const samples = [
        { id:uid(), manufacturerId:'panasonic', manufacturerName:'Panasonic', productName:'EZ9L48',     inspectorId:'INS-001', inspectorName:'田中 太郎', result:'pass',   judgeType:'恒久判断', defects:[], comment:'外観良好', photos:[], createdAt: new Date(now - 864e5*0).toISOString() },
        { id:uid(), manufacturerId:'sony',      manufacturerName:'Sony',      productName:'RX100M7',    inspectorId:'INS-002', inspectorName:'佐藤 花子', result:'fail',   judgeType:'暫定判断', defects:['打痕・キズ'], comment:'傷あり',   photos:[], createdAt: new Date(now - 864e5*1).toISOString() },
        { id:uid(), manufacturerId:'canon',     manufacturerName:'Canon',     productName:'EOS90D',     inspectorId:'INS-001', inspectorName:'田中 太郎', result:'review', judgeType:'暫定判断', defects:[], comment:'要再確認', photos:[], createdAt: new Date(now - 864e5*2).toISOString() },
      ];
      save('inspections', samples);
    }
    if (DB.inspectors.length === 0) {
      save('inspectors', [...DEFAULT_INSPECTORS]);
    }
  } catch(e) {
    console.warn('Firestore load:', e);
  }
}

// 写真を圧縮してbase64のままFirestoreに保存（Storage不要・完全無料）
async function uploadPhoto(base64DataUrl) {
  if (!base64DataUrl.startsWith('data:')) return base64DataUrl;
  try {
    // Firestoreの1MBドキュメント制限に収まるよう圧縮
    return await compressImage(base64DataUrl, 700, 0.65);
  } catch(e) {
    return base64DataUrl;
  }
}

/** ユニークID生成 */

/** 日時フォーマット */
function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (isToday) return `今日 ${time}`;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

function getRecentMfrs() {
  const inspections = load('inspections', []);
  const seen = [];
  const sorted = [...inspections].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  for (const insp of sorted) {
    if (!seen.includes(insp.manufacturerId)) {
      seen.push(insp.manufacturerId);
      if (seen.length >= 3) break;
    }
  }
  return seen.map(id => MANUFACTURERS.find(m => m.id === id)).filter(Boolean);
}

// ============================================================
// スワイプ削除
// ============================================================

let _swStartX = null;
let _swStartY = null;
let _swInner  = null;
let _swDx     = 0;
const SW_MAX  = 80;   // px — 完全に開いた状態
const SW_DEL  = 72;   // px — この距離以上でスワイプ削除確定

function _initSwipeDelete() {
  document.querySelectorAll('.swipe-row').forEach(row => {
    const inner = row.querySelector('.hist-item');
    const bg    = row.querySelector('.swipe-del-bg');
    const name  = row.dataset.name;

    row.addEventListener('touchstart', e => {
      _swStartX = e.touches[0].clientX;
      _swStartY = e.touches[0].clientY;
      _swInner  = inner;
      _swDx     = 0;
      inner.classList.add('swiping');
      if (bg) bg.style.opacity = '1';
    }, { passive: true });

    row.addEventListener('touchmove', e => {
      if (_swInner !== inner) return;
      const dx = e.touches[0].clientX - _swStartX;
      const dy = e.touches[0].clientY - _swStartY;
      // 縦スクロールが主体のときはスワイプしない
      if (Math.abs(dy) > Math.abs(dx) + 6) return;
      if (dx > 0) { inner.style.transform = 'translateX(0)'; return; }
      _swDx = Math.max(dx, -SW_MAX);
      inner.style.transform = `translateX(${_swDx}px)`;
    }, { passive: true });

    row.addEventListener('touchend', () => {
      if (_swInner !== inner) return;
      inner.classList.remove('swiping');
      if (_swDx <= -SW_DEL) {
        // 削除アニメーション
        inner.style.transform = `translateX(-${SW_MAX}px)`;
        row.style.transition   = 'max-height .22s ease, opacity .18s ease, margin .22s ease, padding .22s ease';
        row.style.maxHeight    = row.offsetHeight + 'px';
        row.style.overflow     = 'hidden';
        requestAnimationFrame(() => {
          row.style.maxHeight = '0';
          row.style.opacity   = '0';
          row.style.margin    = '0';
        });
        setTimeout(() => deleteProduct(name), 230);
      } else {
        inner.style.transform = 'translateX(0)';
        if (bg) bg.style.opacity = '0';
      }
      _swStartX = null; _swInner = null; _swDx = 0;
    });
  });
}

async function startCamera() {
  // 制約を段階的に緩めてフォールバック
  // 1. 要求したfacingMode + 高解像度
  // 2. facingModeなし（任意カメラ）+ 解像度ヒント
  // 3. video: true（最もシンプル）
  const attempts = [
    { facingMode: S.camFacing, width:{ideal:1920}, height:{ideal:1080} },
    { width:{ideal:1280}, height:{ideal:720} },
    true,
  ];

  let stream = null;
  let lastErr = null;

  for (const video of attempts) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video, audio:false });
      break;
    } catch(err) {
      lastErr = err;
      // パーミッション拒否は再試行しても無意味なので即終了
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') break;
    }
  }

  if (!stream) {
    console.warn('Camera:', lastErr);
    const msg = lastErr?.name === 'NotAllowedError'
      ? 'カメラのアクセスが拒否されました。'
      : 'カメラが見つかりません。ファイルを選択してください。';
    showToast(msg, 'warning');
    return;
  }

  S.camStream = stream;
  const v = document.getElementById('camVideo');
  v.srcObject = stream;
  v.style.display = 'block';
  document.getElementById('camPlaceholder').style.display = 'none';

/**
 * dataURL を受け取り、長辺を maxPx 以内にリサイズして
 * JPEG quality で再エンコードした dataURL を返す。
 */
function compressImage(dataUrl, maxPx = 1280, quality = 0.75) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w >= h) { h = Math.round(h / w * maxPx); w = maxPx; }
        else        { w = Math.round(w / h * maxPx); h = maxPx; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

async function capturePhoto() {
  const v = document.getElementById('camVideo');
  if (!v.srcObject) { showToast('カメラが起動していません','error'); return; }
  const c = document.getElementById('captureCanvas');

  c.getContext('2d').drawImage(v, 0, 0);
  // 撮影フラッシュ
  const a = document.getElementById('camArea');
  a.style.filter = 'brightness(2.5)';
  setTimeout(() => a.style.filter = '', 110);
  // 圧縮してから保存
  const compressed = await compressImage(c.toDataURL('image/jpeg', 1.0), 1280, 0.75);
  addPhoto(compressed);
  showToast('撮影しました','success');
}

function onFileSelected(files) {

    reader.readAsDataURL(file);
  });
}

const annotState = {
  photoIdx: -1, circles: [],
  drawing: false, startX: 0, startY: 0, img: null,
  addMode: false,
  // 移動・リサイズ用
  selectedIdx: -1,
  dragMode: null,      // 'move' | 'resize' | null
  dragStartX: 0, dragStartY: 0,
  dragOrigCx: 0, dragOrigCy: 0, dragOrigR: 0,
};

function updateAnnotHint() {
  const hint = document.getElementById('annotHint');
  if (annotState.addMode) {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
      <span style="color:#ef4444;font-weight:700">追加モード：ドラッグで丸を描く</span>`;
  } else if (annotState.selectedIdx >= 0) {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
      <span style="color:rgba(255,255,255,.85)">中央ドラッグ→移動　端ドラッグ→リサイズ</span>
      <button onclick="deleteSelectedCircle()" style="margin-left:8px;padding:3px 11px;border-radius:100px;background:#ef4444;border:none;color:#fff;font-size:11px;font-weight:700;cursor:pointer">✕ 削除</button>`;
  } else {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      丸をタップ→移動・リサイズ　／　「丸を追加」で新規`;
  }
}

function deleteSelectedCircle() {
  if (annotState.selectedIdx < 0) return;
  annotState.circles.splice(annotState.selectedIdx, 1);
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  redrawAnnotCanvas();
  updateAnnotHint();
}

function toggleAddMode() {
  annotState.addMode = !annotState.addMode;
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  const btn = document.getElementById('annotAddBtn');
  if (annotState.addMode) {
    btn.style.background = '#ef4444';
    btn.style.borderColor = '#ef4444';
    btn.style.color = '#fff';
  } else {
    btn.style.background = '#fee2e2';
    btn.style.borderColor = '#fca5a5';
    btn.style.color = '#ef4444';
  }
  redrawAnnotCanvas();
  updateAnnotHint();
}

function openAnnotator(i) {
  annotState.photoIdx = i;
  annotState.circles  = [];
  annotState.drawing  = false;
  annotState.addMode  = false;
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  const canvas = document.getElementById('annotCanvas');
  const img = new Image();
  img.onload = () => {
    annotState.img    = img;
    canvas.width      = img.naturalWidth;
    canvas.height     = img.naturalHeight;
    redrawAnnotCanvas();
    // ボタン外観をリセット
    const btn = document.getElementById('annotAddBtn');
    btn.style.background = '#fee2e2';
    btn.style.borderColor = '#fca5a5';
    btn.style.color = '#ef4444';
    updateAnnotHint();
    document.getElementById('annotBg').classList.add('show');
  };
  img.src = S.photos[i];
}

function closeAnnotator() {
  document.getElementById('annotBg').classList.remove('show');
}

function getEventPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  let cx, cy;
  if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}

function redrawAnnotCanvas() {
  const canvas = document.getElementById('annotCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (annotState.img) ctx.drawImage(annotState.img, 0, 0);
  const lw = Math.max(4, canvas.width / 100);

  for (let i = 0; i < annotState.circles.length; i++) {
    const c = annotState.circles[i];
    const isSelected = (i === annotState.selectedIdx);

    // メイン円
    ctx.beginPath();
    ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
    ctx.strokeStyle = '#ff1f1f';
    ctx.lineWidth   = lw;
    ctx.stroke();

    if (isSelected) {
      // 選択中：外側に白い点線リング
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, c.r + lw * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = lw * 0.5;
      ctx.setLineDash([lw * 2.5, lw * 1.2]);
      ctx.stroke();
      ctx.restore();

      // 中央ハンドル（移動用 ●）
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, lw * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ff1f1f';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = lw * 0.5;
      ctx.stroke();

      // 端ハンドル（リサイズ用 ○）
      const hx = c.cx + c.r;
      const hy = c.cy;
      ctx.beginPath();
      ctx.arc(hx, hy, lw * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#ff1f1f';
      ctx.lineWidth = lw * 0.7;
      ctx.stroke();
    }
  }
}

function annotPointerDown(e) {
  e.preventDefault();
  const canvas = document.getElementById('annotCanvas');
  const pos = getEventPos(e, canvas);

  if (annotState.addMode) {
    // 描画モード
    annotState.drawing = true;
    annotState.startX  = pos.x;
    annotState.startY  = pos.y;
    return;
  }

  // 既存の丸にヒットしているか確認（上から順に）
  let hitIdx = -1;
  let hitMode = null;
  for (let i = annotState.circles.length - 1; i >= 0; i--) {
    const c = annotState.circles[i];
    const dist = Math.hypot(pos.x - c.cx, pos.y - c.cy);
    if (dist <= c.r * 1.35) {
      hitIdx = i;
      // 中心寄り → 移動、端寄り → リサイズ
      hitMode = dist <= c.r * 0.6 ? 'move' : 'resize';
      break;
    }
  }

  annotState.selectedIdx = hitIdx;
  if (hitIdx >= 0) {
    const c = annotState.circles[hitIdx];
    annotState.dragMode    = hitMode;
    annotState.dragStartX  = pos.x;
    annotState.dragStartY  = pos.y;
    annotState.dragOrigCx  = c.cx;
    annotState.dragOrigCy  = c.cy;
    annotState.dragOrigR   = c.r;
  } else {
    annotState.dragMode = null;
  }

  redrawAnnotCanvas();
  updateAnnotHint();
}

function annotPointerMove(e) {
  e.preventDefault();
  const canvas = document.getElementById('annotCanvas');
  const pos = getEventPos(e, canvas);

  // 描画モード中のプレビュー
  if (annotState.addMode && annotState.drawing) {
    redrawAnnotCanvas();
    const cx = (annotState.startX + pos.x) / 2;
    const cy = (annotState.startY + pos.y) / 2;
    const r  = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY) / 2;
    if (r > 2) {
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff1f1f';
      ctx.lineWidth   = Math.max(4, canvas.width / 100);
      ctx.stroke();
    }
    return;
  }

  // 移動・リサイズ
  if (!annotState.dragMode || annotState.selectedIdx < 0) return;
  const c = annotState.circles[annotState.selectedIdx];

  if (annotState.dragMode === 'move') {
    c.cx = annotState.dragOrigCx + (pos.x - annotState.dragStartX);
    c.cy = annotState.dragOrigCy + (pos.y - annotState.dragStartY);
  } else if (annotState.dragMode === 'resize') {
    const newR = Math.hypot(pos.x - annotState.dragOrigCx, pos.y - annotState.dragOrigCy);
    c.r = Math.max(canvas.width / 40, newR);
  }

  redrawAnnotCanvas();
}

function annotPointerUp(e) {
  e.preventDefault();

  // 描画モード終了
  if (annotState.addMode && annotState.drawing) {
    annotState.drawing = false;
    const canvas = document.getElementById('annotCanvas');
    const pos = getEventPos(e, canvas);
    const cx = (annotState.startX + pos.x) / 2;
    const cy = (annotState.startY + pos.y) / 2;
    const r  = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY) / 2;
    if (r > canvas.width / 80) {
      annotState.circles.push({ cx, cy, r });
      // 描いたら追加モードをオフ
      annotState.addMode = true;
      toggleAddMode();
    }
    redrawAnnotCanvas();
    return;
  }

  // ドラッグ終了
  annotState.dragMode = null;
}

function undoAnnotation() {
  if (!annotState.circles.length) { showToast('元に戻す操作がありません', 'default'); return; }
  annotState.circles.pop();
  redrawAnnotCanvas();
}

function clearAnnotations() {
  if (!annotState.circles.length) return;

}

async function saveInspection() {
  const productName = document.getElementById('productInput').value.trim();

  // バリデーション
  if (!S.selectedMfr)   { showToast('メーカーを選択してください','error'); scrollToCard('mfr-card'); return; }
  if (!productName)      { showToast('製品名を入力してください','error'); return; }
  if (!S.selectedInsp)  { showToast('確認者を選択してください','error'); return; }
  if (!S.usability)      { showToast('使用可否を選択してください','error'); return; }
  if (!S.judgeType)      { showToast('判断区分を選択してください','error'); return; }
  if (S.usability === 'fail' && S.photos.length === 0) {
    showToast('使用否の場合は写真が必須です','error');
    return;
  }

  const mfr  = MANUFACTURERS.find(m => m.id === S.selectedMfr);
  const insp = getInspectors().find(i => i.id === S.selectedInsp);

  // 写真を Storage にアップロード
  showToast('保存中...','default');
  const uploadedPhotos = await Promise.all(S.photos.map(p => uploadPhoto(p)));

  const record = {
    id: uid(),
    manufacturerId:   S.selectedMfr,
    manufacturerName: mfr  ? mfr.name  : '不明',
    productName,
    inspectorId:      S.selectedInsp,
    inspectorName:    insp ? insp.name : '不明',
    result:    S.usability,
    judgeType: S.judgeType,
    defects:   [...S.defects],
    comment:   '',
    photos:    uploadedPhotos,
    createdAt: new Date().toISOString(),
  };

  const list = load('inspections', []);
  list.unshift(record);
  save('inspections', list);

  // 製品履歴更新
  const ph = load('products', SAMPLE_PRODUCTS);
  save('products', [productName, ...ph.filter(p => p !== productName)].slice(0, 30));

  const lbls = { pass:'使用可', fail:'使用否' };
  showToast(`保存しました（${lbls[S.usability] || S.usability} / ${S.judgeType}）`, 'success');
  resetForm();
}

function drawDonut(pass, fail, review, total) {
  const svg    = document.getElementById('donutSvg');
  const legend = document.getElementById('donutLegend');
  const R = 68, cx = 100, cy = 100;
  const C = 2 * Math.PI * R;

  if (!total) {
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--border)" stroke-width="22"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" fill="var(--text-3)" font-family="sans-serif">データなし</text>`;
    legend.innerHTML = '';
    return;
  }

  const segs = [
    { val:pass,   color:'var(--pass)',   lbl:'使用可' },
    { val:fail,   color:'var(--fail)',   lbl:'使用否' },
    { val:review, color:'var(--review)', lbl:'要確認' },
  ].filter(s => s.val > 0);

  let off = 0, paths = '';
  segs.forEach(s => {
    const dash = (s.val / total) * C;
    paths += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="22"
      stroke-dasharray="${dash} ${C - dash}"
      stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})" opacity=".88"/>`;
    off += dash;
  });

  svg.innerHTML = paths +
    `<text x="${cx}" y="${cy-7}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text)" font-family="sans-serif">${total}</text>
     <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="11" fill="var(--text-2)" font-family="sans-serif">総数</text>`;

  legend.innerHTML = segs.map(s => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <div style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0"></div>
      <span style="font-size:13px;color:var(--text-2);font-weight:500">${s.lbl}</span>
      <span style="font-size:15px;font-weight:800;color:var(--text);margin-left:8px">${s.val}</span>
    </div>
  `).join('');
}

function drawMfrBars(all) {
  const cnt = {};
  all.filter(r => r.result === 'fail').forEach(r => {
    cnt[r.manufacturerName] = (cnt[r.manufacturerName] || 0) + 1;
  });
  const sorted = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;
  const el = document.getElementById('mfrChart');
  if (!sorted.length) { el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">データなし</div>`; return; }
  el.innerHTML = sorted.map(([name,cnt]) => `
    <div class="bar-item">
      <div class="bar-lbl">${name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(cnt/max*100).toFixed(1)}%;background:linear-gradient(90deg,#f87171,#ef4444)"></div>
      </div>
      <div class="bar-cnt">${cnt}</div>
    </div>
  `).join('');
}

function drawMonthBars(all) {
  const months = {};
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months[k] = { lbl:`${d.getMonth()+1}月`, pass:0, fail:0, review:0 };
  }
  all.forEach(r => {
    const d = new Date(r.createdAt);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (months[k]) months[k][r.result]++;
  });

  const data   = Object.values(months);
  const maxV   = Math.max(...data.map(d => d.pass + d.fail + d.review), 1);
  const BAR_H  = 80;

  document.getElementById('monthChart').innerHTML = data.map(d => {
    const tot = d.pass + d.fail + d.review;
    const h   = tot > 0 ? Math.max(6, (tot / maxV) * BAR_H) : 4;
    const ph  = tot ? (d.pass   / tot) * h : 0;
    const fh  = tot ? (d.fail   / tot) * h : 0;
    const rh  = tot ? (d.review / tot) * h : h;
    return `<div class="month-bar">
      ${tot ? `<div class="month-cnt">${tot}</div>` : '<div class="month-cnt" style="opacity:0">0</div>'}
      <div class="month-bar-inner" style="height:${h}px">
        <div style="height:${rh}px;background:var(--review)"></div>
        <div style="height:${fh}px;background:var(--fail)"></div>
        <div style="height:${ph}px;background:var(--pass)"></div>
      </div>
      <div class="month-lbl">${d.lbl}</div>
    </div>`;
  }).join('');
}

let _allUsersCache = [];

async function loadAndRenderUsers() {
  const el = document.getElementById('userMgmtList');
  el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px">読み込み中...</div>`;
  try {
    const snap = await db.collection('users').get();
    _allUsersCache = snap.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
    renderUserList(_allUsersCache);
  } catch(e) {
    el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--fail);font-size:13px">読み込みに失敗しました</div>`;
  }
}

function renderUserList(users) {
  const el = document.getElementById('userMgmtList');
  if (!users.length) {
    el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px">ユーザーがいません</div>`;
    return;
  }

  el.innerHTML = users.map(u => {
    const isMe = u.uid === currentUser?.uid;
    const color = u.color || COLORS[0];
    const initials = u.initials || (u.name ? u.name.charAt(0) : '?');
    const adminBadge = u.isAdmin ? `<span class="badge-admin">管理者</span>` : '';
    const disabledBadge = u.disabled ? `<span class="badge-disabled">無効</span>` : '';

    return `
      <div class="user-row ${u.disabled ? 'disabled-user' : ''}">
        <div class="user-avatar-sm" style="background:${color}">${initials}</div>
        <div class="user-info">
          <div class="user-name-lbl">${u.name || '（名前未設定）'}${adminBadge}${disabledBadge}</div>
          <div class="user-sub-lbl">
            ${u.employeeId ? `ID: ${u.employeeId} | ` : ''}${u.email || ''}
          </div>
        </div>
        <div class="user-actions">
          <button class="u-btn edit" onclick="openUserEditModal('${u.uid}')">編集</button>
          ${!isMe ? (
            u.disabled
              ? `<button class="u-btn restore" onclick="restoreUser('${u.uid}')">復元</button>`
              : `<button class="u-btn del" onclick="confirmDisableUser('${u.uid}', '${(u.name||'このユーザー').replace(/'/g,"\\'")}')">削除</button>`
          ) : ''}
        </div>
      </div>
    `;
  }).join('');
}

function openUserEditModal(uid) {
  const u = _allUsersCache.find(x => x.uid === uid);
  if (!u) return;
  document.getElementById('editUserId').value = uid;
  document.getElementById('editUserName').value = u.name || '';
  document.getElementById('editUserEmpId').value = u.employeeId || '';
  const toggle = document.getElementById('editAdminToggle');
  toggle.classList.toggle('on', !!u.isAdmin);
  document.getElementById('userEditModal').classList.add('show');
}

function closeUserEditModal() {
  document.getElementById('userEditModal').classList.remove('show');
}

function toggleEditAdmin() {
  document.getElementById('editAdminToggle').classList.toggle('on');
}

async function saveUserEdit() {
  const uid   = document.getElementById('editUserId').value;
  const name  = document.getElementById('editUserName').value.trim();
  const empId = document.getElementById('editUserEmpId').value.trim();
  const isAdm = document.getElementById('editAdminToggle').classList.contains('on');

  if (!name) { showToast('氏名を入力してください', 'error'); return; }

  try {
    const updates = { name, employeeId: empId, initials: name.charAt(0), isAdmin: isAdm };
    await db.collection('users').doc(uid).update(updates);

    // ローカルキャッシュ更新
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) Object.assign(_allUsersCache[idx], updates);

    // 確認者リストも更新
    const inspList = getInspectors();
    const inspIdx  = inspList.findIndex(i => i.id === uid);
    if (inspIdx >= 0) {
      inspList[inspIdx].name = name;
      inspList[inspIdx].employeeId = empId;
      inspList[inspIdx].initials = name.charAt(0);
      save('inspectors', inspList);
      renderInspectors();
    }

    // 自分自身のプロフィールを更新
    if (uid === currentUser?.uid) {
      currentUserProfile = { ...currentUserProfile, ...updates };
      document.getElementById('userEmail').textContent = name;
      document.getElementById('userEmpId').textContent = empId || '';
      document.getElementById('settingsUserName').textContent = name;
      document.getElementById('settingsUserEmp').textContent = empId ? `社員ID: ${empId}` : currentUser.email;
    }

    closeUserEditModal();
    renderUserList(_allUsersCache);
    showToast('ユーザー情報を更新しました', 'success');
  } catch(e) {
    showToast('更新に失敗しました', 'error');
  }
}

function confirmDisableUser(uid, name) {
  document.getElementById('confirmTitle').textContent = 'ユーザーを削除しますか？';
  document.getElementById('confirmMsg').textContent   =
    `「${name}」さんを無効にします。ログインできなくなります。（データは保持されます）`;
  document.getElementById('confirmOk').textContent = '削除する';
  document.getElementById('confirmOk').onclick = () => { disableUser(uid); closeConfirm(); };
  document.getElementById('confirmModal').classList.add('show');
}

async function disableUser(uid) {
  try {
    await db.collection('users').doc(uid).update({ disabled: true });

    // ローカルキャッシュ更新
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) _allUsersCache[idx].disabled = true;

    // 確認者リストから削除
    const inspList = getInspectors().filter(i => i.id !== uid);
    save('inspectors', inspList);
    renderInspectors();

    renderUserList(_allUsersCache);
    showToast('ユーザーを無効にしました', 'default');
  } catch(e) {
    showToast('削除に失敗しました', 'error');
  }
}

async function restoreUser(uid) {
  try {
    await db.collection('users').doc(uid).update({ disabled: false });
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) _allUsersCache[idx].disabled = false;
    renderUserList(_allUsersCache);
    showToast('ユーザーを復元しました', 'success');
  } catch(e) {
    showToast('復元に失敗しました', 'error');
  }
}

function removeInspector(id) {
  const ins = getInspectors().find(i => i.id === id);
  const name = ins ? ins.name : '確認者';
  document.getElementById('confirmTitle').textContent = `${name}を削除しますか？`;

  document.getElementById('confirmOk').textContent    = '削除する';

    renderInspectors();
    renderInspSettings();

    showToast(`${name}を削除しました`, 'default');

}

function exportJSON() {
  const data = {
    inspections: load('inspections', []),
    inspectors:  getInspectors(),
    exportedAt:  new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `inspection_${new Date().toISOString().split('T')[0]}.json`;

auth.onAuthStateChanged(async user => {
  const loadingEl = document.getElementById('loadingScreen');
  const loginEl   = document.getElementById('loginScreen');
  const appEl     = document.getElementById('app');

  if (user) {
    currentUser = user;
    // プロフィール読み込み
    currentUserProfile = await loadUserProfile();

    // 無効化されたユーザーは強制ログアウト
    if (currentUserProfile?.disabled) {
      await auth.signOut();
      loadingEl.style.display = 'none';
      loginEl.style.display   = 'flex';
      appEl.style.display     = 'none';
      document.getElementById('loginErr').textContent = 'このアカウントは無効化されています。管理者にお問い合わせください。';
      return;
    }

    const displayName  = currentUserProfile ? currentUserProfile.name : user.email;
    document.getElementById('userEmail').textContent = displayName;
    if (currentUserProfile) {
      const empId = currentUserProfile.employeeId || '';
      const empEl = document.getElementById('userEmpId');
      if (empId) {
        empEl.textContent = empId;
        empEl.style.display = 'block';
      } else {
        empEl.style.display = 'none';
      }
    }
    await loadFromFirestore();
    loadingEl.style.display = 'none';
    loginEl.style.display   = 'none';
    appEl.style.display     = 'block';
    renderApp();
  } else {
    currentUser        = null;
    currentUserProfile = null;
    loadingEl.style.display = 'none';
    loginEl.style.display   = 'flex';
    appEl.style.display     = 'none';
    // ログアウト後にボタンを必ずリセット
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.textContent = 'ログイン'; btn.disabled = false; }
  }
});

// Firestoreからプロフィールを取得
async function loadUserProfile() {
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    return doc.exists ? doc.data() : null;
  } catch(e) { return null; }
}

// ログインユーザーを確認者リストに追加（未登録の場合）
function ensureCurrentUserAsInspector() {
  if (!currentUserProfile || !currentUserProfile.name) return;
  const inspectors = load('inspectors', DEFAULT_INSPECTORS);
  const exists = inspectors.find(i => i.id === currentUser.uid);
  if (!exists) {
    inspectors.unshift({
      id:       currentUser.uid,
      name:     currentUserProfile.name,
      employeeId: currentUserProfile.employeeId || '',
      color:    currentUserProfile.color || COLORS[0],
      initials: currentUserProfile.initials || currentUserProfile.name.charAt(0),
      isCurrentUser: true,
    });
    save('inspectors', inspectors);
  }
}

function switchLoginTab(mode) {
  loginMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('loginBtn').textContent = mode === 'login' ? 'ログイン' : '新規登録';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('profileFields').style.display = mode === 'register' ? 'block' : 'none';
}

async function doAuth() {
  const raw    = document.getElementById('loginEmail').value.trim();
  const email  = raw.includes('@') ? raw : raw + '@kenpin.com';
  const pass   = document.getElementById('loginPass').value;
  const errEl  = document.getElementById('loginErr');
  const btn    = document.getElementById('loginBtn');
  errEl.textContent = '';

  if (!email) { errEl.textContent = 'ログインIDを入力してください'; return; }
  if (!pass)  { errEl.textContent = 'パスワードを入力してください'; return; }

  btn.textContent = '処理中...';
  btn.disabled    = true;
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    errEl.textContent = authErrMsg(e.code);
    btn.textContent   = 'ログイン';
    btn.disabled      = false;
  }
}

function toggleUserMenu() {
  const menu = document.getElementById('userMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('click', e => {
  const menu = document.getElementById('userMenu');
  if (menu && !menu.closest && menu.style.display === 'block') {
    menu.style.display = 'none';
  }
  if (menu && menu.style.display === 'block') {
    const btn = menu.previousElementSibling;
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.style.display = 'none';
    }
  }
});

function logoutUser() {
  auth.signOut();
  showToast('ログアウトしました','default');
}

function authErrMsg(code) {
  const m = {
    'auth/user-not-found':      'メールアドレスが見つかりません',
    'auth/wrong-password':      'パスワードが間違っています',
    'auth/invalid-credential':  'メールアドレスまたはパスワードが間違っています',
    'auth/email-already-in-use':'このメールアドレスはすでに使用されています',
    'auth/weak-password':       'パスワードは6文字以上にしてください',
    'auth/invalid-email':       'メールアドレスの形式が正しくありません',
    'auth/too-many-requests':   'ログイン試行が多すぎます。しばらく待ってください',
  };
  return m[code] || `エラーが発生しました（${code}）`;
}
