auth.onAuthStateChanged(async user => {
  const loadingEl = document.getElementById('loadingScreen');
  const loginEl   = document.getElementById('loginScreen');
  const appEl     = document.getElementById('app');

  if (user) {
    currentUser = user;
    // プロフィール読み込み
    currentUserProfile = await loadUserProfile();

    // 無効化されたユーザーは強制ログアウト
    if (currentUserProfile?.disabled) {
      await auth.signOut();
      loadingEl.style.display = 'none';
      loginEl.style.display   = 'flex';
      appEl.style.display     = 'none';
      document.getElementById('loginErr').textContent = 'このアカウントは無効化されています。管理者にお問い合わせください。';
      return;
    }

    const displayName  = currentUserProfile ? currentUserProfile.name : user.email;
    document.getElementById('userEmail').textContent = displayName;
    if (currentUserProfile) {
      const empId = currentUserProfile.employeeId || '';
      const empEl = document.getElementById('userEmpId');
      if (empId) {
        empEl.textContent = empId;
        empEl.style.display = 'block';
      } else {
        empEl.style.display = 'none';
      }
    }
    await loadFromFirestore();
    loadingEl.style.display = 'none';
    loginEl.style.display   = 'none';
    appEl.style.display     = 'block';
    renderApp();
  } else {
    currentUser        = null;
    currentUserProfile = null;
    loadingEl.style.display = 'none';
    loginEl.style.display   = 'flex';
    appEl.style.display     = 'none';
    // ログアウト後にボタンを必ずリセット
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.textContent = 'ログイン'; btn.disabled = false; }
  }
});

// Firestoreからプロフィールを取得
async function loadUserProfile() {
  try {
    const doc = await db.collection('users').doc(currentUser.uid).get();
    return doc.exists ? doc.data() : null;
  } catch(e) { return null; }
}

// ログインユーザーを確認者リストに追加（未登録の場合）
function ensureCurrentUserAsInspector() {
  if (!currentUserProfile || !currentUserProfile.name) return;
  const inspectors = load('inspectors', DEFAULT_INSPECTORS);
  const exists = inspectors.find(i => i.id === currentUser.uid);
  if (!exists) {
    inspectors.unshift({
      id:       currentUser.uid,
      name:     currentUserProfile.name,
      employeeId: currentUserProfile.employeeId || '',
      color:    currentUserProfile.color || COLORS[0],
      initials: currentUserProfile.initials || currentUserProfile.name.charAt(0),
      isCurrentUser: true,
    });
    save('inspectors', inspectors);
  }
}

function switchLoginTab(mode) {
  loginMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('loginBtn').textContent = mode === 'login' ? 'ログイン' : '新規登録';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('profileFields').style.display = mode === 'register' ? 'block' : 'none';
}

async function doAuth() {
  const raw    = document.getElementById('loginEmail').value.trim();
  const email  = raw.includes('@') ? raw : raw + '@kenpin.com';
  const pass   = document.getElementById('loginPass').value;
  const errEl  = document.getElementById('loginErr');
  const btn    = document.getElementById('loginBtn');
  errEl.textContent = '';

  if (!email) { errEl.textContent = 'ログインIDを入力してください'; return; }
  if (!pass)  { errEl.textContent = 'パスワードを入力してください'; return; }

  btn.textContent = '処理中...';
  btn.disabled    = true;
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    errEl.textContent = authErrMsg(e.code);
    btn.textContent   = 'ログイン';
    btn.disabled      = false;
  }
}

function toggleUserMenu() {
  const menu = document.getElementById('userMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('click', e => {
  const menu = document.getElementById('userMenu');
  if (menu && !menu.closest && menu.style.display === 'block') {
    menu.style.display = 'none';
  }
  if (menu && menu.style.display === 'block') {
    const btn = menu.previousElementSibling;
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.style.display = 'none';
    }
  }
});

function logoutUser() {
  auth.signOut();
  showToast('ログアウトしました','default');
}

function authErrMsg(code) {
  const m = {
    'auth/user-not-found':      'メールアドレスが見つかりません',
    'auth/wrong-password':      'パスワードが間違っています',
    'auth/invalid-credential':  'メールアドレスまたはパスワードが間違っています',
    'auth/email-already-in-use':'このメールアドレスはすでに使用されています',
    'auth/weak-password':       'パスワードは6文字以上にしてください',
    'auth/invalid-email':       'メールアドレスの形式が正しくありません',
    'auth/too-many-requests':   'ログイン試行が多すぎます。しばらく待ってください',
  };
  return m[code] || `エラーが発生しました（${code}）`;
}

    </div>
    <!-- 判断区分 -->
    <div class="judge-group-label" style="margin-top:14px">判断区分</div>
    <div class="judge-toggle-row">
      <button class="judge-toggle permanent" id="pjsPermanent" onclick="setPhotoJudge('judgeType','恒久判断')">
        <span class="judge-dot blue"></span>
        恒久判断
      </button>
      <button class="judge-toggle provisional" id="pjsProvisional" onclick="setPhotoJudge('judgeType','暫定判断')">
        <span class="judge-dot yellow"></span>
        暫定判断
      </button>
    </div>
    <div style="display:flex;gap:9px;margin-top:18px">
      <button class="m-btn cancel" onclick="closePhotoJudge()">閉じる</button>
      <button class="m-btn ok" onclick="closePhotoJudge()">確定</button>
    </div>
  </div>
</div>

<!-- =================== 保存確認ボトムシート =================== -->
<div class="save-confirm-bg" id="saveConfirmBg" onclick="if(event.target===this)closeSaveConfirm()">
  <div class="save-confirm-sheet">
    <div class="sc-handle"></div>
    <div class="sc-title">保存内容を確認</div>
    <div class="sc-subtitle">以下の内容で保存します</div>
    <div class="sc-rows" id="scRows"></div>
    <div class="sc-actions">
      <button class="m-btn cancel" onclick="closeSaveConfirm()">キャンセル</button>
      <button class="m-btn ok" onclick="executeSaveInspection()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
             width="15" height="15" stroke-linecap="round" style="margin-right:4px;vertical-align:middle">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        保存する
      </button>
    </div>
  </div>
</div>
<!-- =================== 確認者管理オーバーレイ =================== -->
<div class="mfr-overlay" id="inspOverlay">
  <div class="mfr-overlay-header">
    <button class="mfr-overlay-back" onclick="closeInspOverlay()">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2.5" width="20" height="20" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="flex:1;font-size:17px;font-weight:700;color:var(--text);text-align:center">確認者管理</div>
    <div style="display:flex;align-items:center;gap:4px">
      <button id="inspAddBtn" class="md-edit-btn" onclick="openInspModal()" style="color:var(--primary)">追加</button>
      <button id="inspEditToggleBtn" class="md-edit-btn" onclick="toggleInspEditMode()">編集</button>
    </div>
  </div>
  <div class="mfr-result-list" id="inspOverlayList"></div>
</div>

<!-- =================== マスターデータ管理オーバーレイ =================== -->
<div class="mfr-overlay" id="masterDataOverlay">
  <div class="mfr-overlay-header">
    <button class="mfr-overlay-back" onclick="closeMasterData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2.5" width="20" height="20" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="flex:1;font-size:17px;font-weight:700;color:var(--text);text-align:center" id="masterDataOverlayTitle">マスターデータ</div>
    <button id="masterEditToggleBtn" class="md-edit-btn" onclick="toggleMasterEditMode()">編集</button>
  </div>
  <div class="mfr-result-list" id="masterDataList"></div>
</div>


</body>
</html>
