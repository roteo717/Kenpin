<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="製品の使用可否を判定する検品アプリ">
<title>検品アプリ</title>
<style>
/* =====================================================
   CSS変数（テーマカラー）
   ===================================================== */
:root {
  --bg:         #edf0f8;
  --surface:    #ffffff;
  --surface-2:  #f4f5fa;
  --primary:    #6366f1;
  --primary-dim:#eef2ff;
  --primary-b:  #c7d2fe;
  --text:       #1a1a2e;
  --text-2:     #6b7280;
  --text-3:     #9ca3af;
  --border:     rgba(0,0,0,0.07);
  --shadow:     0 2px 14px rgba(0,0,0,0.06);
  --shadow-md:  0 4px 24px rgba(0,0,0,0.10);
  --pass:       #22c55e;
  --pass-dim:   #f0fdf4;
  --fail:       #ef4444;
  --fail-dim:   #fef2f2;
  --review:     #f59e0b;
  --review-dim: #fffbeb;
  --radius:     18px;
  --nav-h:      76px;
  --hdr-h:      58px;
}
[data-theme="dark"] {
  --bg:        #0d0d1a;
  --surface:   #1a1a2e;
  --surface-2: #242438;
  --text:      #f0f0ff;
  --text-2:    #8890a4;
  --text-3:    #565e70;
  --border:    rgba(255,255,255,0.07);
  --shadow:    0 2px 14px rgba(0,0,0,0.5);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.6);
}
[data-theme="dark"] .save-btn{
  background:#242438;color:#f0f0ff;
  border:1px solid rgba(255,255,255,0.09);
  box-shadow:0 6px 24px rgba(0,0,0,0.35),0 1.5px 4px rgba(0,0,0,0.2);
}

/* =====================================================
   リセット & ベース
   ===================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button{cursor:pointer;font-family:inherit;border:none;background:none;outline:none}
input,textarea{font-family:inherit;outline:none;border:none}
img{display:block}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

/* =====================================================
   アプリコンテナ
   ===================================================== */
#app{
  max-width:430px;margin:0 auto;min-height:100dvh;
  position:relative;background:var(--bg);
}
@media(min-width:430px){
  #app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .bottom-nav{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}

/* =====================================================
   ヘッダー
   ===================================================== */
.app-header{
  position:sticky;top:0;z-index:100;
  background:var(--surface);height:var(--hdr-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
}
.header-logo{display:flex;align-items:center;gap:11px}
.logo-icon{
  width:38px;height:38px;
  background:linear-gradient(140deg,#818cf8,#4f46e5);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(99,102,241,.35);flex-shrink:0;
}
.logo-icon svg{width:22px;height:22px}
.header-title{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.notif-btn{
  width:38px;height:38px;background:var(--surface-2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;border:1px solid var(--border);
  transition:background .15s;
}
.notif-btn:active{background:var(--primary-dim)}
.notif-dot{
  position:absolute;top:7px;right:7px;width:8px;height:8px;
  background:var(--primary);border-radius:50%;
  border:2px solid var(--surface);
}

/* =====================================================
   ページ
   ===================================================== */
.page{
  display:none;
  padding:14px 14px calc(var(--nav-h) + 14px);
  min-height:calc(100dvh - var(--hdr-h));
}
.page.active{display:block;animation:fadeUp .25s ease}

/* =====================================================
   カード
   ===================================================== */
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.card-head{
  display:flex;align-items:center;gap:9px;
  font-size:15px;font-weight:700;color:var(--text);
  margin-bottom:14px;
}
.card-head.between{justify-content:space-between}
.head-icon{
  width:30px;height:30px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.head-icon svg{width:15px;height:15px;stroke:var(--primary)}
.see-all{
  font-size:13px;color:var(--primary);font-weight:600;
  display:flex;align-items:center;gap:2px;
  background:none;border:none;padding:0;
}

/* =====================================================
   メーカー
   ===================================================== */
/* =====================================================
   メーカー
   ===================================================== */
.mfr-section-lbl{
  font-size:11px;font-weight:700;color:var(--text-3);
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;
}
.mfr-recent-row{
  display:flex;gap:7px;overflow-x:auto;
  padding-bottom:3px;margin-bottom:10px;
}
.mfr-recent-chip{
  flex-shrink:0;padding:5px 14px;border-radius:100px;display:inline-flex;align-items:center;
  border:1.5px solid var(--border);background:#ffffff;
  font-size:13px;font-weight:600;color:var(--text-2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mfr-recent-chip:active{transform:scale(.95)}
.mfr-recent-chip.selected{
  border-color:var(--primary);background:var(--primary-dim);color:var(--primary);
}
.mfr-toggle-btn{
  width:100%;padding:9px;border-radius:11px;
  background:var(--surface-2);border:1.5px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all .15s;
}
.mfr-toggle-btn:active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.mfr-scroll{
  display:flex;gap:9px;flex-wrap:wrap;
  padding-bottom:3px;
  margin-top:4px;padding-top:10px;
}
.mfr-card{
  flex-shrink:0;width:88px;min-height:48px;
  padding:10px 6px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;transition:all .15s;scroll-snap-align:start;
  position:relative;
}
.mfr-card:active{transform:scale(.96)}
.mfr-card.selected{
  border-color:var(--primary);background:var(--primary-dim);
}
.mfr-logo{
  height:28px;display:flex;align-items:center;justify-content:center;
  font-weight:900;letter-spacing:-.3px;line-height:1;
}
.mfr-name{font-size:11px;color:var(--text-2);text-align:center;font-weight:500}
.mfr-card.selected .mfr-name{color:var(--primary)}
.mfr-recent-chip img{
  mix-blend-mode:multiply;
}
/* 必須バッジ（メーカーカード用） */
.mfr-required-badge{
  display:inline-flex;align-items:center;
  font-size:10px;font-weight:700;color:var(--text-3);
  background:var(--surface-2);border:1px solid var(--border);
  padding:2px 8px;border-radius:100px;letter-spacing:.3px;
}
/* 検索トリガー（入力欄に見えるボタン） */
.mfr-search-trigger{
  width:100%;margin-top:10px;
  padding:10px 14px 10px 40px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;font-size:14px;color:var(--text-3);
  text-align:left;position:relative;
  cursor:pointer;transition:border-color .15s;
}
.mfr-search-trigger:active{border-color:var(--primary)}
.mfr-search-trigger-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
/* メーカー検索オーバーレイ */
.mfr-overlay{
  display:none;
  position:fixed;top:0;bottom:0;z-index:500;
  background:var(--bg);
  flex-direction:column;
  width:430px;max-width:100vw;left:50%;margin-left:-215px;
}
@media(max-width:430px){.mfr-overlay{left:0;margin-left:0;width:100vw}}
.mfr-overlay.open{display:flex;animation:fadeUp .25s ease}
.mfr-overlay-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  padding-top:max(env(safe-area-inset-top,0px), 12px);
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.mfr-overlay-back{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .15s;
}
.mfr-overlay-back:active{background:var(--surface-2)}
.mfr-overlay-search-wrap{
  flex:1;position:relative;
}
.mfr-overlay-input{
  width:100%;padding:9px 36px 9px 36px;
  background:var(--surface-2);
  border:1.5px solid var(--primary);
  border-radius:100px;font-size:15px;color:var(--text);
  transition:border-color .15s;
}
.mfr-overlay-input::placeholder{color:var(--text-3)}
.mfr-overlay-input:focus{outline:none}
.mfr-overlay-search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
.mfr-overlay-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;
  background:var(--text-3);border-radius:50%;
  color:#fff;font-size:11px;font-weight:700;line-height:1;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;border:none;padding:0;
}
.mfr-overlay-cancel{
  font-size:14px;font-weight:600;color:var(--primary);
  flex-shrink:0;white-space:nowrap;padding:4px 2px;
}
/* 検索結果ヘッダー */
.mfr-result-header{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;
  font-size:12px;font-weight:700;color:var(--text-2);
  background:var(--surface-2);border-bottom:1px solid var(--border);
}
/* 検索結果リスト */
.mfr-result-list{
  overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;
}
.mfr-result-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;
}
.mfr-result-item:active,.mfr-result-item:hover{background:var(--surface-2)}
.mfr-result-item.selected-item{background:var(--primary-dim)}
.mfr-result-icon{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.mfr-result-icon svg{stroke:var(--primary);width:17px;height:17px}
.mfr-result-info{flex:1;min-width:0}
.mfr-result-name{
  font-size:15px;font-weight:700;color:var(--text);line-height:1.2;
}
.mfr-result-item.selected-item .mfr-result-name{color:var(--primary)}
.mfr-result-ja{
  font-size:12px;color:var(--text-2);margin-top:2px;
}
.mfr-result-chevron{
  color:var(--text-3);flex-shrink:0;
}

/* =====================================================
   メーカー選択トリガー（ドロップダウン風ボタン）
   ===================================================== */
.mfr-select-trigger{
  width:100%;margin-top:6px;
  padding:12px 14px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;
  text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.mfr-select-trigger:active,.mfr-select-trigger:hover{border-color:var(--primary)}
.mfr-select-trigger.has-value{
  border-color:var(--border);background:var(--surface);
}
.mfr-trigger-text{
  flex:1;color:var(--text-3);font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mfr-trigger-text.has-value{color:var(--text);font-weight:600;font-size:15px}
.mfr-trigger-chevron{color:var(--text-3);flex-shrink:0}
/* オーバーレイ内セクションヘッダー */
.mfr-sec-hdr{
  font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.3px;
  padding:8px 16px;
  background:var(--surface-2);border-bottom:1px solid var(--border);
}
/* 履歴行 */
.mfr-hist-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .1s;
}
.mfr-hist-row:active,.mfr-hist-row:hover{background:var(--surface-2)}
.mfr-hist-icon{
  width:36px;height:36px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.mfr-hist-icon svg{stroke:var(--text-3);width:17px;height:17px}
.mfr-hist-name{flex:1;font-size:15px;color:var(--text);font-weight:700}
/* すべて探すリンク行 */
.mfr-all-link{
  display:flex;align-items:center;gap:6px;
  padding:14px 16px;
  background:var(--surface);border-top:1px solid var(--border);
  cursor:pointer;transition:background .1s;
  font-size:14px;font-weight:600;color:var(--primary);
}
.mfr-all-link:active,.mfr-all-link:hover{background:var(--primary-dim)}
/* ヒントテキスト */
.mfr-hint-row{
  padding:14px 16px;font-size:12px;color:var(--text-3);
  background:var(--surface);text-align:center;
}
/* 該当なし＋登録セクション */
.mfr-no-result-section{
  margin:16px;
  border:1.5px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.mfr-no-result-label{
  padding:12px 16px;font-size:13px;color:var(--text-3);
  background:var(--surface-2);border-bottom:1px solid var(--border);
  text-align:center;
}
.mfr-register-btn{
  width:100%;padding:15px 16px;
  background:var(--surface);border:none;
  font-size:15px;font-weight:700;color:var(--primary);
  cursor:pointer;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:background .15s;
}
.mfr-register-btn:active,.mfr-register-btn:hover{background:var(--primary-dim)}

/* =====================================================
   製品名検索
   ===================================================== */
.search-wrap{position:relative}
.search-input{
  width:100%;padding:12px 44px 12px 14px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;color:var(--text);
  transition:border-color .15s,background .15s;
}
.search-input:focus{border-color:var(--primary);background:var(--surface)}
.search-input::placeholder{color:var(--text-3)}
.search-ico{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
.hist-label{font-size:12px;color:var(--text-2);margin:12px 0 4px;font-weight:600;letter-spacing:.2px}
.hist-chips{margin-top:2px}
.hist-item{
  display:flex;align-items:center;gap:11px;
  padding:12px 4px;
  cursor:pointer;transition:background .1s;
  border-bottom:1px solid var(--border);
}
.hist-item:last-child{border-bottom:none}
.hist-item:active,.hist-item:hover{background:var(--surface-2);border-radius:10px;padding-left:8px;padding-right:8px}
.hist-item-icon{flex-shrink:0;color:var(--text-3);display:flex;align-items:center}
.hist-item-name{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.hist-item-fill{
  flex-shrink:0;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border-radius:50%;transition:background .15s;
}
.hist-item-fill:hover{background:var(--primary-dim);color:var(--primary)}
.hist-item-del{
  flex-shrink:0;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border-radius:50%;transition:all .15s;
}
.hist-item-del:active,.hist-item-del:hover{background:var(--fail-dim);color:var(--fail)}
/* 旧スタイル（互換） */
.hist-chip{display:none}

/* =====================================================
   マイクボタン / 音声入力
   ===================================================== */
.mic-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;
  color:var(--primary);border-radius:9px;
  transition:background .15s;
}
.mic-btn:active{background:var(--primary-dim)}
.mic-btn.listening{
  color:#ef4444;
  background:#fef2f2;
  animation:micPulse 1s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}
  50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}
}
.voice-bar{
  margin-top:8px;padding:10px 14px;
  background:#fef2f2;border:1.5px solid #fca5a5;
  border-radius:12px;
  display:flex;align-items:center;gap:10px;
}
.voice-waves{display:flex;align-items:center;gap:3px;flex-shrink:0}
.voice-waves span{
  display:block;width:3px;border-radius:3px;
  background:#ef4444;
  animation:voiceWave 0.8s ease-in-out infinite;
}
.voice-waves span:nth-child(1){height:8px;animation-delay:0s}
.voice-waves span:nth-child(2){height:14px;animation-delay:.1s}
.voice-waves span:nth-child(3){height:20px;animation-delay:.2s}
.voice-waves span:nth-child(4){height:14px;animation-delay:.3s}
.voice-waves span:nth-child(5){height:8px;animation-delay:.4s}
@keyframes voiceWave{
  0%,100%{transform:scaleY(0.5);opacity:.5}
  50%{transform:scaleY(1.2);opacity:1}
}
.voice-bar-txt{flex:1;font-size:13px;font-weight:600;color:#dc2626}
.voice-bar-stop{
  padding:5px 12px;border-radius:8px;
  background:#ef4444;color:#fff;border:none;
  font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;
  transition:opacity .15s;
}
.voice-bar-stop:active{opacity:.8}
.input-clear-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;
  background:var(--text-3);border-radius:50%;
  color:#fff;font-size:11px;font-weight:700;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;border:none;line-height:1;padding:0;
}

/* =====================================================
   OCRローディング
   ===================================================== */
.ocr-loading{
  margin-top:8px;padding:9px 12px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:10px;
  display:none;align-items:center;gap:9px;
  font-size:13px;color:var(--text-2);font-weight:500;
}
.ocr-spin{
  width:18px;height:18px;flex-shrink:0;
  border:2.5px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:ocrSpin .7s linear infinite;
}
@keyframes ocrSpin{to{transform:rotate(360deg)}}

/* =====================================================
   OCR結果エリア
   ===================================================== */
.ocr-result-area{
  margin-top:8px;padding:9px 11px;
  background:var(--pass-dim);border:1.5px solid var(--pass);
  border-radius:10px;
  display:none;align-items:center;gap:8px;flex-wrap:wrap;
}
.ocr-chk{
  width:20px;height:20px;background:var(--pass);border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.ocr-info{flex:1;min-width:0}
.ocr-title{font-size:11px;font-weight:700;color:var(--pass);letter-spacing:.2px}
.ocr-cand{
  font-size:13px;color:var(--text);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ocr-confirm-btn{
  padding:6px 13px;background:var(--primary);
  border:none;border-radius:8px;
  color:#fff;font-size:12px;font-weight:700;
  cursor:pointer;flex-shrink:0;transition:opacity .15s;
}
.ocr-confirm-btn:active{opacity:.8}
.ocr-dismiss{
  width:24px;height:24px;border:none;background:none;
  color:var(--text-3);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;padding:0;line-height:1;
}
/* 複数候補行 */
.ocr-multi-row{
  display:none;flex-wrap:wrap;gap:5px;
  margin-top:6px;padding-top:6px;width:100%;
  border-top:1px solid rgba(34,197,94,.25);
}
.ocr-multi-lbl{
  font-size:10px;color:var(--text-3);font-weight:700;
  width:100%;margin-bottom:2px;
}

/* =====================================================
   OCR フルスクリーン カメラモーダル
   ===================================================== */
.ocr-modal{
  position:fixed;inset:0;z-index:3000;background:#000;
  flex-direction:column;display:none;
  /* safe area */
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.ocr-modal.active{display:flex}

/* ヘッダー */
.ocr-modal-hdr{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;
  padding:max(env(safe-area-inset-top),14px) 16px 14px;
  background:linear-gradient(to bottom,rgba(0,0,0,.72) 60%,transparent);
}
.ocr-close-btn{
  display:flex;align-items:center;gap:5px;
  color:#fff;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.22);border-radius:100px;
  padding:8px 16px;font-size:13px;font-weight:600;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.ocr-close-btn:active{background:rgba(255,255,255,.32)}
.ocr-modal-title{
  flex:1;color:#fff;font-size:15px;font-weight:700;
  text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.6);
}

/* ビデオ */
.ocr-viewfinder{
  flex:1;position:relative;overflow:hidden;
}
#ocrVideo{
  width:100%;height:100%;
  object-fit:cover;
  position:absolute;inset:0;
}

/* フレームラッパー（中央揃え） */
.ocr-frame-wrap{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;
}

/* スキャン枠（box-shadow で外側を暗くする） */
.ocr-scan-frame{
  width:86vw;height:120px;
  position:relative;border-radius:6px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.56);
  z-index:1;
}

/* コーナーマーク */
.ocr-cn{
  position:absolute;width:22px;height:22px;
  border:3px solid #fff;
}
.ocr-cn.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:5px 0 0 0}
.ocr-cn.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 5px 0 0}
.ocr-cn.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 5px}
.ocr-cn.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 5px 0}

/* リアルタイム シャープネスメーター */
.ocr-sharp-wrap{
  position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;pointer-events:none;
}
.ocr-sharp-dots{display:flex;gap:3px}
.ocr-sharp-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.25);
  transition:background .25s;
}
.ocr-sharp-label{
  font-size:10px;color:rgba(255,255,255,.55);font-weight:600;
  white-space:nowrap;letter-spacing:.2px;
}

/* スキャンライン（撮影ボタン押下後のみアニメーション） */
.ocr-scan-line{
  position:absolute;left:3px;right:3px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(99,102,241,.6) 15%,
    var(--primary) 40%,
    var(--primary) 60%,
    rgba(99,102,241,.6) 85%,
    transparent 100%);
  box-shadow:0 0 10px var(--primary),0 0 20px rgba(99,102,241,.35);
  top:50%;transform:translateY(-50%);opacity:.55;
  transition:opacity .3s;
}
/* 撮影処理中はラインをアニメーション */
.ocr-scan-frame.processing .ocr-scan-line{
  animation:ocrLine 1.1s ease-in-out infinite;
  opacity:1;
}
@keyframes ocrLine{
  0%  {top:3px;  opacity:0}
  8%  {opacity:1}
  92% {opacity:1}
  100%{top:calc(100% - 3px);opacity:0}
}

/* 処理中ステータスバッジ */
.ocr-status-badge{
  position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);
  background:rgba(99,102,241,.88);color:#fff;
  font-size:12px;font-weight:700;letter-spacing:.4px;
  padding:5px 16px;border-radius:100px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
}
.ocr-status-badge:not(:empty){display:block!important}

/* ガイドテキスト */
.ocr-guide{
  margin-top:18px;
  color:rgba(255,255,255,.92);font-size:13px;font-weight:600;letter-spacing:.3px;
  text-shadow:0 1px 6px rgba(0,0,0,.9);text-align:center;
}
.ocr-guide-sub{
  margin-top:6px;
  color:rgba(255,255,255,.5);font-size:11px;font-weight:500;
  text-shadow:0 1px 4px rgba(0,0,0,.8);text-align:center;
}

/* フッター */
.ocr-modal-footer{
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:28px;
  padding:18px 24px max(env(safe-area-inset-bottom),22px);
  background:linear-gradient(to top,rgba(0,0,0,.75) 60%,transparent);
}
/* 撮影ボタン */
.ocr-shoot-btn{
  width:72px;height:72px;border-radius:50%;
  background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--primary);font-size:10px;font-weight:700;letter-spacing:.3px;
  border:4px solid rgba(255,255,255,.35);
  box-shadow:0 0 0 3px rgba(255,255,255,.15),0 6px 24px rgba(0,0,0,.55);
  transition:transform .12s,box-shadow .12s;
}
.ocr-shoot-btn:active{
  transform:scale(.91);
  box-shadow:0 0 0 6px rgba(255,255,255,.25);
}
/* サブボタン */
.ocr-side-btn{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:#fff;font-size:9px;font-weight:600;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .15s;
}
.ocr-side-btn:active{background:rgba(255,255,255,.3)}

/* トーチボタン */
.ocr-torch-btn{
  position:absolute;bottom:calc(100% + 8px);right:16px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  color:#fff;z-index:21;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .15s;
}
.ocr-torch-btn.active{background:rgba(255,220,50,.5);border-color:rgba(255,220,50,.8);color:#ffe040}
.ocr-torch-btn:active{background:rgba(255,255,255,.3)}

/* =====================================================
   スワイプ削除
   ===================================================== */
.swipe-row{
  position:relative;overflow:hidden;
  border-radius:10px;margin:0 -4px;
  -webkit-mask-image:-webkit-radial-gradient(white,black);
  transform:translateZ(0);
}
.swipe-row:last-child .hist-item{border-bottom:none}
.swipe-del-bg{
  position:absolute;right:0;top:0;bottom:0;
  width:80px;background:var(--fail);
  display:flex;align-items:center;justify-content:center;
  border-radius:0 10px 10px 0;
  flex-direction:column;gap:3px;
  opacity:0;
}
.swipe-del-bg svg{stroke:white;width:16px;height:16px}
.swipe-del-lbl{font-size:11px;font-weight:700;color:white;letter-spacing:.3px}
.hist-item{
  position:relative;z-index:1;
  background:var(--surface);
  transform:translateX(0);
  transition:transform .3s cubic-bezier(.34,1.12,.64,1);
  will-change:transform;
  padding-left:8px;padding-right:8px;
}
.hist-item.swiping{transition:none}
.swipe-row.deleting{
  transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
  overflow:hidden;
}
.suggest-dd{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.14);
  z-index:50;overflow:hidden;
  max-height:var(--suggest-max-h, 260px);
  overflow-y:auto;
  /* iOS スムーズスクロール */
  -webkit-overflow-scrolling:touch;
}
.suggest-item{
  padding:12px 16px;font-size:14px;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:11px;
  transition:background .1s;border-bottom:1px solid var(--border);
}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active,.suggest-item:hover{background:var(--surface-2)}
.suggest-icon{flex-shrink:0;color:var(--text-3)}
.suggest-text{flex:1;font-weight:500}
.suggest-fill{
  flex-shrink:0;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.suggest-mfr-header{
  padding:6px 16px 4px;
  font-size:10px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.5px;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
}
.suggest-mfr-header:not(:first-child){
  border-top:1px solid var(--border);
}

/* =====================================================
   確認者
   ===================================================== */
.inspector-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:3px}
.inspector-card{
  flex-shrink:0;width:88px;
  padding:12px 6px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:all .15s;position:relative;
}
.inspector-card:active{transform:scale(.96)}
.inspector-card.selected{border-color:var(--primary);background:var(--primary-dim)}
.avatar{
  width:54px;height:54px;border-radius:14px;
  background:var(--primary-dim);
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
}
.avatar-check{
  position:absolute;bottom:26px;right:7px;
  width:20px;height:20px;background:var(--primary);
  border-radius:50%;border:2.5px solid var(--surface);
  display:none;align-items:center;justify-content:center;
  z-index:2;
}
.inspector-card.selected .avatar-check{display:flex}
.inspector-name{font-size:12px;font-weight:700;color:var(--text);text-align:center;line-height:1.3}
.inspector-card.selected .inspector-name{color:var(--primary)}

/* =====================================================
   不良内容（カードグリッド）
   ===================================================== */
.defect-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.defect-chip{
  display:flex;align-items:center;justify-content:center;
  padding:13px 8px;border-radius:13px;
  border:1.5px solid var(--border);
  background:var(--surface-2);
  cursor:pointer;transition:all .15s;
  text-align:center;
}
.defect-chip:active{transform:scale(.97)}
.defect-chip.on{border-color:var(--primary);background:var(--primary-dim)}
.defect-label{
  font-size:13px;font-weight:600;
  color:var(--text-2);line-height:1.3;transition:color .15s;
}
.defect-chip.on .defect-label{color:var(--primary)}
.defect-clear-btn{
  font-size:12px;color:var(--text-3);font-weight:600;
  background:none;border:none;padding:0;cursor:pointer;
  transition:color .15s;
}
.defect-clear-btn:hover{color:var(--primary)}
.defect-other-input{
  width:100%;padding:11px 14px;
  background:var(--surface-2);
  border:1.5px solid var(--primary);
  border-radius:12px;font-size:14px;color:var(--text);
  transition:border-color .15s,background .15s;
}
.defect-other-input:focus{outline:none;background:var(--surface)}
.defect-other-input::placeholder{color:var(--text-3)}

/* =====================================================
   判定ボタン（2グループ）
   ===================================================== */
.judge-group-label{
  font-size:12px;font-weight:700;color:var(--text-2);
  margin-bottom:8px;padding-left:2px;
}
.judge-group-label+.judge-group-label{margin-top:14px}
.judge-toggle-row{display:flex;gap:8px;}
.judge-toggle{
  flex:1;padding:13px 8px;border-radius:13px;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .15s;border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text-2);
  letter-spacing:.2px;
}
.judge-toggle:active{transform:scale(.96)}
/* 使用可 */
.judge-toggle.usable.active{
  background:var(--pass-dim);border-color:var(--pass);color:var(--pass);
}
/* 使用否 */
.judge-toggle.unusable.active{
  background:var(--fail-dim);border-color:var(--fail);color:var(--fail);
}
/* 恒久判断 */
.judge-toggle.permanent.active{
  background:#eff6ff;border-color:#3b82f6;color:#3b82f6;
}
/* 暫定判断 */
.judge-toggle.provisional.active{
  background:var(--review-dim);border-color:var(--review);color:var(--review);
}
/* 要注意 */
.judge-toggle.caution.active{
  background:var(--review-dim);border-color:var(--review);color:var(--review);
}
.judge-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
}
.judge-dot.blue{background:#3b82f6}
.judge-dot.yellow{background:var(--review)}

/* =====================================================
   カメラ
   ===================================================== */
.cam-area{
  background:#111827;border-radius:14px;overflow:hidden;
  position:relative;height:210px;
  display:flex;align-items:center;justify-content:center;
}
#camVideo{width:100%;height:100%;object-fit:cover;display:none}
.cam-frame{
  position:absolute;width:88px;height:88px;pointer-events:none;
  border:none;
}
.cam-frame::before,.cam-frame::after{
  content:'';position:absolute;width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,.8);
}
.cam-frame::before{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.cam-frame::after{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0}
.cam-frame-tl,.cam-frame-tr,.cam-frame-bl,.cam-frame-br{
  position:absolute;width:20px;height:20px;
  border:2.5px solid rgba(255,255,255,.8);
}
.cam-frame-tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.cam-frame-tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.cam-frame-bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 4px}
.cam-frame-br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0}
.cam-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:13px;
  color:rgba(255,255,255,.55);
}
.cam-placeholder svg{width:42px;height:42px}
.cam-start{
  padding:9px 22px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.25);border-radius:100px;
  color:#fff;font-size:14px;font-weight:600;
  transition:all .15s;backdrop-filter:blur(8px);
}
.cam-start:active{background:rgba(255,255,255,.22)}
.cam-controls{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  display:none;flex-direction:column;gap:9px;
}
.cam-ctrl{
  width:40px;height:40px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);border-radius:50%;
  color:#fff;display:flex;align-items:center;justify-content:center;
  transition:background .15s;border:1px solid rgba(255,255,255,.15);
}
.cam-ctrl:active{background:rgba(255,255,255,.35)}
.cam-capture{
  background:var(--primary)!important;
  width:48px!important;height:48px!important;
  box-shadow:0 4px 14px rgba(99,102,241,.5);
}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-wrap{position:relative;width:80px;display:flex;flex-direction:column;align-items:center;gap:5px}
.photo-thumb{width:80px;height:80px;border-radius:10px;object-fit:cover;display:block}
.photo-del{
  position:absolute;top:-5px;right:-5px;
  width:20px;height:20px;background:var(--fail);
  border-radius:50%;border:2px solid var(--surface);
  color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
  font-weight:700;
}
.photo-judge-label{
  font-size:11px;font-weight:800;
  padding:3px 8px;border-radius:6px;
  width:100%;text-align:center;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:opacity .15s;
}
.photo-judge-label:active{opacity:.7}
.photo-judge-label.pass{background:var(--pass-dim);color:var(--pass);border:1.5px solid var(--pass)}
.photo-judge-label.fail{background:var(--fail-dim);color:var(--fail);border:1.5px solid var(--fail)}
.photo-judge-label.review{background:var(--review-dim);color:var(--review);border:1.5px solid var(--review)}
.photo-judge-label.perm{background:#eff6ff;color:#3b82f6;border:1.5px solid #3b82f6}
.photo-judge-label.prov{background:var(--review-dim);color:var(--review);border:1.5px solid var(--review)}

/* 写真個別判定設定ボタン（ラベル未設定時） */
.photo-judge-set-btn{
  width:100%;font-size:10px;font-weight:700;
  color:var(--text-3);background:var(--surface-2);
  border:1px dashed var(--border);border-radius:5px;
  padding:3px 2px;margin-top:2px;cursor:pointer;
  transition:all .15s;text-align:center;line-height:1.4;
}
.photo-judge-set-btn:active{
  background:var(--primary-dim);border-color:var(--primary);color:var(--primary);
}

/* 写真個別判定ボトムシート */
.photo-judge-sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:600;opacity:0;pointer-events:none;
  transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
}
.photo-judge-sheet-bg.show{opacity:1;pointer-events:all}
.photo-judge-sheet{
  background:var(--surface);
  border-radius:24px 24px 0 0;
  padding:0 20px max(env(safe-area-inset-bottom),28px);
  width:100%;max-width:430px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.34,1.15,.64,1);
}
.photo-judge-sheet-bg.show .photo-judge-sheet{transform:translateY(0)}
.pjs-handle{
  width:40px;height:4px;background:var(--border);
  border-radius:100px;margin:12px auto 0;
}
.pjs-title{font-size:17px;font-weight:800;color:var(--text);margin:16px 0 2px}
.pjs-subtitle{font-size:12px;color:var(--text-3);font-weight:500;margin-bottom:16px}

.file-pick{
  margin-top:9px;width:100%;padding:10px;
  background:var(--surface-2);border:1.5px dashed var(--border);
  border-radius:11px;color:var(--text-2);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;
}
.file-pick:active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.cam-stop-btn{
  margin-top:9px;width:100%;padding:10px;
  background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.25);
  border-radius:11px;color:var(--fail);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;
}
.cam-stop-btn:active{background:var(--fail-dim);border-color:var(--fail)}
.req-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:var(--fail);
  background:var(--fail-dim);padding:3px 9px;border-radius:100px;font-weight:600;
}

/* =====================================================
   コメント
   ===================================================== */
.comment-ta{
  width:100%;padding:12px;background:var(--surface-2);
  border:1.5px solid var(--border);border-radius:12px;
  font-size:14px;color:var(--text);resize:none;min-height:78px;
  transition:border-color .15s,background .15s;line-height:1.5;
}
.comment-ta:focus{border-color:var(--primary);background:var(--surface)}
.comment-ta::placeholder{color:var(--text-3)}

/* =====================================================
   保存ボタン
   ===================================================== */
.save-btn{
  width:100%;padding:20px;margin-top:4px;
  background:#ffffff;
  border-radius:20px;color:#1a1a2e;font-size:17px;font-weight:800;
  box-shadow:0 6px 24px rgba(0,0,0,0.10),0 1.5px 4px rgba(0,0,0,0.06);
  transition:transform .12s,box-shadow .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.5px;border:1px solid rgba(0,0,0,0.05);
}
.save-btn:active{transform:scale(.98);box-shadow:0 2px 8px rgba(0,0,0,0.08)}

/* =====================================================
   履歴ページ
   ===================================================== */
.search-bar{position:relative;margin-bottom:11px}
.search-bar input{
  width:100%;padding:12px 44px 12px 16px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:13px;font-size:14px;color:var(--text);
  transition:border-color .15s;
}
.search-bar input:focus{border-color:var(--primary)}
.search-bar input::placeholder{color:var(--text-3)}
.filter-row{
  display:flex;gap:7px;overflow-x:auto;
  margin-bottom:11px;padding-bottom:2px;
}
.f-chip{
  flex-shrink:0;padding:6px 14px;border-radius:100px;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);
  background:var(--surface);color:var(--text-2);transition:all .15s;
}
.f-chip.on-all{border-color:var(--primary);background:var(--primary-dim);color:var(--primary)}
.f-chip.on-pass{border-color:var(--pass);background:var(--pass-dim);color:var(--pass)}
.f-chip.on-fail{border-color:var(--fail);background:var(--fail-dim);color:var(--fail)}
.f-chip.on-review{border-color:var(--review);background:var(--review-dim);color:var(--review)}

/* =====================================================
   履歴カード - リスト形式デザイン
   ===================================================== */
.hist-card{
  background:var(--surface);
  padding:12px 16px;
  margin-bottom:0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .12s;
  animation:fadeUp .2s ease;
  display:flex;align-items:center;gap:10px;
  border-radius:0;
  position:relative;
}
.hist-card:first-child{border-radius:14px 14px 0 0}
.hist-card:last-child{border-bottom:none;border-radius:0 0 14px 14px}
.hist-card:only-child{border-radius:14px}
.hist-card:active{background:var(--surface-2)}
/* #histList コンテナ */
#histList:not(:empty){
  box-shadow:var(--shadow);
  border-radius:14px;
  overflow:hidden;
}
/* 判断区分ドット */
.hc-dot{
  width:7px;height:7px;border-radius:50%;
  flex-shrink:0;align-self:flex-start;margin-top:5px;
}
.hc-dot-perm{background:#378ADD}
.hc-dot-prov{background:var(--review)}
.hc-dot-none{background:var(--text-3)}
/* 本文エリア */
.hc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hc-name{
  font-size:15px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hc-mfr{
  font-size:12px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hc-date{font-size:12px;color:var(--text-3);flex-shrink:0;white-space:nowrap}
/* 後方互換（詳細シート等で参照している場合に備え残す） */
.h-main{min-width:0;flex:1;padding:13px 6px 13px 0}
.h-info{min-width:0;flex:1}
.h-meta{font-size:12px;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;gap:0}
.h-sep{margin:0 5px;color:var(--border)}
.h-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.h-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
.h-badge.pass{background:var(--pass-dim);color:var(--pass)}
.h-badge.fail{background:var(--fail-dim);color:var(--fail)}
.h-badge-sub{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
.h-comment-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:500;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.hc-right{flex-shrink:0;width:72px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:12px 12px 12px 6px;gap:6px;border-left:1px solid var(--border)}
.hc-date-row{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-3);white-space:nowrap}
.hc-date-row svg{flex-shrink:0}
.hc-del-panel{flex-shrink:0;width:72px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border)}
.h-chevron{flex-shrink:0;color:var(--text-3);display:flex;align-items:center}
.h-status{flex-shrink:0;width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-left:1px solid var(--border)}
.h-status-dot{width:9px;height:9px;border-radius:50%}
.h-status-txt{font-size:11px;font-weight:700;line-height:1}
.h-status.pass .h-status-dot{background:var(--pass)}
.h-status.pass .h-status-txt{color:var(--pass)}
.h-status.fail .h-status-dot{background:var(--fail)}
.h-status.fail .h-status-txt{color:var(--fail)}
.empty{
  text-align:center;padding:64px 20px;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty svg{width:48px;height:48px}
.empty p{font-size:14px;font-weight:500}

/* =====================================================
   詳細ボトムシート
   ===================================================== */
.detail-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.48);
  z-index:200;display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.detail-bg.show{opacity:1;pointer-events:all}
.detail-sheet{
  background:var(--surface);border-radius:22px;
  width:100%;max-width:390px;
  max-height:85dvh;overflow-y:auto;
  padding:20px;
  box-shadow:0 8px 40px rgba(0,0,0,.18),0 2px 10px rgba(0,0,0,.10);
  transform:scale(0.93) translateY(10px);
  transition:transform .28s cubic-bezier(.34,1.12,.64,1);
}
.detail-bg.show .detail-sheet{transform:scale(1) translateY(0);}
.detail-handle{display:none}
.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:12px;
}
.detail-title{
  font-size:22px;font-weight:800;color:var(--text);
  flex:1;padding-right:12px;line-height:1.2;
}
.detail-close{
  width:28px;height:28px;background:var(--surface-2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border:1px solid var(--border);
}
.detail-close:active{background:var(--border)}
.detail-badge-row{margin-bottom:14px;display:flex;align-items:center;gap:7px}
.detail-row{
  display:flex;align-items:center;gap:8px;
  padding:11px 0;border-bottom:1px solid var(--border);
  font-size:14px;color:var(--text);
}
.detail-row:last-child{border-bottom:none}
.detail-lbl{
  font-size:13px;color:var(--text-2);
  width:72px;flex-shrink:0;font-weight:500;
}
.detail-val{flex:1;font-weight:500;line-height:1.5}
.detail-photos{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-top:16px;
}
.detail-photo{
  width:100%;border-radius:12px;
  aspect-ratio:1;object-fit:cover;
  cursor:pointer;transition:opacity .15s;
}
.detail-photo:active{opacity:.8}

/* =====================================================
   詳細：写真グリッド（上部・新デザイン）
   ===================================================== */
.detail-photo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:16px;
}
.detail-photo-item{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio:1;
  border:2.5px solid transparent;
  background:var(--surface-2);
  transition:opacity .15s;
  cursor:pointer;
}
.detail-photo-item:active{opacity:.8}
.detail-photo-item.ng-photo{
  border-color:var(--fail);
}
.detail-photo-item img.detail-photo{
  width:100%;height:100%;
  object-fit:cover;display:block;
  border-radius:0;aspect-ratio:unset;
}
.detail-photo-item-label{
  position:absolute;
  top:8px;left:8px;
  padding:3px 9px;
  border-radius:6px;
  font-size:11px;font-weight:700;line-height:1.4;
  pointer-events:none;
}
.detail-photo-item-label.lbl-ng{
  background:var(--fail);color:#fff;
}
.detail-photo-item-label.lbl-ok{
  background:rgba(0,0,0,.42);color:#fff;
}
.detail-photo-item-label.lbl-pass{
  background:var(--pass);color:#fff;
}
.detail-photo-item-label.lbl-perm{
  background:rgba(59,130,246,.88);color:#fff;
}
.detail-photo-item-label.lbl-prov{
  background:rgba(245,158,11,.88);color:#fff;
}
.detail-photo-item.ok-photo{
  border-color:var(--pass);
}

/* =====================================================
   詳細：写真カルーセル（新デザイン）
   ===================================================== */
.dpg-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.dpg-title{font-size:13px;font-weight:600;color:var(--text-2)}
.dpg-count{font-size:13px;font-weight:600;color:var(--text-3)}
.dpg-carousel-outer{
  overflow:hidden;margin:0 -20px;padding:0 20px;
}
.dpg-carousel{
  display:flex;gap:7px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  margin-bottom:10px;
}
.dpg-carousel::-webkit-scrollbar{display:none}
.dpg-item{
  flex:0 0 calc(33.33% - 5px);
  position:relative;border-radius:10px;overflow:hidden;
  scroll-snap-align:start;
  aspect-ratio:4/3;background:var(--surface-2);
  cursor:pointer;transition:opacity .15s;
}
.dpg-item:active{opacity:.82}
.dpg-img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.dpg-lbl{
  position:absolute;bottom:0;left:0;right:0;
  text-align:center;padding:3px 4px 5px;
  font-size:10px;font-weight:700;line-height:1.3;
}
.dpg-lbl-ng{background:rgba(239,68,68,.88);color:#fff}
.dpg-lbl-pass{background:rgba(34,197,94,.85);color:#fff}
.dpg-lbl-ok{background:rgba(0,0,0,.40);color:#fff}
.dpg-lbl-perm{background:rgba(59,130,246,.88);color:#fff}
.dpg-lbl-prov{background:rgba(245,158,11,.88);color:#fff}


/* =====================================================
   写真フルスクリーンビューアー
   ===================================================== */
.photo-viewer-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  z-index:400;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.photo-viewer-bg.show{opacity:1;pointer-events:all}
.photo-viewer-img{
  max-width:100%;max-height:100dvh;
  object-fit:contain;
  transition:transform .2s;
}
.photo-viewer-close{
  position:absolute;top:16px;right:16px;
  width:40px;height:40px;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;border:1px solid rgba(255,255,255,.2);
  cursor:pointer;transition:background .15s;z-index:1;
}
.photo-viewer-close:active{background:rgba(255,255,255,.3)}
.photo-viewer-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;border:1px solid rgba(255,255,255,.2);
  cursor:pointer;transition:background .15s;
}
.photo-viewer-nav:active{background:rgba(255,255,255,.3)}
.photo-viewer-nav.prev{left:12px}
.photo-viewer-nav.next{right:12px}
.photo-viewer-count{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.7);font-size:13px;font-weight:600;
  background:rgba(0,0,0,.4);padding:4px 14px;border-radius:100px;
}

/* =====================================================
   統計ページ
   ===================================================== */
.total-box{
  background:linear-gradient(135deg,#818cf8,#4f46e5);
  border-radius:var(--radius);padding:20px 16px;
  color:#fff;text-align:center;
  box-shadow:0 6px 20px rgba(99,102,241,.32);margin-bottom:12px;
}
.total-num{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px}
.total-lbl{font-size:13px;opacity:.8;margin-top:3px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-box{
  background:var(--surface);border-radius:15px;padding:16px 8px;
  text-align:center;box-shadow:var(--shadow);
}
.stat-num{font-size:30px;font-weight:900;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:11px;color:var(--text-2);font-weight:600}
.stat-box.pass .stat-num{color:var(--pass)}
.stat-box.fail .stat-num{color:var(--fail)}
.stat-box.review .stat-num{color:var(--review)}
.chart-card{
  background:var(--surface);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px;
}
.chart-ttl{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.bar-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-lbl{font-size:12px;color:var(--text-2);width:76px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;transition:width .5s ease}
.bar-cnt{font-size:12px;color:var(--text-2);width:22px;text-align:right;font-weight:600}
.month-bars{display:flex;align-items:flex-end;gap:7px;height:110px}
.month-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.month-bar-inner{width:100%;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;min-height:4px}
.month-lbl{font-size:10px;color:var(--text-3);font-weight:600}
.month-cnt{font-size:10px;color:var(--text-2);font-weight:700}
.legend-row{display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);font-weight:600}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* =====================================================
   設定ページ
   ===================================================== */
.settings-section{margin-bottom:22px}
.section-title{
  font-size:12px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:8px;padding-left:4px;
}
.settings-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.s-item{
  display:flex;align-items:center;padding:14px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;
}
.s-item:last-child{border-bottom:none}
.s-item:active{background:var(--surface-2)}
.s-divider{height:1px;background:var(--border);margin:0}
.s-icon{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  margin-right:13px;flex-shrink:0;
}
.s-label{flex:1;font-size:15px;color:var(--text);font-weight:500}
.s-value{font-size:13px;color:var(--text-3)}
.toggle{
  width:46px;height:27px;background:var(--border);
  border-radius:100px;position:relative;
  transition:background .22s;flex-shrink:0;
}
.toggle.on{background:var(--primary)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:21px;height:21px;background:#fff;border-radius:50%;
  transition:transform .22s;box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.toggle.on::after{transform:translateX(19px)}

/* ロット番号クイックボタン */
.lot-quick-btn{
  flex:1;padding:9px 0;border-radius:10px;
  background:var(--surface-2);border:1.5px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text-2);
  cursor:pointer;transition:all .15s;
}
.lot-quick-btn:active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.lot-quick-btn.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}

/* =====================================================
   iOSホイール日付ピッカー
   ===================================================== */
.lot-display-btn{
  width:100%;padding:12px 14px;
  background:var(--surface-2);border:1.5px solid var(--border);
  border-radius:12px;font-size:15px;color:var(--text);
  text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s;
  letter-spacing:1px;
  display:flex;align-items:center;justify-content:space-between;
}
.lot-display-btn:active{border-color:var(--primary);background:var(--surface)}
.lot-display-placeholder{color:var(--text-3)}

/* オーバーレイ */
.lot-picker-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:700;opacity:0;pointer-events:none;
  transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
  touch-action:none;
}
.lot-picker-bg.show{opacity:1;pointer-events:all}

/* シート */
.lot-picker-sheet{
  background:var(--surface);
  border-radius:24px 24px 0 0;
  width:100%;max-width:430px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.34,1.15,.64,1);
  padding-bottom:max(env(safe-area-inset-bottom),20px);
  overflow:hidden;
}
.lot-picker-bg.show .lot-picker-sheet{transform:translateY(0)}

/* ヘッダー */
.lot-picker-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid var(--border);
}
.lot-picker-cancel{
  font-size:16px;font-weight:500;color:var(--text-2);
  background:none;border:none;cursor:pointer;padding:4px 0;
}
.lot-picker-title{
  font-size:16px;font-weight:700;color:var(--text);
}
.lot-picker-done{
  font-size:16px;font-weight:600;color:var(--primary);
  background:none;border:none;cursor:pointer;padding:4px 0;
}

/* 3カラム共通 */
.lot-picker-columns{
  display:flex;align-items:stretch;justify-content:center;
  position:relative;height:220px;
  padding:0 16px;
  user-select:none;-webkit-user-select:none;
}

/* 選択ライン */
.lot-picker-columns::before,
.lot-picker-columns::after{
  content:'';
  position:absolute;left:16px;right:16px;
  top:calc(50% - 22px);height:1px;
  background:var(--border);
  pointer-events:none;
  z-index:2;
}
.lot-picker-columns::after{
  top:calc(50% + 22px);
}

/* フェードグラデ */
.lot-picker-fade{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    var(--surface) 0%,
    transparent 35%,
    transparent 65%,
    var(--surface) 100%
  );
  pointer-events:none;z-index:3;
}

/* 各カラム */
.lot-picker-col{
  flex:1;height:100%;
  position:relative;overflow:hidden;
  cursor:grab;
}
.lot-picker-col.dragging{cursor:grabbing}

.lot-picker-col-inner{
  position:absolute;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  transition:transform 0.15s cubic-bezier(.25,.46,.45,.94);
  will-change:transform;
}
.lot-picker-col-inner.no-transition{transition:none}

.lot-picker-item{
  height:44px;line-height:44px;
  font-size:20px;font-weight:400;
  color:var(--text-2);white-space:nowrap;
  text-align:center;width:100%;
  transition:font-size .1s, font-weight .1s, color .1s;
}
.lot-picker-item.selected{
  font-size:22px;font-weight:700;color:var(--text);
}

/* =====================================================
   ボトムナビ
   ===================================================== */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:var(--nav-h);
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10px;font-weight:600;
  padding:8px 4px;transition:color .15s;
}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:23px;height:23px;stroke-width:1.8}
.nav-icon-wrap{position:relative}

/* =====================================================
   トースト
   ===================================================== */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + 14px);
  left:50%;transform:translateX(-50%) translateY(10px);
  background:#1e2030;color:#fff;
  padding:11px 20px;border-radius:100px;
  font-size:14px;font-weight:600;z-index:9999;
  opacity:0;transition:all .28s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;max-width:90vw;
  display:flex;align-items:center;gap:7px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--pass)}
.toast.error{background:var(--fail)}
.toast.warning{background:var(--review)}

/* =====================================================
   モーダル
   ===================================================== */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.48);
  z-index:600;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.show{opacity:1;pointer-events:all}
.modal-box{
  background:var(--surface);border-radius:22px;padding:24px;
  width:calc(100% - 48px);max-width:360px;
  transform:scale(.94);transition:transform .22s cubic-bezier(.34,1.56,.64,1);
}
.modal-bg.show .modal-box{transform:scale(1)}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;color:var(--text)}
.modal-input{
  width:100%;padding:12px 14px;background:var(--surface-2);
  border:1.5px solid var(--border);border-radius:11px;
  font-size:15px;color:var(--text);margin-bottom:9px;
  transition:border-color .15s;
}
.modal-input:focus{border-color:var(--primary);background:var(--surface)}
.modal-input::placeholder{color:var(--text-3)}
.modal-actions{display:flex;gap:9px;margin-top:14px}
.m-btn{
  flex:1;padding:13px;border-radius:13px;
  font-size:15px;font-weight:700;transition:all .12s;
}
.m-btn.cancel{background:var(--surface-2);color:var(--text-2)}
.m-btn.cancel:active{background:var(--border)}
.m-btn.ok{background:var(--primary);color:#fff}
.m-btn.ok:active{background:#4f46e5}
.m-btn.danger{background:var(--fail);color:#fff}
.m-btn.danger:active{background:#dc2626}

/* =====================================================
   保存確認ボトムシート
   ===================================================== */
.save-confirm-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:500;opacity:0;pointer-events:none;
  transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
}
.save-confirm-bg.show{opacity:1;pointer-events:all}
.save-confirm-sheet{
  background:var(--surface);
  border-radius:24px 24px 0 0;
  padding:0 20px max(env(safe-area-inset-bottom),24px);
  width:100%;max-width:430px;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.34,1.15,.64,1);
  max-height:90vh;overflow-y:auto;
}
.save-confirm-bg.show .save-confirm-sheet{transform:translateY(0)}
.sc-handle{
  width:40px;height:4px;
  background:var(--border);border-radius:100px;
  margin:12px auto 0;
}
.sc-title{
  font-size:17px;font-weight:800;color:var(--text);
  margin:16px 0 4px;
}
.sc-subtitle{
  font-size:12px;color:var(--text-3);font-weight:500;
  margin-bottom:14px;
}
.sc-rows{
  border:1.5px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.sc-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
.sc-row:last-child{border-bottom:none}
.sc-lbl{
  font-size:11px;font-weight:700;color:var(--text-3);
  width:60px;flex-shrink:0;letter-spacing:.2px;
}
.sc-val{
  font-size:14px;font-weight:600;color:var(--text);
  flex:1;
}
.sc-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:100px;
  font-size:13px;font-weight:700;
}
.sc-badge.pass{background:var(--pass-dim);color:var(--pass)}
.sc-badge.fail{background:var(--fail-dim);color:var(--fail)}
.sc-badge.review{background:var(--review-dim);color:var(--review)}
.sc-badge.perm{background:#eff6ff;color:#3b82f6}
.sc-badge.prov{background:var(--review-dim);color:var(--review)}
.sc-actions{display:flex;gap:10px;margin-top:16px}

/* =====================================================
   アニメーション
   ===================================================== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pop{
  0%{transform:scale(1)}50%{transform:scale(.94)}100%{transform:scale(1)}

#fileInput{display:none}

.annot-bg{

  z-index:300;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.annot-bg.show{opacity:1;pointer-events:all}
.annot-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;flex-shrink:0;
  padding-top:calc(env(safe-area-inset-top,0) + 14px);
}
.annot-cancel{font-size:15px;font-weight:600;color:rgba(255,255,255,.7);background:none;border:none;padding:7px 4px}
.annot-title{font-size:15px;font-weight:700;color:#fff}
.annot-save{font-size:14px;font-weight:700;color:#fff;background:var(--primary);border:none;padding:7px 18px;border-radius:100px;box-shadow:0 3px 10px rgba(99,102,241,.45)}
.annot-hint{text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,.4);padding:0 0 8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px}
.annot-canvas-area{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}

.annot-bottom{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-shrink:0;padding-bottom:calc(env(safe-area-inset-bottom,0) + 14px)}
.annot-undo{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.13);border:none;padding:10px 18px;border-radius:100px}
.annot-clear{font-size:13px;font-weight:500;color:rgba(255,255,255,.4);background:none;border:none;padding:10px 8px}
.photo-annot-btn{position:absolute;bottom:-5px;left:-5px;width:22px;height:22px;background:var(--primary);border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer}

   ===================================================== */
/* =====================================================
   ログイン画面 — 常に1画面に収まるようdvhでスケール
   ===================================================== */
#loginScreen{
  position:fixed;inset:0;background:#eef1f7;z-index:1000;
  overflow-y:auto;
  display:flex;align-items:stretch;justify-content:center;
  padding:max(env(safe-area-inset-top,0px),16px) 16px max(env(safe-area-inset-bottom,0px),16px);
}
.login-box{
  width:100%;max-width:390px;background:#ffffff;
  border-radius:20px;
  padding:clamp(28px,5.5dvh,48px) clamp(20px,5vw,32px);
  box-shadow:0 4px 32px rgba(0,0,0,0.10);
  display:flex;flex-direction:column;justify-content:center;
}
.login-logo{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:clamp(24px,4dvh,44px);
}
.login-logo img{
  width:clamp(120px,17dvh,170px);height:auto;display:block;
}
.login-label{
  font-size:clamp(13px,1.9dvh,16px);font-weight:700;color:#1a1a2e;
  margin-bottom:clamp(5px,0.8dvh,10px);display:block;
}
.login-input-wrap{
  position:relative;margin-bottom:clamp(12px,2dvh,22px);
}
.login-input{
  width:100%;
  padding:clamp(11px,1.8dvh,16px) 16px;
  background:#ffffff;
  border:1.5px solid #d1d5db;border-radius:12px;
  font-size:clamp(14px,1.9dvh,16px);color:#1a1a2e;
  transition:border-color .15s,box-shadow .15s;display:block;
}
.login-input:focus{
  border-color:#1d6ef5;
  box-shadow:0 0 0 3px rgba(29,110,245,0.12);
  outline:none;
}
.login-input::placeholder{color:#9ca3af}
.login-input.pass-input{padding-right:48px}
.login-eye-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);

  color:#9ca3af;display:flex;align-items:center;justify-content:center;
  transition:color .15s;
}
.login-eye-btn:hover{color:#6b7280}
.login-keep-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:clamp(14px,2.2dvh,26px);cursor:pointer;
}
.login-keep-row input[type="checkbox"]{
  width:clamp(18px,2.2dvh,22px);height:clamp(18px,2.2dvh,22px);
  border-radius:5px;border:2px solid #d1d5db;
  cursor:pointer;accent-color:#1d6ef5;flex-shrink:0;
}
.login-keep-lbl{
  font-size:clamp(13px,1.8dvh,15px);color:#374151;font-weight:500;
  cursor:pointer;user-select:none;
}
.login-btn{
  width:100%;
  padding:clamp(14px,2.2dvh,18px);
  background:#1d6ef5;
  border-radius:14px;color:#fff;
  font-size:clamp(15px,2.1dvh,18px);font-weight:800;
  box-shadow:0 4px 18px rgba(29,110,245,0.38);
  transition:transform .1s,box-shadow .15s,background .15s;
  letter-spacing:.5px;
}
.login-btn:active{
  transform:scale(.98);
  box-shadow:0 2px 8px rgba(29,110,245,0.3);
  background:#155bd4;
}
.login-btn:disabled{
  opacity:0.65;cursor:not-allowed;transform:none;
}
.login-err{
  color:var(--fail);font-size:clamp(11px,1.5dvh,13px);font-weight:600;
  text-align:center;margin-top:clamp(6px,1dvh,12px);min-height:1.4em;
}

.spinner{

// 共有キー → shared/masterData/{key}
// 個別キー → users/{uid}/data/{key}
// ★ inspections は 1MB 制限を避けるため個別ドキュメント管理（後述の関数を使用）
function save(key, val) {
  DB[key] = val;
  if (!currentUser) return;
  // inspections は firestoreAddInspection / firestoreDeleteInspection で個別管理
  if (key === 'inspections') return;
  const ref = SHARED_KEYS.has(key)
    ? db.collection('shared').doc('masterData').collection('items').doc(key)
    : db.collection('users').doc(currentUser.uid).collection('data').doc(key);
  ref.set({ value: val })
    .catch(e => console.warn('Firestore save:', e));
}

// Firestore から全データをロード
async function loadFromFirestore() {
  if (!currentUser) return;
  // ユーザー切り替え時にDBをリセット（前ユーザーのデータが残らないように）
  DB.inspections      = [];
  DB.inspectors       = [...DEFAULT_INSPECTORS];
  DB.products         = [...SAMPLE_PRODUCTS];
  DB.customMfrs       = [];
  DB.hiddenMfrs       = [];
  DB.hiddenMfrHistory = [];
  try {
    // ① ユーザー個別データ（履歴系・inspections除く）をロード
    const userSnap = await db.collection('users').doc(currentUser.uid)
      .collection('data').get();
    userSnap.forEach(doc => {
      if (DB.hasOwnProperty(doc.id) && !SHARED_KEYS.has(doc.id) && doc.id !== 'inspections') {
        DB[doc.id] = doc.data().value;
      }
    });

    // ② 共有データ（マスターデータ）をロード
    const sharedSnap = await db.collection('shared').doc('masterData')
      .collection('items').get();
    sharedSnap.forEach(doc => {
      if (DB.hasOwnProperty(doc.id) && SHARED_KEYS.has(doc.id)) {
        DB[doc.id] = doc.data().value;
      }
    });

    // ③ 旧構造からの移行チェック（v55以前：data/inspections に配列保存）
    try {
      const oldRef = db.collection('users').doc(currentUser.uid).collection('data').doc('inspections');
      const oldDoc = await oldRef.get();
      if (oldDoc.exists) {
        const oldList = oldDoc.data().value || [];
        if (oldList.length > 0) {
          console.log(`[Migration] 旧形式から ${oldList.length} 件を移行中...`);
          const batch = db.batch();
          for (const insp of oldList) {
            if (!insp.id) continue;
            const ref = db.collection('users').doc(currentUser.uid)
              .collection('inspections').doc(insp.id);
            batch.set(ref, insp);
          }
          batch.delete(oldRef);
          await batch.commit();
          console.log('[Migration] 移行完了');
        } else {
          // 空のドキュメントも削除
          await oldRef.delete().catch(() => {});
        }
      }
    } catch(migErr) {
      console.warn('[Migration] 移行スキップ:', migErr);
    }

    // ④ 新構造から検品記録をロード（users/{uid}/inspections/{id}）
    // ★ Firestore インデックス要件:
    //   Collection: inspections, Field: createdAt Descending
    //   初回アクセス時にコンソールログにインデックス作成URLが表示されます
    let inspSnap;
    try {
      inspSnap = await db.collection('users').doc(currentUser.uid)
        .collection('inspections')
        .orderBy('createdAt', 'desc')
        .get();
    } catch(idxErr) {
      // インデックス未作成時はorderByなしでフォールバック
      console.warn('[Firestore] インデックス未作成。orderByなしで読み込みます:', idxErr.message);
      inspSnap = await db.collection('users').doc(currentUser.uid)
        .collection('inspections')
        .get();
    }
    // クライアント側でも日付降順にソート（確実性のため）
    DB.inspections = inspSnap.docs
      .map(doc => doc.data())
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    // 初回（データなし）のみサンプルを投入
    if (!DB.inspections.length) {
      const now = new Date();
      const samples = [
        { id:uid(), manufacturerId:'panasonic', manufacturerName:'パナソニック', productName:'EZ9L48',     inspectorId:'INS-001', inspectorName:'田中 太郎', createdByName:'田中 太郎', result:'pass',   judgeType:'恒久判断', defects:[], comment:'外観良好', photos:[], createdAt: new Date(now - 864e5*0).toISOString() },
        { id:uid(), manufacturerId:'noritz',    manufacturerName:'ノーリツ',    productName:'GT-C2052SAWX', inspectorId:'INS-002', inspectorName:'佐藤 花子', createdByName:'佐藤 花子', result:'fail',   judgeType:'暫定判断', defects:['打痕・キズ'], comment:'傷あり',   photos:[], createdAt: new Date(now - 864e5*1).toISOString() },
        { id:uid(), manufacturerId:'rinnai',    manufacturerName:'リンナイ',    productName:'RUF-A2405SAW', inspectorId:'INS-001', inspectorName:'田中 太郎', createdByName:'田中 太郎', result:'review', judgeType:'暫定判断', defects:[], comment:'要再確認', photos:[], createdAt: new Date(now - 864e5*2).toISOString() },
      ];
      DB.inspections = samples;
      // サンプルデータも新構造で Firestore に保存
      for (const s of samples) {
        firestoreAddInspection(s).catch(e => console.warn('sample save:', e));
      }
    }
    if (DB.inspectors.length === 0) {
      save('inspectors', [...DEFAULT_INSPECTORS]);
    }
  } catch(e) {
    console.warn('Firestore load:', e);
  }
}

// Firestore 検品記録 個別ドキュメント管理

/**
 * 1件の検品記録を Firestore の個別ドキュメントとして保存する。
 * photos フィールドには Drive URL のみが含まれ、base64 は保存されない。
 */
async function firestoreAddInspection(record) {
  if (!currentUser) return;
  await db.collection('users').doc(currentUser.uid)
    .collection('inspections').doc(record.id)
    .set(record);
}

/**
 * 1件の検品記録を Firestore から削除する。
 */
async function firestoreDeleteInspection(id) {
  if (!currentUser) return;
  try {
    await db.collection('users').doc(currentUser.uid)
      .collection('inspections').doc(id)
      .delete();
  } catch(e) {
    console.warn('[Firestore] inspection delete error:', e);
  }
}

/**
 * 全検品記録を Firestore から一括削除する（バッチ書き込み）。
 */
async function firestoreDeleteAllInspections() {
  if (!currentUser) return;
  try {
    const snap = await db.collection('users').doc(currentUser.uid)
      .collection('inspections').get();
    if (snap.empty) return;
    // Firestore バッチは最大500件。件数が多い場合は分割して実行。
    const batchSize = 400;
    const docs = snap.docs;
    for (let i = 0; i < docs.length; i += batchSize) {
      const batch = db.batch();
      docs.slice(i, i + batchSize).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    console.log(`[Firestore] ${docs.length} 件の検品記録を削除しました`);
  } catch(e) {
    console.warn('[Firestore] deleteAll inspections error:', e);
  }
}

/**
 * Google Identity Services の TokenClient を初期化する。
 * GIS スクリプトの async 読み込み完了を待つため、ポーリングで確認する。

// ============================================================

// OAuth 不要・fetch のみで動作
// ============================================================

/**
 * 写真を GAS ウェブアプリ経由で Google Drive にアップロードし、
 * GAS から返ってきた画像 URL を返す。
 *
 * ＜GAS へ送るデータ＞
 *   { image: "data:image/jpeg;base64,...",  // 圧縮済み base64 DataURL
 *     maker: "パナソニック",                  // メーカー名
 *     model: "EZ9L48" }                      // モデル名（製品名）
 *
 * ＜GAS からのレスポンス例＞
 *   { status: "success", url: "https://drive.google.com/..." }
 *   { status: "error",   error: "エラーメッセージ" }
 *
 * ※ GAS は "全員（匿名を含む）" でデプロイしてください。
 */
async function uploadPhotoViaGAS(base64DataUrl, makerName, modelName) {
  // 既に URL の場合（Drive URL の再保存など）はそのまま返す
  if (!base64DataUrl.startsWith('data:')) return base64DataUrl;

  // ① Canvas で圧縮（最長辺 1024px、品質 0.78）
  const compressed = await compressImage(base64DataUrl, 1024, 0.78);

  // ② GAS ウェブアプリへ POST
  // GAS は受け取った base64 画像を Drive に保存し、公開 URL を返す
  let res;
  try {
    res = await fetch(GAS_URL, {
      method:  'POST',
      // ★ 修正: 'application/json' → 'text/plain;charset=UTF-8'
      // application/json はCORSプリフライト(OPTIONS)を発生させるため、
      // GASがOPTIONSに未対応だとネットワークエラーになる。
      // text/plain はシンプルリクエスト扱いでプリフライト不要。
      // GAS側は e.postData.contents から JSON.parse() で引き続き読み取り可能。
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({
        image: compressed,        // data:image/jpeg;base64,... 形式
        maker: makerName  || '', // メーカー名
        model: modelName  || '', // モデル名（製品名）
      }),
      // GAS は一度リダイレクトするため redirect:'follow'（デフォルト）のままでよい
    });
  } catch(networkErr) {
    throw new Error(
      'GASへの接続に失敗しました。\n' +
      'ネットワーク接続とGASのデプロイ設定を確認してください。\n' +
      `(${networkErr.message})`
    );
  }

  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`GAS アップロード失敗 (HTTP ${res.status}): ${body.slice(0, 200)}`);
  }

  let result;
  try {
    result = await res.json();
  } catch(parseErr) {
    throw new Error('GAS からのレスポンスが JSON ではありません。GASの実装を確認してください。');
  }

  // エラーレスポンス判定
  if (result.status === 'error' || result.error) {
    throw new Error(`GAS エラー: ${result.error || result.message || '不明なエラー'}`);
  }

  // URL を取得（GAS 実装によりキー名が異なる場合に対応）
  const imageUrl = result.url || result.imageUrl || result.fileUrl || result.driveUrl;
  if (!imageUrl) {
    console.error('[GAS] レスポンス全体:', result);
    throw new Error(
      'GAS から画像URLが返されませんでした。\n' +
      'GASの doPost 関数が { status:"success", url:"..." } を返しているか確認してください。'
    );
  }

  console.log('[GAS] アップロード成功:', imageUrl);
  return imageUrl;
}

/** ユニークID生成 */
function uid() { return 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

/**
 * Google Drive の共有URLを <img src> で表示できる形式に変換する。
 * drive.google.com/file/d/FILE_ID/view → thumbnail?id=FILE_ID&sz=w1200
 */
function toDriveImgUrl(url) {
  if (!url || typeof url !== 'string') return url;
  if (url.startsWith('data:')) return url;
  if (!url.includes('drive.google.com')) return url;
  const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  return url;
}

/** 日時フォーマット */
function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (isToday) return `今日 ${time}`;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

/** 最近使用したメーカーを最大5件取得 */
function getRecentMfrs() {
  const inspections  = load('inspections', []);
  const customMfrs   = load('customMfrs', []);
  const allMfrs      = [...MANUFACTURERS, ...customMfrs];
  const hiddenHistory  = load('hiddenMfrHistory', []);
  const hiddenBuiltIn  = load('hiddenMfrs', []);
  const hiddenMfrs     = [...new Set([...hiddenHistory, ...hiddenBuiltIn])];
  const seen = [];
  const sorted = [...inspections].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  for (const insp of sorted) {
    if (!seen.includes(insp.manufacturerId) && !hiddenMfrs.includes(insp.manufacturerId)) {
      seen.push(insp.manufacturerId);
      if (seen.length >= 5) break;
    }
  }
  return seen.map(id => allMfrs.find(m => m.id === id)).filter(Boolean);
}

function renderMfr() {
  const trigger = document.getElementById('mfrSelectTrigger');
  const triggerText = document.getElementById('mfrTriggerText');
  if (!trigger || !triggerText) return;

  if (S.selectedMfr) {
    const customMfrs = load('customMfrs', []);
    const m = [...ALL_MANUFACTURERS, ...customMfrs].find(x => x.id === S.selectedMfr);
    const name = m ? (m.jaName || m.name) : S.selectedMfr;
    trigger.classList.add('has-value');
    triggerText.classList.add('has-value');
    triggerText.textContent = name;
  } else {
    trigger.classList.remove('has-value');
    triggerText.classList.remove('has-value');
    triggerText.textContent = 'メーカーを選択';
  }
}

  _overlayScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.top      = `-${_overlayScrollY}px`;

  document.body.style.right    = '0';

  if (--_overlayCount > 0) return;
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.top      = '';
  document.body.style.left     = '';
  document.body.style.right    = '';
  window.scrollTo(0, _overlayScrollY);
}

/** ひらがな → カタカナ変換 */
function _hiraToKata(s) {
  return s.replace(/[ぁ-ゔ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
/** カタカナ → ひらがな変換 */
function _kataToHira(s) {
  return s.replace(/[ァ-ヴ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

/**
 * 入力正規化：全角英数→半角、半角カタカナ→全角カタカナ（濁点合成あり）
 * 例: "ＬＩＸＩＬ" → "LIXIL"、"ﾊﾟﾅｿﾆｯｸ" → "パナソニック"
 */
function _normalizeWidth(s) {
  // 全角英数記号 → 半角（！-～ = U+FF01-FF5E → U+0021-007E）
  s = s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // 全角スペース → 半角スペース
  s = s.replace(/　/g, ' ');
  // 半角カタカナ → 全角カタカナ（濁点・半濁点の結合も処理）
  const hkMap = {
    'ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ',
    'ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ','ｰ':'ー',
    'ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ',
    'ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ',
    'ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ',
    'ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト',
    'ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ',
    'ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ',
    'ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ',
    'ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ',
    'ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ',
    'ﾜ':'ワ','ﾝ':'ン',
  };
  const dakuMap = {
    'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ',
    'サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド',
    'ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ',
    'ウ':'ヴ',
  };
  const handakuMap = {
    'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ',
  };
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], next = s[i + 1], zk = hkMap[c];
    if (zk) {
      if      (next === 'ﾞ' && dakuMap[zk])   { out += dakuMap[zk];   i++; }
      else if (next === 'ﾟ' && handakuMap[zk]) { out += handakuMap[zk]; i++; }
      else                                      { out += zk; }
    } else { out += c; }
  }
  return out;
}
