// Firestore に保存（fire-and-forget）
function save(key, val) {
  DB[key] = val;
  if (!currentUser) return;
  db.collection('users').doc(currentUser.uid)
    .collection('data').doc(key)
    .set({ value: val })
    .catch(e => console.warn('Firestore save:', e));
}

// Firestore から全データをロード
async function loadFromFirestore() {
  if (!currentUser) return;

// 写真を圧縮してbase64のままFirestoreに保存（Storage不要・完全無料）
async function uploadPhoto(base64DataUrl) {
  if (!base64DataUrl.startsWith('data:')) return base64DataUrl;
  try {
    // Firestoreの1MBドキュメント制限に収まるよう圧縮
    return await compressImage(base64DataUrl, 700, 0.65);
  } catch(e) {
    return base64DataUrl;
  }
}

/** ユニークID生成 */
function uid() { return 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

/** 日時フォーマット */
function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (isToday) return `今日 ${time}`;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

/** 最近使用したメーカーを最大5件取得 */
function getRecentMfrs() {
  const inspections  = load('inspections', []);
  const customMfrs   = load('customMfrs', []);
  const allMfrs      = [...MANUFACTURERS, ...customMfrs];
  const hiddenHistory  = load('hiddenMfrHistory', []);
  const hiddenBuiltIn  = load('hiddenMfrs', []);
  const hiddenMfrs     = [...new Set([...hiddenHistory, ...hiddenBuiltIn])];
  const seen = [];
  const sorted = [...inspections].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  for (const insp of sorted) {
    if (!seen.includes(insp.manufacturerId) && !hiddenMfrs.includes(insp.manufacturerId)) {
      seen.push(insp.manufacturerId);
      if (seen.length >= 5) break;
    }
  }
  return seen.map(id => allMfrs.find(m => m.id === id)).filter(Boolean);
}

function renderMfr() {
  const trigger = document.getElementById('mfrSelectTrigger');
  const triggerText = document.getElementById('mfrTriggerText');
  if (!trigger || !triggerText) return;

  if (S.selectedMfr) {
    const customMfrs = load('customMfrs', []);
    const m = [...ALL_MANUFACTURERS, ...customMfrs].find(x => x.id === S.selectedMfr);
    const name = m ? (m.jaName || m.name) : S.selectedMfr;
    trigger.classList.add('has-value');
    triggerText.classList.add('has-value');
    triggerText.textContent = name;
  } else {
    trigger.classList.remove('has-value');
    triggerText.classList.remove('has-value');
    triggerText.textContent = 'メーカーを選択';
  }
}

let _overlayScrollY = 0;

function _lockScroll() {
  if (++_overlayCount > 1) return;
  _overlayScrollY = window.scrollY;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.top      = `-${_overlayScrollY}px`;
  document.body.style.left     = '0';
  document.body.style.right    = '0';
}

function _unlockScroll() {
  if (--_overlayCount > 0) return;
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.top      = '';
  document.body.style.left     = '';
  document.body.style.right    = '';
  window.scrollTo(0, _overlayScrollY);
}

/** ひらがな → カタカナ変換 */
function _hiraToKata(s) {
  return s.replace(/[ぁ-ゔ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
/** カタカナ → ひらがな変換 */
function _kataToHira(s) {
  return s.replace(/[ァ-ヴ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

/**
 * 入力正規化：全角英数→半角、半角カタカナ→全角カタカナ（濁点合成あり）
 * 例: "ＬＩＸＩＬ" → "LIXIL"、"ﾊﾟﾅｿﾆｯｸ" → "パナソニック"
 */
function _normalizeWidth(s) {
  // 全角英数記号 → 半角（！-～ = U+FF01-FF5E → U+0021-007E）
  s = s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // 全角スペース → 半角スペース
  s = s.replace(/　/g, ' ');
  // 半角カタカナ → 全角カタカナ（濁点・半濁点の結合も処理）
  const hkMap = {
    'ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ',
    'ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ','ｰ':'ー',
    'ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ',
    'ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ',
    'ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ',
    'ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト',
    'ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ',
    'ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ',
    'ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ',
    'ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ',
    'ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ',
    'ﾜ':'ワ','ﾝ':'ン',
  };
  const dakuMap = {
    'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ',
    'サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド',
    'ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ',
    'ウ':'ヴ',
  };
  const handakuMap = {
    'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ',
  };
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], next = s[i + 1], zk = hkMap[c];
    if (zk) {
      if      (next === 'ﾞ' && dakuMap[zk])   { out += dakuMap[zk];   i++; }
      else if (next === 'ﾟ' && handakuMap[zk]) { out += handakuMap[zk]; i++; }
      else                                      { out += zk; }
    } else { out += c; }
  }
  return out;
}

function renderMfrResults(q) {
  const raw   = q.trim();
  const norm  = _normalizeWidth(raw);   // 全角→半角、半角カナ→全角カナ
  const lower = norm.toLowerCase();     // 英字を小文字統一
  const kataQ = _hiraToKata(norm);      // ひらがな→カタカナ
  const hiraQ = _kataToHira(norm);      // カタカナ→ひらがな

  const container = document.getElementById('mfrResultList');
  if (!container) return;

  const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
  const searchIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
  const checkIcon  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="16" height="16" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const chevRight  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>`;

  // 検索文字列をハイライトするヘルパー
  const hl = text => {
    if (!raw) return text;
    try {
      return text.replace(
        new RegExp(`(${raw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
        m => `<span style="color:var(--primary);font-weight:700">${m}</span>`
      );
    } catch(e) { return text; }
  };

  // 最近の選択（最大5件）を取得 → クエリでフィルタリング
  const recent = getRecentMfrs();
  const filteredRecent = norm
    ? recent.filter(m => {
        const st = MFR_SEARCH_TEXT[m.id] || '';
        return m.name.toLowerCase().includes(lower)         ||
               (m.jaName||'').toLowerCase().includes(lower) ||
               m.name.includes(kataQ) || (m.jaName||'').includes(kataQ) ||
               m.name.includes(hiraQ) || (m.jaName||'').includes(hiraQ) ||
               st.includes(lower) || st.includes(kataQ)    || st.includes(hiraQ);
      })
    : recent;

  let html = '';

  if (norm) {
    // 入力あり → 検索候補のみ（履歴は非表示）
    const customMfrs = load('customMfrs', []);
    const hiddenMfrsSet = new Set(load('hiddenMfrs', []));
    const allSearchable = [...ALL_MANUFACTURERS, ...customMfrs].filter(m => !hiddenMfrsSet.has(m.id));
    const candidates = allSearchable.filter(m => {
      const st = MFR_SEARCH_TEXT[m.id] || '';
      return m.name.toLowerCase().includes(lower)         ||
             (m.jaName||'').toLowerCase().includes(lower) ||
             m.name.includes(kataQ) || (m.jaName||'').includes(kataQ) ||
             m.name.includes(hiraQ) || (m.jaName||'').includes(hiraQ) ||
             st.includes(lower) || st.includes(kataQ)    || st.includes(hiraQ);
    });

    if (candidates.length > 0) {
      html += candidates.map(m => {
        const sel = S.selectedMfr === m.id;
        return `<div class="mfr-result-item${sel ? ' selected-item' : ''}" onclick="pickMfrFromSearch('${m.id}')">
          <div class="mfr-result-icon">
            <span style="color:var(--primary);display:flex">${searchIcon}</span>
          </div>
          <div class="mfr-result-info">
            <div class="mfr-result-name">${hl(m.jaName || m.name)}</div>
          </div>
          ${sel ? `<span style="color:var(--primary);display:flex;align-items:center">${checkIcon}</span>` : ''}
        </div>`;
      }).join('');
    } else {
      // ヒットなし → 登録オプション表示
      const safeId  = raw.replace(/'/g, "\\'");
      const safeTxt = raw.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `<div class="mfr-no-result-section">
        <div class="mfr-no-result-label">該当なし</div>
        <button class="mfr-register-btn" onclick="registerCustomMfr('${safeId}')">
          ＋「${safeTxt}」を登録
        </button>
      </div>`;
    }

  } else {
    // 入力なし → 履歴のみ
    if (recent.length > 0) {
      const editLbl = mfrHistEditMode
        ? `<button onclick="toggleMfrHistEdit()" style="font-size:12px;font-weight:600;color:var(--primary);background:none;border:none;cursor:pointer;padding:0;line-height:1;">完了</button>`
        : `<button onclick="toggleMfrHistEdit()" style="font-size:12px;font-weight:600;color:var(--text-3);background:none;border:none;cursor:pointer;padding:0;line-height:1;">編集</button>`;
      html += `<div class="mfr-sec-hdr" style="display:flex;align-items:center;justify-content:space-between;">
        <span>履歴（最近の選択）</span>${editLbl}</div>`;
      html += recent.map(m => {
        const safeId = m.id.replace(/'/g, "\\'");
        const clickAttr = mfrHistEditMode ? '' : `onclick="pickMfrFromSearch('${safeId}')"`;
        const delBtn = mfrHistEditMode
          ? `<button onclick="event.stopPropagation();deleteMfrHistory('${safeId}')"
               style="flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
                      background:var(--fail-dim);border-radius:50%;border:none;cursor:pointer;color:var(--fail);">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
             </button>`
          : '';
        const rowStyle = mfrHistEditMode ? 'cursor:default;' : '';
        return `<div class="mfr-hist-row" style="${rowStyle}" ${clickAttr}>
          <span class="mfr-hist-icon">${clockIcon}</span>
          <span class="mfr-hist-name">${m.jaName || m.name}</span>
          ${delBtn}
        </div>`;
      }).join('');
    }
  }

  container.innerHTML = html;
}

    html += `<div class="mfr-sec-hdr" style="display:flex;align-items:center;justify-content:space-between;">
      <span>履歴（最近の選択）</span>${editLbl}</div>`;
    html += filteredHist.map(p => {
      const sel = S.productName === p;
      const esc = p.replace(/'/g, "\\'");
      const disp = raw
        ? p.replace(new RegExp(`(${raw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
            m => `<span style="color:var(--primary);font-weight:700">${m}</span>`)
        : p;
      const clickAttr = productHistEditMode ? '' : `onclick="pickProductFromSearch('${esc}')"`;
      const delBtn = productHistEditMode
        ? `<button onclick="event.stopPropagation();deleteProductHistory('${esc}')"
             style="flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
                    background:var(--fail-dim);border-radius:50%;border:none;cursor:pointer;color:var(--fail);">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
           </button>`
        : (sel ? `<span style="color:var(--primary);display:flex;align-items:center">${checkIcon}</span>` : '');
      const rowStyle = productHistEditMode ? 'cursor:default;' : '';
      return `<div class="mfr-hist-row${sel && !productHistEditMode ? ' selected-item' : ''}" style="${rowStyle}" ${clickAttr}>
        <span class="mfr-hist-icon">${clockIcon}</span>
        <span class="mfr-hist-name" style="${sel && !productHistEditMode ? 'color:var(--primary)' : ''}">${disp}</span>
        ${delBtn}
      </div>`;
    }).join('');
  }

  if (raw) {
    // ② 入力あり → 入力値をそのまま使う「選択」ボタン
    const exactMatch = history.some(p => p.toLowerCase() === lower);
    if (!exactMatch) {
      const safeEsc = raw.replace(/'/g, "\\'");
      const safeTxt = raw.replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `<div class="mfr-no-result-section">
        <button class="mfr-register-btn" onclick="pickProductFromSearch('${safeEsc}')">
          ＋「${safeTxt}」を使用
        </button>
      </div>`;
    }
    if (!filteredHist.length) {
      html += `<div class="mfr-hint-row">履歴に該当なし — 上のボタンで直接使用できます</div>`;
    }
  } else if (!history.length) {
    html += `<div class="mfr-hint-row">履歴はまだありません。製品名を入力してください</div>`;
  } else {
    html += `<div class="mfr-all-link" style="pointer-events:none;opacity:0;height:1px"></div>`;
  }

  container.innerHTML = html;
}

  S.showAllMfr  = false;

  renderMfr();

// ============================================================
// OCR カメラモーダル
// ============================================================

let _ocrStream = null;
let _ocrFacing = 'environment';
let _ocrAutoTimer = null;   // 自動スキャン用タイマー
let _ocrScanning = false;   // 自動スキャン稼働フラグ
let _ocrTorchOn  = false;   // トーチ状態
let _sharpTimer  = null;    // ライブシャープネス更新タイマー
let _ocrIsRetry  = false;   // 自動リトライフラグ

/** OCR カメラモーダルを開く */
function startProductOCR() {
  const modal = document.getElementById('ocrModal');
  modal.classList.add('active');
  _ocrScanning = false;

  // 撮影ボタンを起動中は無効化
  const btn = document.getElementById('ocrShootBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.45'; }
  _setOCRGuide('loading');

  _openOCRCamera(_ocrFacing);
  // Tesseract（日本語+英語）を先行ロード
  if (!window.Tesseract) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    document.head.appendChild(s);
  }
}

async function _openOCRCamera(facing) {
  _stopAutoScan();
  try {
    if (_ocrStream) { _ocrStream.getTracks().forEach(t => t.stop()); _ocrStream = null; }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width:  { ideal: 3840, min: 1280 },
        height: { ideal: 2160, min: 720 },
        focusMode: { ideal: 'continuous' },   // オートフォーカス常時ON
        zoom:      { ideal: 1.0 },            // ズームなし（全体表示）
      }
    });
    _ocrStream = stream;

    // 対応していればオートフォーカスをロック解除
    const track = stream.getVideoTracks()[0];
    if (track && typeof track.applyConstraints === 'function') {
      try {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      } catch(_) {}
      // トーチ対応確認
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const torchBtn = document.getElementById('ocrTorchBtn');
        if (caps.torch && torchBtn) {
          torchBtn.style.display = 'flex';
          _ocrTorchOn = false;
          torchBtn.classList.remove('active');
        } else if (torchBtn) {
          torchBtn.style.display = 'none';
        }
      } catch(_) {}
    }

    const v = document.getElementById('ocrVideo');
    v.srcObject = stream;

    // タップでフォーカスポイント指定
    v.onclick = async (e) => {
      if (!_ocrStream) return;
      const tr2 = _ocrStream.getVideoTracks()[0];
      if (!tr2 || typeof tr2.applyConstraints !== 'function') return;
      try {
        const rect = v.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top)  / rect.height;
        await tr2.applyConstraints({ advanced: [{ focusMode: 'manual', pointOfInterest: { x, y } }] });
        setTimeout(() => tr2.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{}), 1500);
      } catch(_) {}
    };

    // カメラ安定後に撮影ボタンを有効化 + シャープネスモニター開始
    v.onloadedmetadata = () => {
      setTimeout(() => {
        const btn = document.getElementById('ocrShootBtn');
        if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
        _setOCRGuide('ready');
        _startSharpnessMonitor();
      }, 800);
    };
  } catch(e) {
    console.warn('OCR camera:', e);
    showToast('カメラにアクセスできません。ファイルから選択してください。', 'error');
  }
}

function flipOCRCamera() {
  _ocrFacing = (_ocrFacing === 'environment') ? 'user' : 'environment';
  _openOCRCamera(_ocrFacing);
}

/** トーチ（フラッシュ）ON/OFF */
async function toggleOCRTorch() {
  if (!_ocrStream) return;
  const track = _ocrStream.getVideoTracks()[0];
  if (!track) return;
  _ocrTorchOn = !_ocrTorchOn;
  try {
    await track.applyConstraints({ advanced: [{ torch: _ocrTorchOn }] });
    const btn = document.getElementById('ocrTorchBtn');
    if (btn) btn.classList.toggle('active', _ocrTorchOn);
  } catch(e) {
    _ocrTorchOn = false;
    showToast('ライトは非対応です', 'default');
  }
}

function closeOCRModal() {
  _stopAutoScan();
  _stopSharpnessMonitor();
  // トーチをOFFにしてからストリームを停止
  if (_ocrStream) {
    if (_ocrTorchOn) {
      try { _ocrStream.getVideoTracks()[0]?.applyConstraints({ advanced: [{ torch: false }] }); } catch(_) {}
      _ocrTorchOn = false;
    }
    _ocrStream.getTracks().forEach(t => t.stop()); _ocrStream = null;
  }
  const modal = document.getElementById('ocrModal');
  if (modal) modal.classList.remove('active');
  const v = document.getElementById('ocrVideo');
  if (v) v.srcObject = null;
  // フレームの processing クラスを除去
  const fr = document.getElementById('ocrScanFrame');
  if (fr) fr.classList.remove('processing');
  const torchBtn = document.getElementById('ocrTorchBtn');
  if (torchBtn) { torchBtn.style.display = 'none'; torchBtn.classList.remove('active'); }
}

// ── スキャン状態管理 ──────────────────────────────────────────

/** 撮影モードのガイド表示を切り替える
 *  state: 'loading'|'ready'|'scanning'|'done'
 */
function _setOCRGuide(state) {
  const guide    = document.getElementById('ocrGuideMain');
  const guideSub = document.getElementById('ocrGuideSub');
  const btn      = document.getElementById('ocrShootBtn');
  const st       = document.getElementById('ocrStatusBadge');
  const map = {
    loading:  { main:'カメラを起動中...', sub:'しばらくお待ちください', badge:'', btnOff:true },
    ready:    { main:'製品名をフレーム内に合わせて撮影', sub:'AI が製品名・品番を自動認識します', badge:'', btnOff:false },
    scanning: { main:'AI が読み取り中...', sub:'そのままお待ちください', badge:'処理中', btnOff:true },
    done:     { main:'読み取り完了', sub:'結果を確認してください', badge:'完了', btnOff:false },
  };
  const m = map[state] || map.ready;
  if (guide)    guide.textContent    = m.main;
  if (guideSub) guideSub.textContent = m.sub;
  if (st)       st.textContent       = m.badge;
  if (btn)      { btn.disabled = m.btnOff; btn.style.opacity = m.btnOff ? '0.45' : '1'; }
}

function _stopAutoScan() {
  _ocrScanning = false;
  if (_ocrAutoTimer) { clearTimeout(_ocrAutoTimer); _ocrAutoTimer = null; }
}

/**
 * ライブシャープネスモニター
 * 500ms ごとにフレームのラプラシアン分散を計測し、
 * ドット5個でピント状態を色表示（赤→橙→緑）
 */
function _startSharpnessMonitor() {
  _stopSharpnessMonitor();
  const GOOD = 200, OK = 80; // しきい値
  _sharpTimer = setInterval(() => {
    const video = document.getElementById('ocrVideo');
    const frame = document.getElementById('ocrScanFrame');
    if (!video || !video.videoWidth || !frame) return;

    // フレーム中央 160×60px をサンプリング（軽量）
    const cv = document.createElement('canvas');
    cv.width = 160; cv.height = 60;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const vr = video.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    const vw = video.videoWidth, vh = video.videoHeight;
    const dw = vr.width, dh = vr.height;
    const vAsp = vw/vh, dAsp = dw/dh;
    let sc, ox, oy;
    if (vAsp > dAsp) { sc = vh/dh; ox = (vw - dw*sc)/2; oy = 0; }
    else              { sc = vw/dw; ox = 0; oy = (vh - dh*sc)/2; }
    const fx = (fr.left - vr.left)*sc + ox;
    const fy = (fr.top  - vr.top )*sc + oy;
    const fw = fr.width*sc, fh = fr.height*sc;
    const sx = Math.max(0, Math.round(fx + fw/2 - 80*sc));
    const sy = Math.max(0, Math.round(fy + fh/2 - 30*sc));
    try {
      ctx.drawImage(video, sx, sy, 160*sc, 60*sc, 0, 0, 160, 60);
    } catch(_) { return; }
    const sharp = _measureSharpness(ctx, 160, 60);

    // ドット更新（5段階）
    const level = sharp >= GOOD   ? 5
                : sharp >= GOOD*0.6? 4
                : sharp >= OK     ? 3
                : sharp >= OK*0.5 ? 2
                                  : 1;
    const color = level >= 4 ? '#22c55e' : level >= 3 ? '#f59e0b' : '#ef4444';
    const label = level >= 4 ? '鮮明' : level >= 3 ? '普通' : '近づける';
    for (let i = 0; i < 5; i++) {
      const dot = document.getElementById(`sd${i}`);
      if (dot) dot.style.background = i < level ? color : 'rgba(255,255,255,.2)';
    }
    const lbl = document.getElementById('ocrSharpLabel');
    if (lbl) { lbl.textContent = label; lbl.style.color = level >= 4 ? 'rgba(34,197,94,.85)' : level >= 3 ? 'rgba(245,158,11,.85)' : 'rgba(239,68,68,.85)'; }
  }, 500);
}

function _stopSharpnessMonitor() {
  if (_sharpTimer) { clearInterval(_sharpTimer); _sharpTimer = null; }
}

/**
 * フレーム領域を 2倍スケールでキャプチャし、OCR向け前処理を施した PNG Blob を返す
 * ① 2× アップスケール  ② グレースケール化  ③ コントラストストレッチ  ④ シャープ化
 */
async function _captureFrameBlob(video) {
  try {
    const frame  = document.getElementById('ocrScanFrame');
    const canvas = document.getElementById('ocrCanvas');
    const vr = video.getBoundingClientRect();
    const fr = frame.getBoundingClientRect();
    const vw = video.videoWidth, vh = video.videoHeight;
    const dw = vr.width, dh = vr.height;
    const vAsp = vw / vh, dAsp = dw / dh;
    let scale, offX, offY;
    if (vAsp > dAsp) { scale = vh / dh; offX = (vw - dw * scale) / 2; offY = 0; }
    else              { scale = vw / dw; offX = 0; offY = (vh - dh * scale) / 2; }
    const fx = (fr.left - vr.left) * scale + offX;
    const fy = (fr.top  - vr.top ) * scale + offY;
    const fw = fr.width  * scale;
    const fh = fr.height * scale;
    const pad = Math.round(10 * scale);
    const sx = Math.max(0, Math.round(fx - pad));
    const sy = Math.max(0, Math.round(fy - pad));
    const sw = Math.min(vw - sx, Math.round(fw + pad * 2));
    const sh = Math.min(vh - sy, Math.round(fh + pad * 2));

    // 3× スケールアップ（細かい型番文字の認識精度向上）
    const SCALE = 3;
    canvas.width  = sw * SCALE;
    canvas.height = sh * SCALE;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw * SCALE, sh * SCALE);

    // ① ぼけ検出用シャープネスをキャプチャ直後に計測
    const sharpness = _measureSharpness(ctx, canvas.width, canvas.height);

    // カラーのまま返す（Claude Vision用）。Tesseract使用時は processOCR 内で前処理する
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    return { blob, sharpness };
  } catch(e) { console.error('capture error:', e); return null; }
}

/**
 * ① ぼけ検出: ラプラシアン分散でシャープネスを計測
 * 高いほど鮮明。中心領域 200×100px をサンプリングして高速化
 */
function _measureSharpness(ctx, w, h) {
  const rw = Math.min(200, w), rh = Math.min(100, h);
  const rx = Math.max(0, Math.floor((w - rw) / 2));
  const ry = Math.max(0, Math.floor((h - rh) / 2));
  const d  = ctx.getImageData(rx, ry, rw, rh).data;
  const n  = rw * rh;

  const gray = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    gray[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
  }

  let sum = 0, sum2 = 0, cnt = 0;
  for (let y = 1; y < rh-1; y++) {
    for (let x = 1; x < rw-1; x++) {
      const i   = y*rw + x;
      const lap = 4*gray[i] - gray[(y-1)*rw+x] - gray[(y+1)*rw+x]
                             - gray[y*rw+(x-1)] - gray[y*rw+(x+1)];
      sum += lap; sum2 += lap*lap; cnt++;
    }
  }
  const mean = sum / cnt;
  return sum2/cnt - mean*mean; // 分散（大きいほど鮮明）
}

/**
 * OCR 精度向上のための画像前処理（Tesseract 用）
 *   1. グレースケール化 (Rec.601 輝度重み)
 *   2. メディアンフィルタ 3×3（ノイズ除去）
 *   3. Otsu 法による2領域コントラストストレッチ（照明ムラ対応）
 *   4. アンシャープマスク（USM）シャープ化
 * ※ Tesseract 自身が二値化を行うため、ここでは二値化しない
 */
function _applyOCRPreprocess(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const n = w * h;

  // ── Step 1: グレースケール化 (Rec.601) ────────────────────
  const gray = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) {
    gray[i] = Math.round(0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]);
  }

  // ── Step 2: メディアンフィルタ 3×3（衝撃性ノイズ除去）──────
  const med = new Uint8ClampedArray(n);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (x === 0 || x === w-1 || y === 0 || y === h-1) { med[i] = gray[i]; continue; }
      const nb = [
        gray[(y-1)*w+(x-1)], gray[(y-1)*w+x], gray[(y-1)*w+(x+1)],
        gray[y*w+(x-1)],     gray[i],          gray[y*w+(x+1)],
        gray[(y+1)*w+(x-1)], gray[(y+1)*w+x],  gray[(y+1)*w+(x+1)],
      ].sort((a,b) => a-b);
      med[i] = nb[4];
    }
  }

  // ── Step 3: Otsu 法で自動閾値を算出しコントラストストレッチ ──
  const hist = new Float32Array(256);
  for (let i = 0; i < n; i++) hist[med[i]]++;
  let sumAll = 0;
  for (let k = 0; k < 256; k++) sumAll += k * hist[k];
  let sumB = 0, wB = 0, maxBetween = 0, otsuT = 128;
  for (let k = 0; k < 256; k++) {
    wB += hist[k];
    if (!wB) continue;
    const wF = n - wB;
    if (!wF) break;
    sumB += k * hist[k];
    const mB = sumB / wB, mF = (sumAll - sumB) / wF;
    const between = wB * wF * (mB - mF) ** 2;
    if (between > maxBetween) { maxBetween = between; otsuT = k; }
  }
  // 暗領域(テキスト)は 0〜127 へ圧縮、明領域(背景)は 128〜255 へ拡張
  const stretched = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) {
    const v = med[i];
    stretched[i] = v <= otsuT
      ? Math.round(v / (otsuT || 1) * 127)
      : 128 + Math.round((v - otsuT) / (255 - otsuT || 1) * 127);
  }

  // ── Step 4: アンシャープマスク（USM）シャープ化 ─────────────
  // 3×3 ガウスぼかし → 元画像 + amount×(元画像 - ぼかし)
  const GAUSS = [1,2,1, 2,4,2, 1,2,1]; const GW = 16;
  const blur = new Uint8ClampedArray(n);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (x === 0 || x === w-1 || y === 0 || y === h-1) { blur[i] = stretched[i]; continue; }
      const sum =
        GAUSS[0]*stretched[(y-1)*w+(x-1)] + GAUSS[1]*stretched[(y-1)*w+x] + GAUSS[2]*stretched[(y-1)*w+(x+1)] +
        GAUSS[3]*stretched[y*w+(x-1)]     + GAUSS[4]*stretched[i]          + GAUSS[5]*stretched[y*w+(x+1)]     +
        GAUSS[6]*stretched[(y+1)*w+(x-1)] + GAUSS[7]*stretched[(y+1)*w+x]  + GAUSS[8]*stretched[(y+1)*w+(x+1)];
      blur[i] = Math.round(sum / GW);
    }
  }
  const USM = 1.8;
  const sharp = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) {
    sharp[i] = Math.max(0, Math.min(255, Math.round(stretched[i] + USM * (stretched[i] - blur[i]))));
  }

  // グレー画像として書き戻す
  for (let i = 0; i < n; i++) {
    d[i*4] = d[i*4+1] = d[i*4+2] = sharp[i];
    d[i*4+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
}

/**
 * 撮影ボタン押下
 * ③ 150ms 間隔で3フレームを連続撮影し、最もシャープなものを選択
 * ① 最良フレームでも閾値未満ならぼけ警告を出して中断
 */
async function captureOCRFrame() {
  const video = document.getElementById('ocrVideo');
  if (!video || !video.videoWidth) { showToast('カメラが準備中です', 'error'); return; }

  const fr  = document.getElementById('ocrScanFrame');
  const btn = document.getElementById('ocrShootBtn');
  if (fr)  fr.classList.add('processing');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.45'; }
  _setOCRGuide('scanning');

  // ③ 7フレーム連続撮影（90ms 間隔）→ 最もシャープなものを採用
  const frames = [];
  for (let i = 0; i < 7; i++) {
    const result = await _captureFrameBlob(video);
    if (result?.blob) frames.push(result);
    if (i < 6) await new Promise(r => setTimeout(r, 90));
  }

  if (fr)  fr.classList.remove('processing');
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; }

  if (!frames.length) {
    _setOCRGuide('ready');
    showToast('撮影に失敗しました。再度お試しください。', 'error');
    return;
  }

  // シャープネス降順でソートし上位2フレームを選択（デュアルフレームVision用）
  frames.sort((a, b) => b.sharpness - a.sharpness);
  const best   = frames[0];
  const second = frames[1] || null;  // 2枚目（デュアルフレーム用）

  // ① ぼけ検出: 最良フレームが閾値未満なら警告して中断
  const BLUR_THRESHOLD = 75;
  if (best.sharpness < BLUR_THRESHOLD) {
    _setOCRGuide('ready');
    showToast('ぼけています。カメラをもっと近づけて再撮影してください。', 'warning');
    return;
  }

  closeOCRModal();
  await processOCR(best.blob, second?.blob ?? null);
}

/** Blob/File を { base64, mimeType } に変換 */
function _blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve({ base64: result.split(',')[1], mimeType: blob.type || 'image/jpeg' });
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/**
 * Claude Vision 送信前にカラー画像を自動レベル補正する
 * チャンネル別ヒストグラムストレッチでコントラストを最大化
 */
async function _enhanceColorForVision(blob) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      // 短辺が 1200px 未満なら拡大
      const minDim = Math.min(img.width, img.height);
      const s = minDim < 1200 ? Math.ceil(1200 / minDim) : 1;
      const w = img.width * s, h = img.height * s;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);

      const id = ctx.getImageData(0, 0, w, h);
      const d = id.data, n = w * h;

      // 1% パーセンタイルクリッピングで外れ値を無視したストレッチ
      const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      for (let i = 0; i < n; i++) {
        hist[0][d[i*4]]++; hist[1][d[i*4+1]]++; hist[2][d[i*4+2]]++;
      }
      const clip = Math.max(1, Math.round(n * 0.01));
      const lo = [0,0,0], hi = [255,255,255];
      for (let c = 0; c < 3; c++) {
        let acc = 0;
        for (let k = 0; k < 256; k++) { acc += hist[c][k]; if (acc >= clip) { lo[c] = k; break; } }
        acc = 0;
        for (let k = 255; k >= 0; k--) { acc += hist[c][k]; if (acc >= clip) { hi[c] = k; break; } }
        if (hi[c] <= lo[c]) { lo[c] = 0; hi[c] = 255; }
      }
      const lut = [new Uint8ClampedArray(256), new Uint8ClampedArray(256), new Uint8ClampedArray(256)];
      for (let c = 0; c < 3; c++) {
        const range = hi[c] - lo[c] || 1;
        for (let k = 0; k < 256; k++) {
          lut[c][k] = Math.max(0, Math.min(255, Math.round((k - lo[c]) / range * 255)));
        }
      }
      for (let i = 0; i < n; i++) {
        d[i*4] = lut[0][d[i*4]]; d[i*4+1] = lut[1][d[i*4+1]]; d[i*4+2] = lut[2][d[i*4+2]];
      }
      ctx.putImageData(id, 0, 0);

      // ── アンシャープマスク（輪郭強調）──────────────────────
      // ヒストグラム補正後に適用。文字エッジを際立たせClaude誤読を低減。
      // セパラブルボックスブラー（radius=1）→ 差分を amount 倍して加算
      const id2 = ctx.getImageData(0, 0, w, h);
      const d2  = id2.data;
      const USM_AMOUNT = 1.4;  // 強調量（1.0=等倍加算、大きすぎるとハロー発生）
      const blurred = new Uint8ClampedArray(d2.length);

      // 水平パス
      const tmp = new Uint8ClampedArray(d2.length);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const xL = Math.max(0, x - 1), xR = Math.min(w - 1, x + 1);
          for (let c = 0; c < 3; c++) {
            tmp[(y*w+x)*4+c] = (d2[(y*w+xL)*4+c] + d2[(y*w+x)*4+c] + d2[(y*w+xR)*4+c]) / 3;
          }
          tmp[(y*w+x)*4+3] = 255;
        }
      }
      // 垂直パス
      for (let y = 0; y < h; y++) {
        const yU = Math.max(0, y - 1), yD = Math.min(h - 1, y + 1);
        for (let x = 0; x < w; x++) {
          for (let c = 0; c < 3; c++) {
            blurred[(y*w+x)*4+c] = (tmp[(yU*w+x)*4+c] + tmp[(y*w+x)*4+c] + tmp[(yD*w+x)*4+c]) / 3;
          }
          blurred[(y*w+x)*4+3] = 255;
        }
      }
      // 差分加算（クランプ付き）
      for (let i = 0; i < d2.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          d2[i+c] = Math.max(0, Math.min(255, Math.round(d2[i+c] + USM_AMOUNT * (d2[i+c] - blurred[i+c]))));
        }
      }
      ctx.putImageData(id2, 0, 0);

      cv.toBlob(b => resolve(b || blob), 'image/jpeg', 0.93);
    };
    img.onerror = () => resolve(blob);
    img.src = URL.createObjectURL(blob);
  });
}

/**
 * Claude Vision API で OCR（主要エンジン）
 * ◆ system プロンプト追加 → AI の役割を明確化
 * ◆ JSON 構造化出力 → 製品名・品番を確実に分離
 * ◆ 送信前に自動レベル補正 → コントラスト不足を解消
 * ◆ デュアルフレーム対応 → 2枚を同時送信し文字を相互検証
 */
async function _runClaudeVisionOCR(primaryBlob, secondaryBlob = null) {
  // ── 送信前に自動レベル補正（カラー保持）──
  const enhanced1 = await _enhanceColorForVision(primaryBlob);
  const { base64: b1, mimeType: m1 } = await _blobToBase64(enhanced1);
  const vm1 = ['image/jpeg','image/png','image/gif','image/webp'].includes(m1) ? m1 : 'image/jpeg';

  // ── 選択中メーカーをコンテキストとして注入 ──
  const mfrObj  = S.selectedMfr ? MANUFACTURERS.find(m => m.id === S.selectedMfr) : null;
  const mfrHint = mfrObj
    ? `\n【メーカー補足】選択中のメーカーは「${mfrObj.name}」です。このメーカーの製品ラベルである可能性が高いため、型番・品番の書式をそのメーカーの慣例に合わせて読み取ってください。`
    : '';

  // ── コンテンツ配列を組み立て ──
  const content = [];

  // 1枚目（必須）
  content.push({ type: 'image', source: { type: 'base64', media_type: vm1, data: b1 } });

  // 2枚目（任意: デュアルフレーム）
  let dualNote = '';
  if (secondaryBlob) {
    try {
      const enhanced2 = await _enhanceColorForVision(secondaryBlob);
      const { base64: b2, mimeType: m2 } = await _blobToBase64(enhanced2);
      const vm2 = ['image/jpeg','image/png','image/gif','image/webp'].includes(m2) ? m2 : 'image/jpeg';
      content.push({ type: 'image', source: { type: 'base64', media_type: vm2, data: b2 } });
      dualNote = '\n【補足】2枚の画像は同じ製品ラベルを連続撮影したものです。1枚目で不明瞭な文字は2枚目と照合し、最も正確な文字を特定してください。';
    } catch(_) {}
  }

  content.push({
    type: 'text',
    text: `製品ラベル・製品本体に印字/刻印されたすべての文字を1文字も見逃さず正確に読み取り、指定のJSON形式で出力してください。${mfrHint}${dualNote}

【読み取り優先度】
1. product_name: 最も目立つ製品名・商品名・ブランド名・モデル名（英数混在可）
2. model_number: 型番・品番・ロット番号・シリアル番号・JANコード（英数字+ハイフン/スラッシュ/ドット含む）
3. candidates: 上記以外で読み取れた製品関連テキスト（最大6件、短い文字列も含める）

【精度向上のための追加指示】
- ラベル内のすべての英数字列をcandidatesに含める
- 印字が薄い・小さい部分も可能な限り読む
- 数字と英字が混在する型番は特に慎重に（例: "T-1234A" を "T-I234A" と間違えない）
- 製品名と型番が同一行にある場合は分離して返す
- 読み取り不確実な文字は [ ] で囲む（例: "AB[C?]123"）

JSONのみ出力。`
  });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 512,
      temperature: 0,
      system: 'あなたは工場・倉庫向け製品ラベルのOCR専門AIです。\n必ず以下のJSON形式のみで回答してください。説明文・前置き・Markdownコードブロックは絶対に不要です。\n{"product_name":"製品名またはモデル名","model_number":"品番・型番・ロット番号","candidates":["その他読み取れたテキスト"]}\n\n【必須ルール】\n1. 確実に見える文字だけを返す。不明な文字を推測・補完しない\n2. 特に混同しやすい文字に注意: 0(ゼロ)とO(オー)、1(イチ)とI(アイ)とl(小文字L)、8とB、5とS、6とG、2とZ、D とO、コロン(:)とセミコロン(;)\n3. ハイフン・スラッシュ・ドット・括弧などの記号を省略しない\n4. 大文字・小文字は印字のまま維持する\n5. 複数行にまたがる型番は連結して返す\n6. 読み取れない項目は空文字列 "" にする',
      messages: [{ role: 'user', content }]
    })
  });

  if (!response.ok) throw new Error(`Claude API ${response.status}`);
  const data = await response.json();
  const rawText = (data.content || []).map(c => c.text || '').join('').trim();

  // ── JSON パース試行 ──
  try {
    const jsonStr = rawText.replace(/^```(?:json)?\n?|\n?```$/g, '').trim();
    const parsed = JSON.parse(jsonStr);
    const lines = [];
    if (parsed.product_name && parsed.product_name.trim()) lines.push(parsed.product_name.trim());
    if (parsed.model_number  && parsed.model_number.trim()
        && parsed.model_number.trim() !== (lines[0] || '')) {
      lines.push(parsed.model_number.trim());
    }
    if (Array.isArray(parsed.candidates)) {
      parsed.candidates.forEach(c => {
        const t = (c || '').trim();
        if (t && !lines.includes(t)) lines.push(t);
      });
    }
    if (lines.length > 0) return lines;
  } catch(_) {
    // JSON パース失敗 → テキスト分割にフォールバック
  }

  // フォールバック: テキストを行分割
  return rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
}

/**
 * Tesseract.js フォールバック OCR
 * 前処理済み画像に対して PSM 7→6→11 を試し、結果をスコア順で返す
 */
async function _runTesseractOCR(imageData) {
  if (!window.Tesseract) {
    showToast('OCR ライブラリを読み込み中...', 'default');
    await new Promise((ok, ng) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = ok; s.onerror = ng;
      document.head.appendChild(s);
    });
  }

  // Tesseract 用前処理（グレー化+Otsu+USM）
  const processedBlob = await _preprocessBlobForTesseract(imageData);

  const worker = await Tesseract.createWorker(['jpn', 'eng'], 1, { logger: () => {} });
  const lineMap = new Map(); // line → score（重複排除）

  // PSM 7: 単一テキスト行  PSM 6: 均一ブロック  PSM 11: まばらなテキスト
  for (const psm of ['7', '6', '11']) {
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    const { data: { text } } = await worker.recognize(processedBlob);
    text.split('\n').map(l => l.trim()).filter(l => l.length > 1).forEach(l => {
      if (!lineMap.has(l)) lineMap.set(l, _scoreOCRLine(l));
    });
  }
  await worker.terminate();

  return [...lineMap.entries()].sort((a, b) => b[1] - a[1]).map(([line]) => line);
}

/**
 * 画像 Blob に Tesseract 向け前処理を施したBlobを返す
 * ファイルアップロード時も同一パイプラインを適用
 */
async function _preprocessBlobForTesseract(imageData) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      // 短辺が1200px未満なら2倍以上にスケール
      const scale = Math.max(1, Math.ceil(1200 / Math.min(img.width, img.height)));
      const w = img.width * scale, h = img.height * scale;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      _applyOCRPreprocess(ctx, w, h);
      cv.toBlob(b => { URL.revokeObjectURL(img.src); resolve(b || imageData); }, 'image/png');
    };
    img.onerror = () => resolve(imageData);
    img.src = URL.createObjectURL(imageData);
  });
}

/**
 * OCR 結果行をスコアリング（製品名らしさ）
 * 高いほど製品名・品番として適切な行
 */
function _scoreOCRLine(line) {
  if (!line || line.length < 2) return 0;
  if (line.length > 80) return 0.1;

  // 有効文字（漢字・カナ・英数・記号）の割合
  const useful = (line.match(/[ぁ-んァ-ヶ一-龠a-zA-ZａＺ0-9０-９ー・\-_.\/()（）\[\]]/g) || []).length;
  const ratio = useful / line.length;

  // ノイズ文字（制御文字・パイプ等）
  const noise = (line.match(/[\x00-\x1f|\\@#$%^&*]/g) || []).length;

  // 長さボーナス：4〜45文字が製品名として最も自然
  const lenScore = line.length >= 4 && line.length <= 45 ? 1.0 : 0.5;

  // 型番パターンボーナス（英大文字+数字の混在）
  const hasModelPattern = /[A-Z]{1,5}[-\/]?[0-9]{2,}|[0-9]{2,}[-\/]?[A-Z]{1,5}|[A-Z]{2,}[0-9]{2,}[A-Z0-9]*/.test(line);
  const patternBonus = hasModelPattern ? 0.25 : 0;

  // 日本語含有ボーナス（製品名に多い）
  const hasJapanese = /[ぁ-んァ-ヶ一-龠]/.test(line);
  const jpBonus = hasJapanese ? 0.1 : 0;

  // 数字のみの短い文字列はペナルティ（ロット番号より製品名優先）
  const onlyDigits = /^[0-9\-\/]+$/.test(line);
  const digitPenalty = onlyDigits ? 0.3 : 1.0;

  return Math.min(1.0, ratio * lenScore * Math.max(0, 1 - noise / line.length * 2) * digitPenalty + patternBonus + jpBonus);
}

/**
 * 全角英数字→半角 / 前後空白除去 などの正規化
 * 日本語製品ラベルで多発する全角混在を統一する
 */
function _normalizeOCRText(text) {
  if (!text) return text;
  let t = text
    // 全角英大文字→半角
    .replace(/[Ａ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    // 全角英小文字→半角
    .replace(/[ａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    // 全角数字→半角
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    // 全角記号（！〜範囲）→半角
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    // 全角スペース→半角
    .replace(/　/g, ' ')
    // 連続スペース圧縮 & 前後トリム
    .replace(/\s+/g, ' ')
    .trim();

  // ── OCR アーティファクト空白の除去 ──────────────────────
  // 「A B C - 1 2 3」のように大半のトークンが1文字 → スペースをまとめて除去
  const tokens = t.split(' ');
  const singleCount = tokens.filter(tok => tok.length === 1).length;
  if (tokens.length >= 3 && singleCount / tokens.length >= 0.65) {
    t = tokens.join('');
  }

  return t;
}

/** OCR 処理メイン
 *  primaryData:   撮影最良フレーム Blob
 *  secondaryData: 2番目フレーム Blob (デュアルフレーム Vision 用、省略可)
 *  isRetry:       自動リトライか否か（無限ループ防止）
 */
async function processOCR(primaryData, secondaryData = null, isRetry = false) {
  const loadingEl = document.getElementById('ocrLoading');
  const resultEl  = document.getElementById('ocrResultArea');
  if (loadingEl) loadingEl.style.display = 'flex';
  if (resultEl)  resultEl.style.display  = 'none';
  try {
    let lines = null;

    // ── ① Claude Vision API（主要 OCR） ────────────────────
    try {
      lines = await _runClaudeVisionOCR(primaryData, isRetry ? null : secondaryData);
    } catch(apiErr) {
      console.warn('Claude Vision OCR failed, falling back to Tesseract:', apiErr);
    }

    // ── ② Tesseract（フォールバック） ──────────────────────
    if (!lines || !lines.length) {
      lines = await _runTesseractOCR(primaryData);
    }

    if (loadingEl) loadingEl.style.display = 'none';

    if (!lines || !lines.length) {
      showToast('文字を認識できませんでした。再撮影してください。', 'error');
      return;
    }

    // ── ③ 全角→半角 正規化 ────────────────────────────────
    lines = lines.map(_normalizeOCRText).filter(l => l.length > 0);

    // スコアリングで最適な行を先頭に並べ替え
    const scored = [...new Set(lines)]  // 重複除去
      .map(l => ({ line: l, score: _scoreOCRLine(l) }))
      .sort((a, b) => b.score - a.score);

    // ── ④ 自動リトライ（1回限り） ────────────────────────
    // 最良候補のスコアが低い、または文字数が短すぎる場合に再解析
    const topScore = scored[0]?.score ?? 0;
    const topLen   = scored[0]?.line.length ?? 0;
    if (!isRetry && (topScore < 0.25 || topLen < 3)) {
      console.log('[OCR] weak result, auto-retrying with single frame...');
      showToast('精度が低いため再解析中...', 'default');
      await processOCR(primaryData, null, true);
      return;
    }

    showOCRResult(scored[0].line, scored.map(s => s.line));

  } catch(e) {
    console.error('OCR error:', e);
    if (loadingEl) loadingEl.style.display = 'none';
    showToast('OCR 処理に失敗しました', 'error');
  }
}

let _swStartX = null;
let _swStartY = null;
let _swInner  = null;
let _swDx     = 0;
const SW_MAX  = 80;   // px — 完全に開いた状態
const SW_DEL  = 72;   // px — この距離以上でスワイプ削除確定

function _initSwipeDelete() {
  document.querySelectorAll('.swipe-row').forEach(row => {
    const inner = row.querySelector('.hist-item');
    const bg    = row.querySelector('.swipe-del-bg');
    const name  = row.dataset.name;

    row.addEventListener('touchstart', e => {
      _swStartX = e.touches[0].clientX;
      _swStartY = e.touches[0].clientY;
      _swInner  = inner;
      _swDx     = 0;
      inner.classList.add('swiping');
      if (bg) bg.style.opacity = '1';
    }, { passive: true });

    row.addEventListener('touchmove', e => {
      if (_swInner !== inner) return;
      const dx = e.touches[0].clientX - _swStartX;
      const dy = e.touches[0].clientY - _swStartY;
      // 縦スクロールが主体のときはスワイプしない
      if (Math.abs(dy) > Math.abs(dx) + 6) return;
      if (dx > 0) { inner.style.transform = 'translateX(0)'; return; }
      _swDx = Math.max(dx, -SW_MAX);
      inner.style.transform = `translateX(${_swDx}px)`;
    }, { passive: true });

    row.addEventListener('touchend', () => {
      if (_swInner !== inner) return;
      inner.classList.remove('swiping');
      if (_swDx <= -SW_DEL) {
        // 削除アニメーション
        inner.style.transform = `translateX(-${SW_MAX}px)`;
        row.style.transition   = 'max-height .22s ease, opacity .18s ease, margin .22s ease, padding .22s ease';
        row.style.maxHeight    = row.offsetHeight + 'px';
        row.style.overflow     = 'hidden';
        requestAnimationFrame(() => {
          row.style.maxHeight = '0';
          row.style.opacity   = '0';
          row.style.margin    = '0';
        });
        setTimeout(() => deleteProduct(name), 230);
      } else {
        inner.style.transform = 'translateX(0)';
        if (bg) bg.style.opacity = '0';
      }
      _swStartX = null; _swInner = null; _swDx = 0;
    });
  });
}

/**
 * スマホキーボード対応：入力欄と候補リストがキーボードの上に来るようスクロール
 * visualViewport API でキーボード高さを検知する
 */
function _scrollInputIntoView() {
  const input = document.getElementById('productInput');
  if (!input) return;

  const doScroll = () => {
    // visualViewport が使える場合はキーボード込みの実際の表示領域を使う
    const vvh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const vvOffsetTop = (window.visualViewport ? window.visualViewport.offsetTop : 0);
    const rect = input.getBoundingClientRect();

    // 入力欄の上端 + 候補リストの推定高さ + 余白
    const SUGGEST_ESTIMATE = 230; // 候補数により変動するが余裕を見て固定
    const PADDING = 16;
    const inputBottom = rect.bottom; // ビューポート上端からの距離
    const needed = inputBottom + SUGGEST_ESTIMATE + PADDING;

    if (needed > vvh) {
      // スクロール量 = はみ出た分だけ
      const extra = needed - vvh;
      // iOS では window.scrollBy が最も安定
      window.scrollBy({ top: extra, behavior: 'smooth' });
    }
  };

  // キーボードのアニメーション（約300ms）が完了してからスクロール
  setTimeout(doScroll, 320);
}

function onProductInput(val) {
  S.productName = val;

// 検索候補の1アイテムをHTMLで返す

  let display = it;
  if (query) {
    const idx = it.toLowerCase().indexOf(query.toLowerCase());
    if (idx >= 0) {
      display = it.slice(0, idx)
        + `<span style="color:var(--primary);font-weight:700">${it.slice(idx, idx + query.length)}</span>`
        + it.slice(idx + query.length);
    }
  }
  return `
  <div class="suggest-item" onmousedown="pickProduct('${it.replace(/'/g,"\\'")}')" onclick="pickProduct('${it.replace(/'/g,"\\'")}')">
    <span class="suggest-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </span>
    <span class="suggest-text">${display}</span>
    <span class="suggest-fill" title="入力欄に挿入">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round">
        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
      </svg>
    </span>
  </div>`;
}

function showSuggest(items, query) {
  const dd = document.getElementById('suggestDd');
  if (!items.length) { hideSuggest(); return; }

  // キーボード表示中は残り空間に合わせて候補リストの高さを制限
  const input = document.getElementById('productInput');
  if (input) {
    const vvh  = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const rect = input.getBoundingClientRect();
    const spaceBelow = vvh - rect.bottom - 12; // 12px 余白
    const maxH = Math.max(80, Math.min(260, spaceBelow)); // 最小80px、最大260px
    dd.style.setProperty('--suggest-max-h', maxH + 'px');
  }

  // 検査履歴から「製品名 → メーカー」のマップを構築
  const inspections = load('inspections', []);
  const productMfrMap = {}; // productName -> { id, name }（最後に使ったメーカーを採用）
  inspections.forEach(insp => {
    if (insp.productName && insp.manufacturerId) {
      productMfrMap[insp.productName] = { id: insp.manufacturerId, name: insp.manufacturerName || insp.manufacturerId };
    }
  });

  // メーカーごとにグループ化
  const mfrGroups = {}; // mfrId -> { name, items: [] }
  const ungrouped = [];

  items.slice(0, 20).forEach(it => {
    const mfr = productMfrMap[it];
    if (mfr) {
      if (!mfrGroups[mfr.id]) {
        mfrGroups[mfr.id] = { name: mfr.name, items: [] };
      }
      mfrGroups[mfr.id].items.push(it);
    } else {
      ungrouped.push(it);
    }
  });

  // 選択中メーカーを先頭に
  const groupOrder = Object.keys(mfrGroups);
  if (S.selectedMfr && mfrGroups[S.selectedMfr]) {
    const idx = groupOrder.indexOf(S.selectedMfr);
    if (idx > 0) { groupOrder.splice(idx, 1); groupOrder.unshift(S.selectedMfr); }
  }

  let html = '';
  groupOrder.forEach(mfrId => {
    const grp = mfrGroups[mfrId];
    html += `<div class="suggest-mfr-header">${grp.name}</div>`;
    grp.items.forEach(it => { html += _suggestItemHtml(it, query); });
  });

  if (ungrouped.length) {
    if (groupOrder.length) html += `<div class="suggest-mfr-header">その他</div>`;
    ungrouped.forEach(it => { html += _suggestItemHtml(it, query); });
  }

  dd.innerHTML = html;
  dd.style.display = 'block';
}

function hideSuggest() {
  document.getElementById('suggestDd').style.display = 'none';
}

async function startCamera() {
  // 制約を段階的に緩めてフォールバック
  // 1. 要求したfacingMode + 高解像度
  // 2. facingModeなし（任意カメラ）+ 解像度ヒント
  // 3. video: true（最もシンプル）
  const attempts = [
    { facingMode: S.camFacing, width:{ideal:1920}, height:{ideal:1080} },
    { width:{ideal:1280}, height:{ideal:720} },
    true,
  ];

  let stream = null;
  let lastErr = null;

  for (const video of attempts) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video, audio:false });
      break;
    } catch(err) {
      lastErr = err;
      // パーミッション拒否は再試行しても無意味なので即終了
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') break;
    }
  }

  if (!stream) {
    console.warn('Camera:', lastErr);
    const msg = lastErr?.name === 'NotAllowedError'
      ? 'カメラのアクセスが拒否されました。'
      : 'カメラが見つかりません。ファイルを選択してください。';
    showToast(msg, 'warning');
    return;
  }

  S.camStream = stream;
  const v = document.getElementById('camVideo');
  v.srcObject = stream;
  v.style.display = 'block';
  document.getElementById('camPlaceholder').style.display = 'none';
  document.getElementById('camFrameEl').style.display = 'block';
  document.getElementById('camControls').style.display = 'flex';
  document.getElementById('camStopBtn').style.display = 'flex';
  showToast('カメラを起動しました','success');
}

function stopCamera() {
  if (!S.camStream) return;
  S.camStream.getTracks().forEach(t => t.stop());
  S.camStream = null;
  const v = document.getElementById('camVideo');
  v.srcObject = null;
  v.style.display = 'none';
  document.getElementById('camPlaceholder').style.display = 'flex';
  document.getElementById('camFrameEl').style.display = 'none';
  document.getElementById('camControls').style.display = 'none';
  document.getElementById('camStopBtn').style.display = 'none';
}

async function flipCamera() {
  S.camFacing = S.camFacing === 'environment' ? 'user' : 'environment';
  if (S.camStream) { stopCamera(); await startCamera(); }
}

/**
 * dataURL を受け取り、長辺を maxPx 以内にリサイズして
 * JPEG quality で再エンコードした dataURL を返す。
 */
function compressImage(dataUrl, maxPx = 1280, quality = 0.75) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w >= h) { h = Math.round(h / w * maxPx); w = maxPx; }
        else        { w = Math.round(w / h * maxPx); h = maxPx; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

async function capturePhoto() {
  const v = document.getElementById('camVideo');
  if (!v.srcObject) { showToast('カメラが起動していません','error'); return; }
  const c = document.getElementById('captureCanvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  // 撮影フラッシュ
  const a = document.getElementById('camArea');
  a.style.filter = 'brightness(2.5)';
  setTimeout(() => a.style.filter = '', 110);
  // 圧縮してから保存
  const compressed = await compressImage(c.toDataURL('image/jpeg', 1.0), 1280, 0.75);
  addPhoto(compressed);
  showToast('撮影しました','success');
}

function onFileSelected(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = async e => {
      const compressed = await compressImage(e.target.result, 1280, 0.75);
      addPhoto(compressed);
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoGrid() {

                         : photo.usability === 'fail' ? { cls: 'fail', txt: '✕ 使用否' }
                         : null;
    const judgeLabel = photo.judgeType === '恒久判断' ? { cls: 'perm', txt: '● 恒久' }
                     : photo.judgeType === '暫定判断' ? { cls: 'prov', txt: '● 暫定' }
                     : null;
    const hasAnyLabel = usabilityLabel || judgeLabel;
    return `
    <div class="photo-wrap">
      <img src="${photo.url}" class="photo-thumb" onclick="openAnnotator(${i})">
      <button class="photo-del" onclick="removePhoto(${i})">✕</button>
      <div class="photo-annot-btn" onclick="openAnnotator(${i})">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="11" height="11" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      ${usabilityLabel ? `<div class="photo-judge-label ${usabilityLabel.cls}" onclick="openPhotoJudge(${i})">${usabilityLabel.txt}</div>` : ''}
      ${judgeLabel ? `<div class="photo-judge-label ${judgeLabel.cls}" onclick="openPhotoJudge(${i})">${judgeLabel.txt}</div>` : ''}
      ${!hasAnyLabel ? `<button class="photo-judge-set-btn" onclick="openPhotoJudge(${i})">＋判定設定</button>` : ''}
    </div>`;
  }).join('');
}

const annotState = {
  photoIdx: -1, circles: [],
  drawing: false, startX: 0, startY: 0, img: null,
  addMode: false,
  // 移動・リサイズ用
  selectedIdx: -1,
  dragMode: null,      // 'move' | 'resize' | null
  dragStartX: 0, dragStartY: 0,
  dragOrigCx: 0, dragOrigCy: 0, dragOrigR: 0,
};

function updateAnnotHint() {
  const hint = document.getElementById('annotHint');
  if (annotState.addMode) {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
      <span style="color:#ef4444;font-weight:700">追加モード：ドラッグで丸を描く</span>`;
  } else if (annotState.selectedIdx >= 0) {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
      <span style="color:rgba(255,255,255,.85)">中央ドラッグ→移動　端ドラッグ→リサイズ</span>
      <button onclick="deleteSelectedCircle()" style="margin-left:8px;padding:3px 11px;border-radius:100px;background:#ef4444;border:none;color:#fff;font-size:11px;font-weight:700;cursor:pointer">✕ 削除</button>`;
  } else {
    hint.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      丸をタップ→移動・リサイズ　／　「丸を追加」で新規`;
  }
}

function deleteSelectedCircle() {
  if (annotState.selectedIdx < 0) return;
  annotState.circles.splice(annotState.selectedIdx, 1);
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  redrawAnnotCanvas();
  updateAnnotHint();
}

function toggleAddMode() {
  annotState.addMode = !annotState.addMode;
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  const btn = document.getElementById('annotAddBtn');
  if (annotState.addMode) {
    btn.style.background = '#ef4444';
    btn.style.borderColor = '#ef4444';
    btn.style.color = '#fff';
  } else {
    btn.style.background = '#fee2e2';
    btn.style.borderColor = '#fca5a5';
    btn.style.color = '#ef4444';
  }
  redrawAnnotCanvas();
  updateAnnotHint();
}

function openAnnotator(i) {
  annotState.photoIdx = i;
  annotState.circles  = [];
  annotState.drawing  = false;
  annotState.addMode  = false;
  annotState.selectedIdx = -1;
  annotState.dragMode = null;
  const canvas = document.getElementById('annotCanvas');
  const img = new Image();
  img.onload = () => {
    annotState.img    = img;
    canvas.width      = img.naturalWidth;
    canvas.height     = img.naturalHeight;
    redrawAnnotCanvas();
    // ボタン外観をリセット
    const btn = document.getElementById('annotAddBtn');
    btn.style.background = '#fee2e2';
    btn.style.borderColor = '#fca5a5';
    btn.style.color = '#ef4444';
    updateAnnotHint();
    document.getElementById('annotBg').classList.add('show');
  };
  img.src = S.photos[i].url;
}

function closeAnnotator() {
  document.getElementById('annotBg').classList.remove('show');
}

function getEventPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  let cx, cy;
  if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}

function redrawAnnotCanvas() {
  const canvas = document.getElementById('annotCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (annotState.img) ctx.drawImage(annotState.img, 0, 0);
  const lw = Math.max(4, canvas.width / 100);

  for (let i = 0; i < annotState.circles.length; i++) {
    const c = annotState.circles[i];
    const isSelected = (i === annotState.selectedIdx);

    // メイン円
    ctx.beginPath();
    ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
    ctx.strokeStyle = '#ff1f1f';
    ctx.lineWidth   = lw;
    ctx.stroke();

    if (isSelected) {
      // 選択中：外側に白い点線リング
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, c.r + lw * 1.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = lw * 0.5;
      ctx.setLineDash([lw * 2.5, lw * 1.2]);
      ctx.stroke();
      ctx.restore();

      // 中央ハンドル（移動用 ●）
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, lw * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ff1f1f';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = lw * 0.5;
      ctx.stroke();

      // 端ハンドル（リサイズ用 ○）
      const hx = c.cx + c.r;
      const hy = c.cy;
      ctx.beginPath();
      ctx.arc(hx, hy, lw * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#ff1f1f';
      ctx.lineWidth = lw * 0.7;
      ctx.stroke();
    }
  }
}

function annotPointerDown(e) {
  e.preventDefault();
  const canvas = document.getElementById('annotCanvas');
  const pos = getEventPos(e, canvas);

  if (annotState.addMode) {
    // 描画モード
    annotState.drawing = true;
    annotState.startX  = pos.x;
    annotState.startY  = pos.y;
    return;
  }

  // 既存の丸にヒットしているか確認（上から順に）
  let hitIdx = -1;
  let hitMode = null;
  for (let i = annotState.circles.length - 1; i >= 0; i--) {
    const c = annotState.circles[i];
    const dist = Math.hypot(pos.x - c.cx, pos.y - c.cy);
    if (dist <= c.r * 1.35) {
      hitIdx = i;
      // 中心寄り → 移動、端寄り → リサイズ
      hitMode = dist <= c.r * 0.6 ? 'move' : 'resize';
      break;
    }
  }

  annotState.selectedIdx = hitIdx;
  if (hitIdx >= 0) {
    const c = annotState.circles[hitIdx];
    annotState.dragMode    = hitMode;
    annotState.dragStartX  = pos.x;
    annotState.dragStartY  = pos.y;
    annotState.dragOrigCx  = c.cx;
    annotState.dragOrigCy  = c.cy;
    annotState.dragOrigR   = c.r;
  } else {
    annotState.dragMode = null;
  }

  redrawAnnotCanvas();
  updateAnnotHint();
}

function annotPointerMove(e) {
  e.preventDefault();
  const canvas = document.getElementById('annotCanvas');
  const pos = getEventPos(e, canvas);

  // 描画モード中のプレビュー
  if (annotState.addMode && annotState.drawing) {
    redrawAnnotCanvas();
    const cx = (annotState.startX + pos.x) / 2;
    const cy = (annotState.startY + pos.y) / 2;
    const r  = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY) / 2;
    if (r > 2) {
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff1f1f';
      ctx.lineWidth   = Math.max(4, canvas.width / 100);
      ctx.stroke();
    }
    return;
  }

  // 移動・リサイズ
  if (!annotState.dragMode || annotState.selectedIdx < 0) return;
  const c = annotState.circles[annotState.selectedIdx];

  if (annotState.dragMode === 'move') {
    c.cx = annotState.dragOrigCx + (pos.x - annotState.dragStartX);
    c.cy = annotState.dragOrigCy + (pos.y - annotState.dragStartY);
  } else if (annotState.dragMode === 'resize') {
    const newR = Math.hypot(pos.x - annotState.dragOrigCx, pos.y - annotState.dragOrigCy);
    c.r = Math.max(canvas.width / 40, newR);
  }

  redrawAnnotCanvas();
}

function annotPointerUp(e) {
  e.preventDefault();

  // 描画モード終了
  if (annotState.addMode && annotState.drawing) {
    annotState.drawing = false;
    const canvas = document.getElementById('annotCanvas');
    const pos = getEventPos(e, canvas);
    const cx = (annotState.startX + pos.x) / 2;
    const cy = (annotState.startY + pos.y) / 2;
    const r  = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY) / 2;
    if (r > canvas.width / 80) {
      annotState.circles.push({ cx, cy, r });
      // 描いたら追加モードをオフ
      annotState.addMode = true;
      toggleAddMode();
    }
    redrawAnnotCanvas();
    return;
  }

  // ドラッグ終了
  annotState.dragMode = null;
}

function undoAnnotation() {
  if (!annotState.circles.length) { showToast('元に戻す操作がありません', 'default'); return; }
  annotState.circles.pop();
  redrawAnnotCanvas();
}

function clearAnnotations() {
  if (!annotState.circles.length) return;
  annotState.circles = [];
  redrawAnnotCanvas();
}

async function saveAnnotation() {
  if (!annotState.circles.length) { closeAnnotator(); return; }
  const canvas = document.getElementById('annotCanvas');
  const raw    = canvas.toDataURL('image/jpeg', 0.92);
  const compressed = await compressImage(raw, 1280, 0.85);
  S.photos[annotState.photoIdx].url = compressed;
  renderPhotoGrid();
  closeAnnotator();
  showToast('注釈を保存しました', 'success');
}

function deriveOverallResult() {
  const vals = S.photos.map(p => p.usability).filter(Boolean);
  if (!vals.length) return null;
  if (vals.includes('fail')) return 'fail';
  return 'pass';
}

function deriveOverallJudgeType() {
  const vals = S.photos.map(p => p.judgeType).filter(Boolean);
  if (!vals.length) return null;
  if (vals.includes('暫定判断')) return '暫定判断';
  return '恒久判断';
}

function showSaveConfirm() {
  const productName = document.getElementById('productInput').value.trim();

  if (!S.selectedMfr)  { showToast('メーカーを選択してください','error');   scrollToCard('mfr-card'); return; }
  if (!productName)     { showToast('製品名を入力してください','error');      return; }
  if (!S.selectedInsp) { showToast('確認者を選択してください','error');      return; }

  const mfr  = MANUFACTURERS.find(m => m.id === S.selectedMfr);
  const insp = getInspectors().find(i => i.id === S.selectedInsp);

  const derived      = deriveOverallResult();
  const derivedJudge = deriveOverallJudgeType();

  const resultBadge = derived === 'pass'
    ? `<span class="sc-badge pass">✓ 使用可</span>`
    : derived === 'fail'
    ? `<span class="sc-badge fail">✕ 使用否</span>`
    : `<span class="sc-badge" style="background:var(--surface-2);color:var(--text-2)">未設定</span>`;

  const judgeBadge = derivedJudge === '恒久判断'
    ? `<span class="sc-badge perm">● 恒久判断</span>`
    : derivedJudge === '暫定判断'
    ? `<span class="sc-badge prov">● 暫定判断</span>`
    : '';

  // 写真判定サマリー
  const passCount = S.photos.filter(p => p.usability === 'pass').length;
  const failCount = S.photos.filter(p => p.usability === 'fail').length;
  const noneCount = S.photos.filter(p => !p.usability).length;
  const photoSummaryParts = [];
  if (passCount) photoSummaryParts.push(`使用可 ${passCount}枚`);
  if (failCount) photoSummaryParts.push(`使用否 ${failCount}枚`);
  if (noneCount) photoSummaryParts.push(`未設定 ${noneCount}枚`);

  const rows = [
    { lbl: 'メーカー', val: mfr  ? mfr.name  : '—' },
    { lbl: '製品名',   val: productName },
    { lbl: '確認者',   val: insp ? insp.name : '—' },
  ];

  if (S.photos.length) {
    rows.push({
      lbl: '写真判定',
      html: `<span class="sc-val">${S.photos.length}枚 ／ ${photoSummaryParts.join('・') || '未設定'}</span>`
    });
  }
  if (derived) {
    rows.push({ lbl: '総合判定', html: resultBadge + (judgeBadge ? '&nbsp;' + judgeBadge : '') });
  }
  if (S.defects.length) {
    rows.push({ lbl: '不良内容', val: S.defects.join('、') });
  }

  document.getElementById('scRows').innerHTML = rows.map(r => `
    <div class="sc-row">
      <span class="sc-lbl">${r.lbl}</span>
      ${r.html ? r.html : `<span class="sc-val">${r.val}</span>`}
    </div>`).join('');

  document.getElementById('saveConfirmBg').classList.add('show');
}

  document.getElementById('saveConfirmBg').classList.remove('show');
}

// 保存

async function saveInspection() {
  const productName = document.getElementById('productInput').value.trim();

  // バリデーション
  if (!S.selectedMfr)   { showToast('メーカーを選択してください','error'); scrollToCard('mfr-card'); return; }
  if (!productName)      { showToast('製品名を入力してください','error'); return; }
  if (!S.selectedInsp)  { showToast('確認者を選択してください','error'); return; }

  const mfr  = MANUFACTURERS.find(m => m.id === S.selectedMfr);
  const insp = getInspectors().find(i => i.id === S.selectedInsp);

  const overallResult    = deriveOverallResult();
  const overallJudgeType = deriveOverallJudgeType();

  // 写真を圧縮保存
  showToast('保存中...','default');
  const uploadedPhotos = await Promise.all(S.photos.map(p => uploadPhoto(p.url)));

  const record = {
    id: uid(),
    manufacturerId:   S.selectedMfr,
    manufacturerName: mfr  ? mfr.name  : '不明',
    productName,
    inspectorId:      S.selectedInsp,
    inspectorName:    insp ? insp.name : '不明',
    createdByName:    currentUserProfile?.name || '不明',
    result:    overallResult || 'review',
    judgeType: overallJudgeType,
    defects:   [...S.defects],
    comment:   '',
    photos:    uploadedPhotos,
    createdAt: new Date().toISOString(),
  };

  const list = load('inspections', []);
  list.unshift(record);
  save('inspections', list);

  // 製品履歴更新
  const ph = load('products', SAMPLE_PRODUCTS);
  save('products', [productName, ...ph.filter(p => p !== productName)].slice(0, 30));

  const lbls = { pass:'使用可', fail:'使用否', review:'未判定' };
  const judgeStr = overallJudgeType ? ` / ${overallJudgeType}` : '';
  showToast(`保存しました（${lbls[overallResult] || '未判定'}${judgeStr}）`, 'success');
  resetForm();
}

function renderHist() {

  const q = S.histSearch.toLowerCase();

  const data = all.filter(r => {
    const mq = !q || r.productName.toLowerCase().includes(q) || r.manufacturerName.toLowerCase().includes(q);
    const mf = f === 'all' || r.result === f;
    return mq && mf;

  const lbls = { pass:'使用可', fail:'使用否' };

  const el = document.getElementById('histList');
  if (!data.length) {
    el.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>

    // ステータスクラスとアイコン

      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="18" height="18" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`

      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="18" height="18" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="18" height="18" stroke-linecap="round"><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>`;

    // 判断区分バッジ色

      ? `<span class="h-badge-sub" style="color:${r.judgeType==='恒久判断'?'#3b82f6':'var(--review)'};background:${r.judgeType==='恒久判断'?'#eff6ff':'var(--review-dim)'}">${r.judgeType}</span>`

             style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;

           </button>
         </div>`
      : `<div class="hc-right">
           <div class="hc-date-row">
             <span>${fmtDate(r.createdAt)}</span>
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
           </div>
         </div>`;

    return `<div class="hist-card hc-${sc}" style="${cardStyle}" ${clickAttr}>
      <div class="hc-icon-wrap">
        <div class="hc-icon ${sc}">${icon}</div>
      </div>
      <div class="h-main">
        <div class="h-product">${r.productName}</div>
        <div class="h-meta">
          <span>${r.manufacturerName}</span>
          <span class="h-sep">|</span>
          <span>${r.inspectorName}</span>
        </div>
        <div class="h-row">

function renderStats() {
  const all = load('inspections', []);
  const pass   = all.filter(r => r.result === 'pass').length;
  const fail   = all.filter(r => r.result === 'fail').length;
  const review = all.filter(r => r.result === 'review').length;
  const total  = all.length;

  document.getElementById('stPass').textContent   = pass;
  document.getElementById('stFail').textContent   = fail;

  drawDonut(pass, fail, review, total);
  drawMfrBars(all);
  drawMonthBars(all);
}

function drawDonut(pass, fail, review, total) {
  const svg    = document.getElementById('donutSvg');
  const legend = document.getElementById('donutLegend');
  const R = 68, cx = 100, cy = 100;
  const C = 2 * Math.PI * R;

  if (!total) {
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--border)" stroke-width="22"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="12" fill="var(--text-3)" font-family="sans-serif">データなし</text>`;
    legend.innerHTML = '';
    return;
  }

  const segs = [
    { val:pass,   color:'var(--pass)',   lbl:'使用可' },
    { val:fail,   color:'var(--fail)',   lbl:'使用否' },
    { val:review, color:'var(--review)', lbl:'要確認' },
  ].filter(s => s.val > 0);

  let off = 0, paths = '';
  segs.forEach(s => {
    const dash = (s.val / total) * C;
    paths += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="22"
      stroke-dasharray="${dash} ${C - dash}"
      stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})" opacity=".88"/>`;
    off += dash;
  });

  svg.innerHTML = paths +
    `<text x="${cx}" y="${cy-7}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--text)" font-family="sans-serif">${total}</text>
     <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="11" fill="var(--text-2)" font-family="sans-serif">総数</text>`;

  legend.innerHTML = segs.map(s => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <div style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0"></div>
      <span style="font-size:13px;color:var(--text-2);font-weight:500">${s.lbl}</span>
      <span style="font-size:15px;font-weight:800;color:var(--text);margin-left:8px">${s.val}</span>
    </div>
  `).join('');
}

function drawMfrBars(all) {
  const cnt = {};
  all.filter(r => r.result === 'fail').forEach(r => {
    cnt[r.manufacturerName] = (cnt[r.manufacturerName] || 0) + 1;
  });
  const sorted = Object.entries(cnt).sort((a,b) => b[1]-a[1]).slice(0,5);
  const max = sorted[0]?.[1] || 1;
  const el = document.getElementById('mfrChart');
  if (!sorted.length) { el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">データなし</div>`; return; }
  el.innerHTML = sorted.map(([name,cnt]) => `
    <div class="bar-item">
      <div class="bar-lbl">${name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(cnt/max*100).toFixed(1)}%;background:linear-gradient(90deg,#f87171,#ef4444)"></div>
      </div>
      <div class="bar-cnt">${cnt}</div>
    </div>
  `).join('');
}

function drawMonthBars(all) {
  const months = {};
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months[k] = { lbl:`${d.getMonth()+1}月`, pass:0, fail:0, review:0 };
  }
  all.forEach(r => {
    const d = new Date(r.createdAt);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (months[k]) months[k][r.result]++;
  });

  const data   = Object.values(months);
  const maxV   = Math.max(...data.map(d => d.pass + d.fail + d.review), 1);
  const BAR_H  = 80;

  document.getElementById('monthChart').innerHTML = data.map(d => {
    const tot = d.pass + d.fail + d.review;
    const h   = tot > 0 ? Math.max(6, (tot / maxV) * BAR_H) : 4;
    const ph  = tot ? (d.pass   / tot) * h : 0;
    const fh  = tot ? (d.fail   / tot) * h : 0;
    const rh  = tot ? (d.review / tot) * h : h;
    return `<div class="month-bar">
      ${tot ? `<div class="month-cnt">${tot}</div>` : '<div class="month-cnt" style="opacity:0">0</div>'}
      <div class="month-bar-inner" style="height:${h}px">
        <div style="height:${rh}px;background:var(--review)"></div>
        <div style="height:${fh}px;background:var(--fail)"></div>
        <div style="height:${ph}px;background:var(--pass)"></div>
      </div>
      <div class="month-lbl">${d.lbl}</div>
    </div>`;
  }).join('');
}

           <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" width="12" height="12" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
         </button>`;
    return `<div class="s-item" style="padding:11px 16px;gap:12px">
      <div style="flex:1;min-width:0">

  el.innerHTML = rows;

function renderUserList(users) {

    const adminBadge = u.isAdmin ? `<span class="badge-admin">管理者</span>` : '';
    const disabledBadge = u.disabled ? `<span class="badge-disabled">無効</span>` : '';

    return `

          <div class="user-sub-lbl">

        </div>
        <div class="user-actions">
          <button class="u-btn edit" onclick="openUserEditModal('${u.uid}')">編集</button>
          ${!isMe ? (
            u.disabled
              ? `<button class="u-btn restore" onclick="restoreUser('${u.uid}')">復元</button>`
              : `<button class="u-btn del" onclick="confirmDisableUser('${u.uid}', '${(u.name||'このユーザー').replace(/'/g,"\\'")}')">削除</button>`

async function saveUserEdit() {
  const uid   = document.getElementById('editUserId').value;
  const name  = document.getElementById('editUserName').value.trim();
  const empId = document.getElementById('editUserEmpId').value.trim();
  const isAdm = document.getElementById('editAdminToggle').classList.contains('on');

  if (!name) { showToast('氏名を入力してください', 'error'); return; }

  try {
    const updates = { name, employeeId: empId, initials: name.charAt(0), isAdmin: isAdm };
    await db.collection('users').doc(uid).update(updates);

    // ローカルキャッシュ更新
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) Object.assign(_allUsersCache[idx], updates);

    // 確認者リストも更新
    const inspList = getInspectors();
    const inspIdx  = inspList.findIndex(i => i.id === uid);
    if (inspIdx >= 0) {
      inspList[inspIdx].name = name;
      inspList[inspIdx].employeeId = empId;
      inspList[inspIdx].initials = name.charAt(0);
      save('inspectors', inspList);
      renderInspectors();
    }

    // 自分自身のプロフィールを更新
    if (uid === currentUser?.uid) {
      currentUserProfile = { ...currentUserProfile, ...updates };
      document.getElementById('userEmail').textContent = name;
      document.getElementById('userEmpId').textContent = empId || '';
      document.getElementById('settingsUserName').textContent = name;
      const settingsEmpEl2 = document.getElementById('settingsUserEmp');
      if (settingsEmpEl2) settingsEmpEl2.textContent = empId ? `社員ID: ${empId}` : currentUser.email;
    }

    closeUserEditModal();
    renderUserList(_allUsersCache);
    showToast('ユーザー情報を更新しました', 'success');
  } catch(e) {
    showToast('更新に失敗しました', 'error');
  }
}

function confirmDisableUser(uid, name) {
  document.getElementById('confirmTitle').textContent = 'ユーザーを削除しますか？';
  document.getElementById('confirmMsg').textContent   =
    `「${name}」さんを無効にします。ログインできなくなります。（データは保持されます）`;
  document.getElementById('confirmOk').textContent = '削除する';
  document.getElementById('confirmOk').onclick = () => { disableUser(uid); closeConfirm(); };
  document.getElementById('confirmModal').classList.add('show');
}

async function disableUser(uid) {
  try {
    await db.collection('users').doc(uid).update({ disabled: true });

    // ローカルキャッシュ更新
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) _allUsersCache[idx].disabled = true;

    // 確認者リストから削除
    const inspList = getInspectors().filter(i => i.id !== uid);
    save('inspectors', inspList);
    renderInspectors();

    renderUserList(_allUsersCache);
    showToast('ユーザーを無効にしました', 'default');
  } catch(e) {
    showToast('削除に失敗しました', 'error');
  }
}

async function restoreUser(uid) {
  try {
    await db.collection('users').doc(uid).update({ disabled: false });
    const idx = _allUsersCache.findIndex(x => x.uid === uid);
    if (idx >= 0) _allUsersCache[idx].disabled = false;
    renderUserList(_allUsersCache);
    showToast('ユーザーを復元しました', 'success');
  } catch(e) {
    showToast('復元に失敗しました', 'error');
  }
}

function init() {
  // ダークモード復元（localStorageのまま）
  try {
    if (localStorage.getItem(DARK_KEY) === 'true') {
      document.documentElement.setAttribute('data-theme','dark');
      document.getElementById('darkToggle').classList.add('on');
    }
  } catch(e) {}

  // ── スマホキーボード対応 ──────────────────────────────────────
  // visualViewport がリサイズされたとき（＝キーボード開閉時）に
  // 製品名入力欄がアクティブなら候補リストが見えるよう再スクロール
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      if (document.activeElement && document.activeElement.id === 'productInput') {
        // リサイズイベントは連続発火するので debounce は不要（最後の値で判定）
        const vvh  = window.visualViewport.height;
        const rect = document.activeElement.getBoundingClientRect();
        const SUGGEST_ESTIMATE = 230;
        const PADDING = 16;
        const needed = rect.bottom + SUGGEST_ESTIMATE + PADDING;
        if (needed > vvh) {
          window.scrollBy({ top: needed - vvh, behavior: 'smooth' });
        }
      }
    });
  }
}

function toggleDark() {
  const t = document.getElementById('darkToggle');
  const on = t.classList.toggle('on');
  document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light');
  try { localStorage.setItem(DARK_KEY, on); } catch(e) {}
}
